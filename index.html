if(touches.size>=2){var arr=[];touches.forEach(function(v){arr.push(v)});var d=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);if(pinchDist>0){var mx=(arr[0].x+arr[1].x)/2,my=(arr[0].y+arr[1].y)/2,bf=toWorld(mx,my);zoom=cl(pinchZoom*(d/pinchDist),MIN_ZOOM,MAX_ZOOM);var af=toWorld(mx,my);camX+=bf.x-af.x;camY+=bf.y-af.y;bCam()}}
else if(touches.size===1){var t0=tcs[0];var p2=touches.get(t0.identifier);if(p2&&p2.draw&&t0.clientY<VIEW_H){var w=toWorld(t0.clientX,t0.clientY);useTool(w.x,w.y)}}},{passive:false});
canvas.addEventListener('touchend',function(e){if(appState!=='playing')return;e.preventDefault();var tcs=e.changedTouches;
for(var i=0;i<tcs.length;i++){var t=tcs[i];var p=touches.get(t.identifier);if(p&&!p.moved&&p.pan){if(hideBar||t.clientY<VIEW_H){var w=toWorld(p.x,p.y);inspected=findObj(w.x,w.y)}}touches.delete(t.identifier)}
if(touches.size===0)pinchDist=0;else if(touches.size===1){var arr=[];touches.forEach(function(v){arr.push(v)});arr[0].pan=panMode;arr[0].draw=!panMode;pinchDist=0;pinchZoom=zoom}},{passive:false});
canvas.addEventListener('touchcancel',function(e){touches.clear();pinchDist=0});
var mD=false,mLX=0,mLY=0,mSX=0,mSY=0;
canvas.addEventListener('mousedown',function(e){if(appState!=='playing')return;mD=true;mLX=e.clientX;mLY=e.clientY;mSX=e.clientX;mSY=e.clientY;touches.set('m',{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,pan:false,draw:false,moved:false});handleDown(e.clientX,e.clientY,'m')});
document.addEventListener('mousemove',function(e){if(!mD||appState!=='playing')return;var p=touches.get('m');if(!p)return;var dx=e.clientX-mLX,dy=e.clientY-mLY;mLX=e.clientX;mLY=e.clientY;p.x=e.clientX;p.y=e.clientY;if(!p.moved&&Math.hypot(e.clientX-mSX,e.clientY-mSY)>8)p.moved=true;if(panMode){camX-=dx/zoom;camY-=dy/zoom;bCam()}else if(e.clientY<VIEW_H){var w=toWorld(e.clientX,e.clientY);useTool(w.x,w.y)}});
document.addEventListener('mouseup',function(e){if(!mD)return;mD=false;var p=touches.get('m');if(p&&!p.moved&&panMode&&(hideBar||e.clientY<VIEW_H)){var w=toWorld(p.x,p.y);inspected=findObj(w.x,w.y)}touches.delete('m')});
document.addEventListener('contextmenu',function(e){e.preventDefault()});
document.addEventListener('wheel',function(e){if(appState!=='playing')return;e.preventDefault();var bf=toWorld(e.clientX,e.clientY);zoom=cl(zoom*(e.deltaY>0?0.9:1.1),MIN_ZOOM,MAX_ZOOM);var af=toWorld(e.clientX,e.clientY);camX+=bf.x-af.x;camY+=bf.y-af.y;bCam()},{passive:false});
}
function findObj(wx,wy){for(var i=beings.length-1;i>=0;i--){var u=beings[i],s=u.sz*(u.isBaby?0.75:1);if(Math.hypot(u.x-wx,u.y-wy)<s*1.5)return{type:'being',ref:u}}for(var i=builds.length-1;i>=0;i--){var b=builds[i],L=BLVL[b.t][b.lv-1],hw=(b.t==='warehouse'?L.w*1.1:TILE*2.2)/2,hh=(b.t==='warehouse'?L.h*1.1:TILE*2.0)/2;if(Math.abs(b.x-wx)<hw&&Math.abs(b.y-wy)<hh)return{type:'build',ref:b}}for(var i=trees.length-1;i>=0;i--){var t=trees[i];if(Math.hypot(t.x-wx,t.y-wy)<t.sz*1.2)return{type:'tree',ref:t}}for(var i=rocks.length-1;i>=0;i--){var r=rocks[i];if(Math.hypot(r.x-wx,r.y-wy)<r.sz*0.9)return{type:'rock',ref:r}}return null}

var lastT=0,loopE=0;
function loop(t){requestAnimationFrame(loop);if(!lastT)lastT=t;var dt=(t-lastT)/1000;lastT=t;if(dt>0.05)dt=0.05;worldTime+=dt;if(saveFlash>0)saveFlash-=dt;
try{ctx.setTransform(DPR,0,0,DPR,0,0);if(appState!=='playing'){ctx.clearRect(0,0,cw,ch);return}
playTime+=dt;cyclePhase=(cyclePhase+dt/DAY_LEN)%1;
if(worldTime-lastAutoSave>AUTOSAVE){if(saveW())saveFlash=0.5;lastAutoSave=worldTime}
if(flashT>0)flashT-=dt;
tickBeings(dt);tickBuilds(dt);tickTrees(dt);tickFire(dt);tickSparks(dt);tickHearts(dt);tickBolts(dt);tickRaids(dt);
renderWorld();paintUI()}catch(e){if(loopE<3){logErr('loop:'+e.message);loopE++}}}
function initCanvas(){DPR=Math.min(window.devicePixelRatio||1,3);cw=window.innerWidth;ch=window.innerHeight;canvas.width=Math.floor(cw*DPR);canvas.height=Math.floor(ch*DPR);canvas.style.width=cw+'px';canvas.style.height=ch+'px';ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=true;rView()}

initCanvas();preT();setupInput();
window.addEventListener('resize',function(){initCanvas();camX=cl(camX,0,Math.max(0,WORLD_W-cw/zoom));camY=cl(camY,0,Math.max(0,WORLD_H-VIEW_H/zoom))});
window.addEventListener('orientationchange',function(){setTimeout(initCanvas,100)});
window.addEventListener('beforeunload',function(){if(appState==='playing')saveW()});
document.addEventListener('visibilitychange',function(){if(document.hidden&&appState==='playing')saveW()});
if(checkCL()){showScreen('changelog-screen')}else{showScreen('settings-screen');refreshSettingsUI()}
requestAnimationFrame(loop);
</script></body></html>
