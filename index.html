function cl(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function toWorld(sx,sy){return{x:camX+sx/zoom,y:camY+sy/zoom};}
function boundCamera(){var vw=cw/zoom,vh=VIEW_H/zoom;camX=cl(camX,0,Math.max(0,WORLD_W-vw));camY=cl(camY,0,Math.max(0,WORLD_H-vh));}
function recalcView(){UIH=Math.max(180,Math.min(220,ch*0.28));VIEW_H=hideBar?ch:ch-UIH;boundCamera();}
function randInt(min,max){return Math.floor(rnd(min,max+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function sRand(seed,i){var x=Math.sin(seed*12.9898+i*78.233)*43758.5453;return x-Math.floor(x);}
function shadeHex(hex,f){var n=parseInt(hex.slice(1),16);var r=(n>>16)&0xff,g=(n>>8)&0xff,b=n&0xff;r=Math.min(255,Math.max(0,Math.round(r*f)));g=Math.min(255,Math.max(0,Math.round(g*f)));b=Math.min(255,Math.max(0,Math.round(b*f)));return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}
function getDarkness(){return (Math.cos(cyclePhase*Math.PI*2)+1)/2;}

var TILE_SS=4,WATER_FRAMES=12,LAVA_FRAMES=12,tileCache={};
function makeTileCanvas(size,fn){var c=document.createElement('canvas');c.width=size;c.height=size;fn(c.getContext('2d'),size);return c;}
function drawGrassTexture(c,s,seed){var g=c.createLinearGradient(0,0,0,s);g.addColorStop(0,'#5fc054');g.addColorStop(0.5,'#52b048');g.addColorStop(1,'#469438');c.fillStyle=g;c.fillRect(0,0,s,s);for(var i=0;i<7;i++){var x=sRand(seed,i*7)*s,y=sRand(seed,i*7+1)*s,r=s*(0.06+sRand(seed,i*7+2)*0.14);c.fillStyle='rgba(90,65,35,0.08)';c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();}var blades=55+Math.floor(sRand(seed,1)*35);var greens=['#7ade68','#6cce58','#5abe48','#4aae38','#8ae878','#3a9e2e'];c.lineCap='round';for(var j=0;j<blades;j++){var x2=sRand(seed,j*13+2)*s,y2=sRand(seed,j*13+3)*s,h=s*(0.05+sRand(seed,j*13+4)*0.10),lean=(sRand(seed,j*13+5)-0.5)*s*0.06;c.strokeStyle=greens[j%greens.length];c.lineWidth=s*0.014;c.beginPath();c.moveTo(x2,y2+h);c.quadraticCurveTo(x2+lean*0.4,y2+h*0.5,x2+lean,y2);c.stroke();}}
function drawForestFloorTexture(c,s,seed){var g=c.createLinearGradient(0,0,s,s);g.addColorStop(0,'#3e5a2e');g.addColorStop(0.5,'#2e4a20');g.addColorStop(1,'#223818');c.fillStyle=g;c.fillRect(0,0,s,s);var lc=['#8a5a2a','#a8732a','#6a4a20','#b8862a','#5a3a18','#c8983a'];for(var i=0;i<28;i++){var x=sRand(seed,i*5+11)*s,y=sRand(seed,i*5+12)*s,w=s*(0.08+sRand(seed,i*5+13)*0.14),h=s*(0.02+sRand(seed,i*5+14)*0.03),a=sRand(seed,i*5+15)*Math.PI;c.save();c.translate(x,y);c.rotate(a);c.fillStyle=lc[i%6];c.globalAlpha=0.55+sRand(seed,i*5+16)*0.35;c.beginPath();c.ellipse(0,0,w,h,0,0,Math.PI*2);c.fill();c.restore();}c.globalAlpha=1;}
function drawSnowTexture(c,s,seed){var g=c.createRadialGradient(s*0.4,s*0.35,s*0.1,s*0.5,s*0.5,s*0.9);g.addColorStop(0,'#f8fcff');g.addColorStop(0.5,'#e0ecf5');g.addColorStop(1,'#bdd0e0');c.fillStyle=g;c.fillRect(0,0,s,s);for(var i=0;i<35;i++){var x=sRand(seed,i*3+5)*s,y=sRand(seed,i*3+6)*s,r=s*(0.02+sRand(seed,i*3+7)*0.05);c.fillStyle='rgba(255,255,255,0.6)';c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();}}
function drawSandTexture(c,s,seed){var g=c.createLinearGradient(0,0,s,s);g.addColorStop(0,'#e0c486');g.addColorStop(0.4,'#d4b678');g.addColorStop(0.7,'#c4a868');g.addColorStop(1,'#b49860');c.fillStyle=g;c.fillRect(0,0,s,s);for(var i=0;i<150;i++){var x=sRand(seed,i*3+10)*s,y=sRand(seed,i*3+11)*s,shade=sRand(seed,i*3+12),sz=s*(0.008+sRand(seed,i*3+13)*0.008);if(shade>0.65)c.fillStyle='rgba(255,245,215,0.7)';else if(shade>0.35)c.fillStyle='rgba(200,170,110,0.5)';else c.fillStyle='rgba(140,110,65,0.45)';c.fillRect(x,y,sz,sz);}}
function drawWaterTexture(c,s,frame){var t=frame/WATER_FRAMES*Math.PI*2;var g=c.createLinearGradient(0,0,s,s);g.addColorStop(0,'#2864a8');g.addColorStop(0.4,'#2260a4');g.addColorStop(0.7,'#1c5290');g.addColorStop(1,'#164278');c.fillStyle=g;c.fillRect(0,0,s,s);var waves=[{f:1,a:0.055,al:0.42,tk:0.022,p:0},{f:2,a:0.045,al:0.32,tk:0.018,p:1.2}];c.lineCap='round';for(var wi=0;wi<waves.length;wi++){var w=waves[wi];c.strokeStyle='rgba(215,235,255,'+w.al+')';c.lineWidth=s*w.tk;c.beginPath();for(var px=0;px<=s;px+=2){var nx=px/s,y=s*0.5+Math.sin(2*Math.PI*w.f*nx+t*1.5+w.p)*s*w.a;if(px===0)c.moveTo(px,y);else c.lineTo(px,y);}c.stroke();}}
function drawLavaTexture(c,s,frame){var t=frame/LAVA_FRAMES*Math.PI*2;var g=c.createRadialGradient(s*0.5,s*0.5,0,s*0.5,s*0.5,s*0.8);g.addColorStop(0,'#2a0808');g.addColorStop(0.6,'#1a0505');g.addColorStop(1,'#0e0202');c.fillStyle=g;c.fillRect(0,0,s,s);for(var i=0;i<4;i++){var seed=i*2.1,yBase=((i*0.27+0.15)%1)*s,segs=20;c.lineCap='round';for(var k=0;k<segs;k++){var p1x=(k/segs)*s,p1y=yBase+Math.sin(2*Math.PI*((k/segs)*1.5+t*0.5+seed))*s*0.18,p2x=((k+1)/segs)*s,p2y=yBase+Math.sin(2*Math.PI*(((k+1)/segs)*1.5+t*0.5+seed))*s*0.18,pulse=0.7+Math.sin(t*2+i*1.3+k*0.3)*0.3;c.strokeStyle='rgba(255,80,10,'+(0.35*pulse)+')';c.lineWidth=s*0.06;c.beginPath();c.moveTo(p1x,p1y);c.lineTo(p2x,p2y);c.stroke();c.strokeStyle='rgba(255,240,150,'+(0.95*pulse)+')';c.lineWidth=s*0.012;c.beginPath();c.moveTo(p1x,p1y);c.lineTo(p2x,p2y);c.stroke();}}}
function drawBurntTexture(c,s,seed){var g=c.createLinearGradient(0,0,0,s);g.addColorStop(0,'#3a2a24');g.addColorStop(0.5,'#2a1e18');g.addColorStop(1,'#1a120e');c.fillStyle=g;c.fillRect(0,0,s,s);for(var i=0;i<40;i++){var x=sRand(seed,i*3)*s,y=sRand(seed,i*3+1)*s,r=s*(0.015+sRand(seed,i*3+2)*0.03);c.fillStyle='rgba(60,45,38,0.6)';c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();}}
function prerenderTiles(){var S=TILE*TILE_SS,V=6;tileCache.grass=[];for(var v=0;v<V;v++)tileCache.grass.push(makeTileCanvas(S,function(c,s){drawGrassTexture(c,s,v*13+1);}));tileCache.forestfloor=[];for(var v2=0;v2<V;v2++)tileCache.forestfloor.push(makeTileCanvas(S,function(c,s){drawForestFloorTexture(c,s,v2*13+7);}));tileCache.snow=[];for(var v3=0;v3<V;v3++)tileCache.snow.push(makeTileCanvas(S,function(c,s){drawSnowTexture(c,s,v3*17+5);}));tileCache.sand=[];for(var v4=0;v4<V;v4++)tileCache.sand.push(makeTileCanvas(S,function(c,s){drawSandTexture(c,s,v4*17+3);}));tileCache.burnt=[];for(var v5=0;v5<4;v5++)tileCache.burnt.push(makeTileCanvas(S,function(c,s){drawBurntTexture(c,s,v5*23+7);}));tileCache.water=[];for(var f=0;f<WATER_FRAMES;f++)tileCache.water.push(makeTileCanvas(S,function(c,s){drawWaterTexture(c,s,f);}));tileCache.lava=[];for(var f2=0;f2<LAVA_FRAMES;f2++)tileCache.lava.push(makeTileCanvas(S,function(c,s){drawLavaTexture(c,s,f2);}));}

function getStorageCapacity(clan){var cap=Object.assign({},BASE_STORAGE);for(var i=0;i<builds.length;i++){var b=builds[i];if(b.clan!==clan||b.type!=='warehouse')continue;var wC=WAREHOUSE_CAPACITY[b.level-1];for(var k in wC)cap[k]=(cap[k]||0)+wC[k];}return cap;}
function canAfford(clan,cost){if(cost.wood&&(wood[clan]||0)<cost.wood)return false;if(cost.stone&&minerals.stone<cost.stone)return false;if(cost.iron&&minerals.iron<cost.iron)return false;if(cost.gold&&minerals.gold<cost.gold)return false;return true;}
function payCost(clan,cost){if(cost.wood)wood[clan]=(wood[clan]||0)-cost.wood;if(cost.stone)minerals.stone-=cost.stone;if(cost.iron)minerals.iron-=cost.iron;if(cost.gold)minerals.gold-=cost.gold;}
function clampStorage(){var c0=getStorageCapacity(0),c1=getStorageCapacity(1);var cap={wood:Math.max(c0.wood,c1.wood),stone:Math.max(c0.stone,c1.stone),iron:Math.max(c0.iron,c1.iron),gold:Math.max(c0.gold,c1.gold),diamond:Math.max(c0.diamond,c1.diamond),emerald:Math.max(c0.emerald,c1.emerald)};for(var c in wood)wood[c]=Math.min(wood[c],cap.wood);var keys=['stone','iron','gold','diamond','emerald'];for(var i=0;i<keys.length;i++)minerals[keys[i]]=Math.min(minerals[keys[i]],cap[keys[i]]||0);}

function spawnRocksRandom(min,max){var scale=(COLS*ROWS)/(64*46),n=Math.floor(randInt(min,max)*scale);for(var i=0;i<n;i++){var tx=randInt(2,COLS-3),ty=randInt(2,ROWS-3);var t=tiles[ty*COLS+tx];if(t!==0&&t!==3&&t!==8&&t!==9)continue;var cx=tx*TILE+TILE/2,cy=ty*TILE+TILE/2;var close=false;for(var j=0;j<rocks.length;j++){var o=rocks[j];if(Math.hypot(o.x-cx,o.y-cy)<TILE*1.3){close=true;break;}}if(close)continue;for(var j2=0;j2<trees.length;j2++){var o2=trees[j2];if(Math.hypot(o2.x-cx,o2.y-cy)<TILE*1.3){close=true;break;}}if(close)continue;var sv=0.8+Math.random()*0.5;rocks.push({x:cx,y:cy,hp:45,maxHp:45,size:TILE*0.95*sv,seed:Math.random()});}}
function carveLake(cx,cy,radius){var r=Math.ceil(radius),so=Math.random()*100;for(var dy=-r-1;dy<=r+1;dy++){for(var dx=-r-1;dx<=r+1;dx++){var nx=Math.floor(cx+dx),ny=Math.floor(cy+dy);if(nx<0||nx>=COLS||ny<0||ny>=ROWS)continue;var d=Math.hypot(dx,dy);var wob=Math.sin((dx+so)*0.7)*0.5+Math.cos((dy+so*1.3)*0.6)*0.5;var edge=r+wob;if(d<edge){var idx=ny*COLS+nx;tiles[idx]=1;flowDepth[idx]=MAX_FLOW;}else if(d<edge+1.5){var idx2=ny*COLS+nx;if(tiles[idx2]!==1)tiles[idx2]=3;}}}}
function generateMountainBiome(){for(var i=0;i<tiles.length;i++)tiles[i]=9;for(var li=0;li<randInt(2,4);li++)carveLake(rnd(COLS*0.2,COLS*0.8),rnd(ROWS*0.2,ROWS*0.8),rnd(2,3.5));var margin=Math.floor(Math.min(COLS,ROWS)*0.15);for(var mi=0;mi<randInt(10,16);mi++){var x=rnd(margin,COLS-margin),y=rnd(margin,ROWS-margin),angle=rnd(0,Math.PI*2);for(var k=0;k<randInt(12,28);k++){drawBlob(x,y,randInt(1,2),2,0.75);angle+=rnd(-0.4,0.4);x+=Math.cos(angle)*2;y+=Math.sin(angle)*2;if(x<margin||x>COLS-margin||y<margin||y>ROWS-margin)break;}}var scale=(COLS*ROWS)/(64*46),n=Math.floor(70*scale);for(var ti=0;ti<n;ti++){var tx=randInt(2,COLS-3),ty=randInt(2,ROWS-3);var t=tiles[ty*COLS+tx];if(t!==9&&t!==3)continue;var close=false;for(var tj=0;tj<trees.length;tj++){var o=trees[tj];if(Math.abs(o.x-(tx*TILE+TILE/2))<TILE*0.8&&Math.abs(o.y-(ty*TILE+TILE/2))<TILE*0.8){close=true;break;}}if(close)continue;var kinds=['pine','pine','pine','dead','birch'];addTreeAt(tx,ty,pick(kinds));}spawnRocksRandom(10,20);}
function generateSandyBiome(){for(var i=0;i<tiles.length;i++)tiles[i]=3;for(var li=0;li<randInt(3,6);li++)carveLake(rnd(COLS*0.15,COLS*0.85),rnd(ROWS*0.15,ROWS*0.85),rnd(2,3.5));for(var di=0;di<randInt(2,5);di++)drawBlob(rnd(COLS*0.15,COLS*0.85),rnd(ROWS*0.15,ROWS*0.85),randInt(1,2),2,0.5);var scale=(COLS*ROWS)/(64*46),n=Math.floor(40*scale);for(var ti=0;ti<n;ti++){var tx=randInt(2,COLS-3),ty=randInt(2,ROWS-3);var t=tiles[ty*COLS+tx];if(t!==3)continue;var close=false;for(var tj=0;tj<trees.length;tj++){var o=trees[tj];if(Math.abs(o.x-(tx*TILE+TILE/2))<TILE*0.8&&Math.abs(o.y-(ty*TILE+TILE/2))<TILE*0.8){close=true;break;}}if(close)continue;var kinds=['palm','palm','palm','palm','dead','oak'];addTreeAt(tx,ty,pick(kinds));}spawnRocksRandom(6,12);}

function generateMeadowBiome(){for(var i=0;i<tiles.length;i++)tiles[i]=0;for(var li=0;li<randInt(3,6);li++)carveLake(rnd(COLS*0.15,COLS*0.85),rnd(ROWS*0.15,ROWS*0.85),rnd(2,3.5));var scale=(COLS*ROWS)/(64*46),n=Math.floor(55*scale);for(var ti=0;ti<n;ti++){var tx=randInt(2,COLS-3),ty=randInt(2,ROWS-3);var t=tiles[ty*COLS+tx];if(t!==0&&t!==3)continue;var close=false;for(var tj=0;tj<trees.length;tj++){var o=trees[tj];if(Math.abs(o.x-(tx*TILE+TILE/2))<TILE*0.8&&Math.abs(o.y-(ty*TILE+TILE/2))<TILE*0.8){close=true;break;}}if(close)continue;var kinds=['birch','birch','birch','birch','oak'];addTreeAt(tx,ty,pick(kinds));}spawnRocksRandom(2,5);}
function addOceanBorder(){var eMin=Math.min(COLS,ROWS),hard=1,soft=Math.max(3,Math.floor(eMin*0.05));for(var y=0;y<ROWS;y++){for(var x=0;x<COLS;x++){if(x<hard||x>=COLS-hard||y<hard||y>=ROWS-hard){var idx=y*COLS+x;tiles[idx]=1;flowDepth[idx]=MAX_FLOW;}}}for(var y2=0;y2<ROWS;y2++){for(var x2=0;x2<COLS;x2++){var dist=Math.min(x2,y2,COLS-1-x2,ROWS-1-y2);if(dist>=soft)continue;var idx2=y2*COLS+x2;if(tiles[idx2]===1)continue;var tE=Math.max(0,dist-hard)/Math.max(1,soft-hard);var noise=Math.sin(x2*0.62+y2*0.89)*0.32+Math.cos(x2*0.27-y2*0.53)*0.28+Math.sin(x2*1.13+y2*0.41)*0.22+Math.cos(x2*0.83+y2*1.27)*0.18;var wave=(noise+1)*0.5,thr=0.85-tE*0.65;if(wave<thr){tiles[idx2]=1;flowDepth[idx2]=MAX_FLOW;}}}}
function addOresToMountains(){for(var y=0;y<ROWS;y++){for(var x=0;x<COLS;x++){var idx=y*COLS+x;if(tiles[idx]!==2)continue;mountainHP[idx]=MOUNTAIN_HP;var roll=Math.random(),ore=0;if(roll<0.55)ore=1;else if(roll<0.80)ore=2;else if(roll<0.93)ore=3;else if(roll<0.98)ore=4;else ore=5;oreMap[idx]=ore;}}}
function drawBlob(cx,cy,radius,tileType,density){var r=Math.ceil(radius),so=Math.random()*100;for(var dy=-r;dy<=r;dy++){for(var dx=-r;dx<=r;dx++){var nx=Math.floor(cx+dx),ny=Math.floor(cy+dy);if(nx<0||nx>=COLS||ny<0||ny>=ROWS)continue;var d=Math.hypot(dx,dy);var wob=Math.sin((dx+so)*0.7)*0.5+Math.cos((dy+so*1.3)*0.6)*0.5;if(d+wob<radius)if(Math.random()<density)tiles[ny*COLS+nx]=tileType;}}}
function addBeaches(){var tc=[];for(var y=0;y<ROWS;y++){for(var x=0;x<COLS;x++){var idx=y*COLS+x;if(tiles[idx]!==0&&tiles[idx]!==8&&tiles[idx]!==9)continue;if(hasNear(x,y,1)&&Math.random()<0.7)tc.push(idx);}}for(var i=0;i<tc.length;i++)tiles[tc[i]]=3;}
function hasNear(x,y,v){for(var dy=-1;dy<=1;dy++){for(var dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;var nx=x+dx,ny=y+dy;if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&tiles[ny*COLS+nx]===v)return true;}}return false;}

function findNearestMountain(x,y,maxDist){var tx0=Math.floor(x/TILE),ty0=Math.floor(y/TILE);var r=Math.ceil(maxDist/TILE);var best=null,bd=maxDist;for(var dy=-r;dy<=r;dy++){for(var dx=-r;dx<=r;dx++){var tx=tx0+dx,ty=ty0+dy;if(tx<0||tx>=COLS||ty<0||ty>=ROWS)continue;var idx=ty*COLS+tx,t=tiles[idx];if(t!==2&&t!==6&&t!==7)continue;if(mountainHP[idx]<=0)continue;var cx=tx*TILE+TILE/2,cy=ty*TILE+TILE/2;var d=Math.hypot(cx-x,cy-y);if(d<bd){bd=d;best={tx:tx,ty:ty,idx:idx,x:cx,y:cy,type:t};}}}return best;}

var touches=new Map(),pinchDist=0,pinchZoom=1;
function onStart(t){

if(touches.size===1){
var tb=hitTopButton(t.clientX,t.clientY);
if(tb==='panel'){hideBar=!hideBar;recalcView();return;}

if(!hideBar&&t.clientY>=VIEW_H){var tab=hitTab(t.clientX,t.clientY);if(tab){activeTab=tab;return;}var i=hitToolButton(t.clientX,t.clientY);if(i>=0){activeTool=getTools()[i].id;return;}return;}
if(panMode){touches.get(t.identifier).pan=true;}else{var w=toWorld(t.clientX,t.clientY);useTool(w.x,w.y);touches.get(t.identifier).draw=true;}
}else if(touches.size===2){for(var info of touches.values()){info.pan=false;info.draw=false;}var arr=Array.from(touches.values());pinchDist=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);pinchZoom=zoom;}

function onMove(t){

}

var updatePromptShown=false;
function checkRemoteUpdate(){
try{
fetch(location.pathname+'?t='+Date.now(),{cache:'no-store'})
.then(function(r){return r.text();})
.then(function(html){
var m=html.match(/CHANGELOG=\[\s*\{[\s\S]*?version:\s*['"]([0-9.]+)['"]/);
if(!m)return;
var rv=m[1];
if(versionNum(rv)>versionNum(APP_VERSION)){showUpdatePrompt(rv);}
})
.catch(function(){});
}catch(e){}
}
function showUpdatePrompt(nv){

updatePromptShown=true;

setTimeout(function(){location.reload(true);},150);
};
document.body.appendChild(el);
}
setTimeout(checkRemoteUpdate,10000);

initCanvas();
setupInput();

requestAnimationFrame(loop);
console.log('Кубия 1.8.0 запущена! Если видишь это — игра работает.');
