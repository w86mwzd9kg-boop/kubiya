function cl(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}
function randInt(a,b){return Math.floor(rnd(a,b+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function sRand(seed,i){var x=Math.sin(seed*12.9898+i*78.233)*43758.5453;return x-Math.floor(x);}
function shadeHex(hex,f){
  var n=parseInt(hex.slice(1),16);
  var r=(n>>16)&0xff,g=(n>>8)&0xff,b=n&0xff;
  r=Math.min(255,Math.max(0,Math.round(r*f)));
  g=Math.min(255,Math.max(0,Math.round(g*f)));
  b=Math.min(255,Math.max(0,Math.round(b*f)));
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}
function mixHex(a,b,t){
  var n1=parseInt(a.slice(1),16),n2=parseInt(b.slice(1),16);
  var r=Math.round(((n1>>16)&255)*(1-t)+((n2>>16)&255)*t);
  var g=Math.round(((n1>>8)&255)*(1-t)+((n2>>8)&255)*t);
  var bl=Math.round((n1&255)*(1-t)+(n2&255)*t);
  return '#'+((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1);
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function toWorld(sx,sy){return {x:camX+sx/zoom,y:camY+sy/zoom};}
function boundCamera(){
  var vw=cw/zoom,vh=VIEW_H/zoom;
  camX=cl(camX,0,Math.max(0,WORLD_W-vw));
  camY=cl(camY,0,Math.max(0,WORLD_H-vh));
}
function recalcView(){UIH=Math.max(180,Math.min(220,ch*0.28));VIEW_H=hideBar?ch:ch-UIH;boundCamera();}
function getDarkness(){return (Math.cos(cyclePhase*Math.PI*2)+1)/2;}
function toast(msg,dur){toastMsg=msg;toastT=Math.min(dur||2,3);}

  init:function(){
    if(this.ctx)return true;
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return false;
      this.ctx=new AC();
      this.master=this.ctx.createGain();this.master.gain.value=0.5;
      this.master.connect(this.ctx.destination);
      var rate=this.ctx.sampleRate,len=Math.floor(rate*3);
      var buf=this.ctx.createBuffer(2,len,rate);
      for(var c=0;c<2;c++){var d=buf.getChannelData(c);for(var i=0;i<len;i++){var tt=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-tt,1.8)*0.4;}}
      var conv=this.ctx.createConvolver();conv.buffer=buf;
      this.wet=this.ctx.createGain();this.wet.gain.value=0.6;
      this.wet.connect(conv);conv.connect(this.master);
      return true;
    }catch(e){return false;}
  },
  resume:function(){if(this.ctx&&this.ctx.state==='suspended'){try{this.ctx.resume();}catch(e){}}},
  getStyle:function(){return MUSIC_STYLES[this.styleId]||MUSIC_STYLES.relax;},
  setStyle:function(id){
    if(!MUSIC_STYLES[id])id='relax';
    this.styleId=id;
    var wasRunning=this.running;
    this.stop();
    if(wasRunning&&!MUSIC_STYLES[id].off)this.start();
  },
  start:function(){
    if(this.running)return;
    var st=this.getStyle();
    if(st.off)return;
    if(!this.init())return;
    this.resume();this.running=true;this.step=0;
    this.nextT=this.ctx.currentTime+0.5;
    var self=this;
    this.timer=setInterval(function(){self.schedule();},500);
    this.schedule();
  },
  stop:function(){this.running=false;if(this.timer){clearInterval(this.timer);this.timer=null;}},
  schedule:function(){
    if(!this.running||!this.ctx)return;
    var st=this.getStyle();
    var spb=60/st.bpm,horizon=this.ctx.currentTime+3.5;
    while(this.nextT<horizon){
      var t=this.nextT,chordIdx=Math.floor(this.step/8)%st.chords.length,beat=this.step%8;
      if(beat===0){
        this.pad(t,st.chords[chordIdx],spb*8.5,0.028);
        this.bass(t,st.bass[chordIdx],spb*8,0.05);
        this.bell(t+0.2,st.penta[Math.floor(Math.random()*st.penta.length)],3.5,0.03);
      }
      if(beat===2&&Math.random()<0.6)this.bell(t,st.penta[Math.floor(Math.random()*st.penta.length)],2.5,0.022);
      if(beat===4&&Math.random()<0.5)this.bell(t+0.3,st.penta[Math.floor(Math.random()*st.penta.length)],2,0.02);
      if(beat===6&&Math.random()<0.5)this.bell(t,st.penta[Math.floor(Math.random()*st.penta.length)],2.5,0.018);
      this.nextT+=spb;this.step++;
    }
  },
  pad:function(t,notes,dur,vol){
    for(var i=0;i<notes.length;i++){
      var f=notes[i];
      var o=this.ctx.createOscillator();o.type='triangle';o.frequency.value=f;
      var o2=this.ctx.createOscillator();o2.type='sine';o2.frequency.value=f*1.005;o2.detune.value=-3;
      var filt=this.ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=1000;filt.Q.value=0.4;
      var g=this.ctx.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(vol,t+1.8);
      g.gain.linearRampToValueAtTime(vol*0.85,t+dur*0.6);
      g.gain.linearRampToValueAtTime(0.0001,t+dur);
      o.connect(filt);o2.connect(filt);filt.connect(g);g.connect(this.master);
      if(this.wet)g.connect(this.wet);
      o.start(t);o2.start(t);o.stop(t+dur+0.5);o2.stop(t+dur+0.5);
    }
  },
  bass:function(t,freq,dur,vol){
    var o=this.ctx.createOscillator();o.type='sine';o.frequency.value=freq;
    var o2=this.ctx.createOscillator();o2.type='triangle';o2.frequency.value=freq*2;
    var g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+1.2);
    g.gain.linearRampToValueAtTime(vol*0.6,t+dur*0.6);
    g.gain.linearRampToValueAtTime(0.0001,t+dur);
    var g2=this.ctx.createGain();
    g2.gain.setValueAtTime(0.0001,t);
    g2.gain.linearRampToValueAtTime(vol*0.25,t+1);
    g2.gain.linearRampToValueAtTime(0.0001,t+dur*0.7);
    o.connect(g);o2.connect(g2);g.connect(this.master);g2.connect(this.master);
    o.start(t);o2.start(t);o.stop(t+dur+0.2);o2.stop(t+dur+0.2);
  },
  bell:function(t,freq,dur,vol){
    var o=this.ctx.createOscillator();o.type='triangle';o.frequency.value=freq;
    var o2=this.ctx.createOscillator();o2.type='sine';o2.frequency.value=freq*2.005;
    var g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+0.03);
    g.gain.exponentialRampToValueAtTime(vol*0.4,t+dur*0.3);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    var g2=this.ctx.createGain();
    g2.gain.setValueAtTime(0.0001,t);
    g2.gain.linearRampToValueAtTime(vol*0.25,t+0.03);
    g2.gain.exponentialRampToValueAtTime(0.0001,t+dur*0.5);
    o.connect(g);o2.connect(g2);g.connect(this.master);g2.connect(this.master);
    if(this.wet){g.connect(this.wet);g2.connect(this.wet);}
    o.start(t);o2.start(t);o.stop(t+dur+0.1);o2.stop(t+dur+0.1);
  }
};

var SETTINGS_KEY='kubiya_settings_v9';
function readSettings(){try{return JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}');}catch(e){return {};}}
function writeSettings(s){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(s));}catch(e){}}
function getSetting(k,def){var s=readSettings();return s[k]!==undefined?s[k]:def;}
function getMusicStyle(){return getSetting('musicStyle','relax');}
function setMusicStyle(id){
  var s=readSettings();s.musicStyle=id;writeSettings(s);
  RelaxMus.setStyle(id);
}

// ═══ TILE TEXTURES ═══
var TILE_SS=4,WATER_FRAMES=12,LAVA_FRAMES=12,tileCache={};
function makeTileCanvas(size,fn){
  var c=document.createElement('canvas');c.width=size;c.height=size;
  fn(c.getContext('2d'),size);return c;
}
function drawGrassTexture(c,s,seed){
  var g=c.createLinearGradient(0,0,0,s);
  g.addColorStop(0,'#5fc054');g.addColorStop(0.5,'#52b048');g.addColorStop(1,'#469438');
  c.fillStyle=g;c.fillRect(0,0,s,s);
  var blades=55+Math.floor(sRand(seed,1)*35);
  var greens=['#7ade68','#6cce58','#5abe48','#4aae38','#8ae878','#3a9e2e'];
  c.lineCap='round';
  for(var j=0;j<blades;j++){
    var x2=sRand(seed,j*13+2)*s,y2=sRand(seed,j*13+3)*s;
    var h=s*(0.05+sRand(seed,j*13+4)*0.1);
    var lean=(sRand(seed,j*13+5)-0.5)*s*0.06;
    c.strokeStyle=greens[j%greens.length];c.lineWidth=s*0.014;
    c.beginPath();c.moveTo(x2,y2+h);
    c.quadraticCurveTo(x2+lean*0.4,y2+h*0.5,x2+lean,y2);c.stroke();
  }
}
function drawForestFloorTexture(c,s,seed){
  var g=c.createLinearGradient(0,0,s,s);
  g.addColorStop(0,'#3e5a2e');g.addColorStop(0.5,'#2e4a20');g.addColorStop(1,'#223818');
  c.fillStyle=g;c.fillRect(0,0,s,s);
  var lc=['#8a5a2a','#a8732a','#6a4a20','#b8862a','#5a3a18','#c8983a'];
  for(var i=0;i<28;i++){
    var x=sRand(seed,i*5+11)*s,y=sRand(seed,i*5+12)*s;
    var w=s*(0.08+sRand(seed,i*5+13)*0.14),h=s*(0.02+sRand(seed,i*5+14)*0.03);
    var a=sRand(seed,i*5+15)*Math.PI;
    c.save();c.translate(x,y);c.rotate(a);
    c.fillStyle=lc[i%6];c.globalAlpha=0.55+sRand(seed,i*5+16)*0.35;
    c.beginPath();c.ellipse(0,0,w,h,0,0,Math.PI*2);c.fill();c.restore();
  }
  c.globalAlpha=1;
}
function drawSnowTexture(c,s,seed){
  var g=c.createRadialGradient(s*0.4,s*0.35,s*0.1,s*0.5,s*0.5,s*0.9);
  g.addColorStop(0,'#f8fcff');g.addColorStop(0.5,'#e0ecf5');g.addColorStop(1,'#bdd0e0');
  c.fillStyle=g;c.fillRect(0,0,s,s);
  for(var i=0;i<35;i++){
    var x=sRand(seed,i*3+5)*s,y=sRand(seed,i*3+6)*s,r=s*(0.02+sRand(seed,i*3+7)*0.05);
    c.fillStyle='rgba(255,255,255,0.6)';
    c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();
  }
}
function drawSandTexture(c,s,seed){
  var g=c.createLinearGradient(0,0,s,s);
  g.addColorStop(0,'#e0c486');g.addColorStop(0.4,'#d4b678');g.addColorStop(0.7,'#c4a868');g.addColorStop(1,'#b49860');
  c.fillStyle=g;c.fillRect(0,0,s,s);
  for(var i=0;i<150;i++){
    var x=sRand(seed,i*3+10)*s,y=sRand(seed,i*3+11)*s;
    var shade=sRand(seed,i*3+12),sz=s*(0.008+sRand(seed,i*3+13)*0.008);
    if(shade>0.65)c.fillStyle='rgba(255,245,215,0.7)';
    else if(shade>0.35)c.fillStyle='rgba(200,170,110,0.5)';
    else c.fillStyle='rgba(140,110,65,0.45)';
    c.fillRect(x,y,sz,sz);
  }
}
function drawWaterTexture(c,s,frame){
  var t=frame/WATER_FRAMES*Math.PI*2;
  var g=c.createLinearGradient(0,0,s,s);
  g.addColorStop(0,'#2864a8');g.addColorStop(0.4,'#2260a4');g.addColorStop(0.7,'#1c5290');g.addColorStop(1,'#164278');
  c.fillStyle=g;c.fillRect(0,0,s,s);
  var waves=[{f:1,a:0.055,al:0.42,tk:0.022,p:0},{f:2,a:0.045,al:0.32,tk:0.018,p:1.2}];
  c.lineCap='round';
  for(var wi=0;wi<waves.length;wi++){
    var w=waves[wi];
    c.strokeStyle='rgba(215,235,255,'+w.al+')';
    c.lineWidth=s*w.tk;c.beginPath();
    for(var px=0;px<=s;px+=2){
      var nx=px/s,y=s*0.5+Math.sin(2*Math.PI*w.f*nx+t*1.5+w.p)*s*w.a;
      if(px===0)c.moveTo(px,y);else c.lineTo(px,y);
    }
    c.stroke();
  }
}
function drawLavaTexture(c,s,frame){
  var t=frame/LAVA_FRAMES*Math.PI*2;
  var g=c.createRadialGradient(s*0.5,s*0.5,0,s*0.5,s*0.5,s*0.8);
  g.addColorStop(0,'#2a0808');g.addColorStop(0.6,'#1a0505');g.addColorStop(1,'#0e0202');
  c.fillStyle=g;c.fillRect(0,0,s,s);
  for(var i=0;i<4;i++){
    var seed=i*2.1,yBase=((i*0.27+0.15)%1)*s,segs=20;
    c.lineCap='round';
    for(var k=0;k<segs;k++){
      var p1x=(k/segs)*s,p1y=yBase+Math.sin(2*Math.PI*((k/segs)*1.5+t*0.5+seed))*s*0.18;
      var p2x=((k+1)/segs)*s,p2y=yBase+Math.sin(2*Math.PI*(((k+1)/segs)*1.5+t*0.5+seed))*s*0.18;
      var pulse=0.7+Math.sin(t*2+i*1.3+k*0.3)*0.3;
      c.strokeStyle='rgba(255,80,10,'+(0.35*pulse)+')';c.lineWidth=s*0.06;
      c.beginPath();c.moveTo(p1x,p1y);c.lineTo(p2x,p2y);c.stroke();
      c.strokeStyle='rgba(255,240,150,'+(0.95*pulse)+')';c.lineWidth=s*0.012;
      c.beginPath();c.moveTo(p1x,p1y);c.lineTo(p2x,p2y);c.stroke();
    }
  }
}
function drawBurntTexture(c,s,seed){
  var g=c.createLinearGradient(0,0,0,s);
  g.addColorStop(0,'#3a2a24');g.addColorStop(0.5,'#2a1e18');g.addColorStop(1,'#1a120e');
  c.fillStyle=g;c.fillRect(0,0,s,s);
  for(var i=0;i<40;i++){
    var x=sRand(seed,i*3)*s,y=sRand(seed,i*3+1)*s,r=s*(0.015+sRand(seed,i*3+2)*0.03);
    c.fillStyle='rgba(60,45,38,0.6)';c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();
  }
}
function prerenderTiles(){
  var S=TILE*TILE_SS,V=6;
  tileCache.grass=[];for(var v=0;v<V;v++)tileCache.grass.push(makeTileCanvas(S,(function(vv){return function(c,s){drawGrassTexture(c,s,vv*13+1);};})(v)));
  tileCache.forestfloor=[];for(var v2=0;v2<V;v2++)tileCache.forestfloor.push(makeTileCanvas(S,(function(vv){return function(c,s){drawForestFloorTexture(c,s,vv*13+7);};})(v2)));
  tileCache.snow=[];for(var v3=0;v3<V;v3++)tileCache.snow.push(makeTileCanvas(S,(function(vv){return function(c,s){drawSnowTexture(c,s,vv*17+5);};})(v3)));
  tileCache.sand=[];for(var v4=0;v4<V;v4++)tileCache.sand.push(makeTileCanvas(S,(function(vv){return function(c,s){drawSandTexture(c,s,vv*17+3);};})(v4)));
  tileCache.burnt=[];for(var v5=0;v5<4;v5++)tileCache.burnt.push(makeTileCanvas(S,(function(vv){return function(c,s){drawBurntTexture(c,s,vv*23+7);};})(v5)));
  tileCache.water=[];for(var f=0;f<WATER_FRAMES;f++)tileCache.water.push(makeTileCanvas(S,(function(ff){return function(c,s){drawWaterTexture(c,s,ff);};})(f)));
  tileCache.lava=[];for(var f2=0;f2<LAVA_FRAMES;f2++)tileCache.lava.push(makeTileCanvas(S,(function(ff){return function(c,s){drawLavaTexture(c,s,ff);};})(f2)));
}

// ═══ VILLAGES / KINGDOMS ═══
function createVillage(clan,x,y,name){
  var id=nextVillageId++;
  var v={id:id,name:name||('Город №'+id),clan:clan,color:KINGDOM_COLORS[(id-1)%KINGDOM_COLORS.length],
    allies:[],wars:[],cx:x||0,cy:y||0,isKingdom:false,order:'auto'};
  villages[id]=v;return v;
}
function spawnLeaderFor(v){
  for(var i=0;i<beings.length;i++)if(beings[i].isLeader&&beings[i].villageId===v.id)return;
  var ctr=getVillageCenter(v.id);if(!ctr)return;
  beings.push({
    x:ctr.x+rnd(-10,10),y:ctr.y+rnd(-10,10),vx:0,vy:0,
    type:'human',clan:v.clan,villageId:v.id,hp:150,maxHp:150,size:9,
    skin:'#e8c9a0',cloth:'#8a2a1a',clothDark:'#5a1a10',hair:'#d4a018',
    speed:35,dmg:15,buildType:null,weapon:null,
    atkCd:0,bldCd:999,chopCd:0,chopTarget:null,mineCd:0,mineTarget:null,
    plantCd:999,warehouseCd:999,wanderA:Math.random()*Math.PI*2,wanderT:0,flash:0,side:1,
    walkPhase:Math.random()*6.28,age:100,gender:0,isBaby:false,growth:1,
    breedCd:9999,swimming:false,swimTarget:null,drownTime:0,
    currentAction:'idle',hunger:100,raidTarget:null,isLeader:true,role:'warrior'
  });
}
function ensureLeaders(){for(var k in villages){var v=villages[k];if(!v.cx)continue;spawnLeaderFor(v);}}
function createKingdoms(){
  villages={};nextVillageId=1;ownerMap=null;playerKingdomId=0;
  var isEmpire=(selectedSize==='empire');
  var names=KINGDOM_NAMES.slice();
  var cx=WORLD_W/2,cy=WORLD_H/2,r=Math.min(WORLD_W,WORLD_H)*0.3;
  var count=isEmpire?KINGDOM_COUNT:1,pos;
  if(isEmpire)pos=[{x:cx-r,y:cy-r},{x:cx+r,y:cy-r},{x:cx-r,y:cy+r},{x:cx+r,y:cy+r}];
  else pos=[{x:cx,y:cy}];
  for(var i=0;i<count;i++){
    var ni=Math.floor(Math.random()*names.length);
    var nm=names.splice(ni,1)[0];
    var v=createVillage(0,pos[i].x,pos[i].y,nm);
    v.isKingdom=isEmpire;if(isEmpire)v.color=KINGDOM_COLORS[i];
    var startHouses=isEmpire?3:5;
    for(var b=0;b<startHouses;b++){
      var ang=Math.random()*Math.PI*2,dist=TILE*(3+Math.random()*3);
      var bx=cl(pos[i].x+Math.cos(ang)*dist,TILE*2,WORLD_W-TILE*2);
      var by=cl(pos[i].y+Math.sin(ang)*dist,TILE*2,WORLD_H-TILE*2);
      if(!walkable(bx,by))continue;
      var nb=placeBuild(bx,by,'cottage',0,v.id);nb.villageId=v.id;nb.construction=0;
      for(var p=0;p<3;p++){var px=bx+rnd(-20,20),py=by+rnd(-20,20);if(walkable(px,py))makeBeing(px,py,'human',false,null,v.id);}
      var wx2=bx+rnd(-15,15),wy2=by+rnd(-15,15);
      if(walkable(wx2,wy2))makeBeing(wx2,wy2,'warrior',false,null,v.id);
    }
  }
  if(!isEmpire)playerKingdomId=1;
  buildOwnerMap();ensureLeaders();
}
function buildOwnerMap(){
  var klist=[];
  for(var k in villages){var v=villages[k];if(v.isKingdom)klist.push(v);}
  if(!klist.length){ownerMap=null;return;}
  if(!ownerMap||ownerMap.length!==COLS*ROWS)ownerMap=new Uint8Array(COLS*ROWS);
  var step=Math.max(1,Math.floor(Math.sqrt(COLS*ROWS/40000)));
  for(var ty=0;ty<ROWS;ty+=step)
    for(var tx=0;tx<COLS;tx+=step){
      var wx=tx*TILE+TILE/2,wy=ty*TILE+TILE/2,best=0,bd=Infinity;
      for(var i=0;i<klist.length;i++){var kk=klist[i];var d=(kk.cx-wx)*(kk.cx-wx)+(kk.cy-wy)*(kk.cy-wy);if(d<bd){bd=d;best=i;}}
      for(var dy2=0;dy2<step&&ty+dy2<ROWS;dy2++)
        for(var dx2=0;dx2<step&&tx+dx2<COLS;dx2++)ownerMap[(ty+dy2)*COLS+tx+dx2]=best;
    }
}
function getKingdomList(){
  var o=[];for(var k in villages){var v=villages[k];if(v.isKingdom)o.push(v);}
  o.sort(function(a,b){return a.id-b.id;});return o;
}
function getVillageCenter(vid){
  var v=villages[vid];if(v&&v.cx)return {x:v.cx,y:v.cy};
  var bs=getVillageBuilds(vid);if(!bs.length)return null;
  var cx=0,cy=0;for(var i=0;i<bs.length;i++){cx+=bs[i].x;cy+=bs[i].y;}
  return {x:cx/bs.length,y:cy/bs.length};
}
function getVillageBuilds(vid){var o=[];for(var i=0;i<builds.length;i++)if(builds[i].villageId===vid)o.push(builds[i]);return o;}
function getVillageMembers(vid){var o=[];for(var i=0;i<beings.length;i++)if(beings[i].villageId===vid)o.push(beings[i]);return o;}
function nearestVillage(clan,x,y,maxD){
  maxD=maxD||(TILE*15);var best=null,bd=maxD;
  for(var k in villages){var v=villages[k];if(v.clan!==clan)continue;
    var d=Math.hypot((v.cx||0)-x,(v.cy||0)-y);if(d<bd){bd=d;best=v;}}
  return best;
}
function assignVillage(obj,clan,x,y){var v=nearestVillage(clan,x,y);if(!v)v=createVillage(clan,x,y);obj.villageId=v.id;return v;}
function areAtWar(v1,v2){
  if(!v1||!v2||v1.id===v2.id)return false;
  if(v1.allies.indexOf(v2.id)>=0)return false;
  if(v1.wars.indexOf(v2.id)>=0)return true;
  if(v2.wars.indexOf(v1.id)>=0)return true;
  for(var i=0;i<v1.allies.length;i++){var av=villages[v1.allies[i]];if(av&&(av.wars.indexOf(v2.id)>=0))return true;}
  for(var j=0;j<v2.allies.length;j++){var av2=villages[v2.allies[j]];if(av2&&(av2.wars.indexOf(v1.id)>=0))return true;}
  return false;
}
function declareWar(v1,v2){
  if(!v1||!v2||v1.id===v2.id)return false;
  if(v1.wars.indexOf(v2.id)<0)v1.wars.push(v2.id);
  if(v2.wars.indexOf(v1.id)<0)v2.wars.push(v1.id);
  var ai=v1.allies.indexOf(v2.id);if(ai>=0)v1.allies.splice(ai,1);
  var ai2=v2.allies.indexOf(v1.id);if(ai2>=0)v2.allies.splice(ai2,1);
  toast('⚔️ '+v1.name+' начал войну с '+v2.name,2.8);
  for(var i=0;i<beings.length;i++){var u=beings[i];if(u.villageId===v1.id||u.villageId===v2.id){u.atkCd=0;u.currentAction='idle';}}

function getStorageCapacity(clan){
  var cap=Object.assign({},BASE_STORAGE);
  for(var i=0;i<builds.length;i++){
    var b=builds[i];if(b.clan!==clan||b.type!=='warehouse')continue;
    var wC=WAREHOUSE_CAPACITY[b.level-1];
    for(var k in wC)cap[k]=(cap[k]||0)+wC[k];
  }
  cap.wood=Math.max(cap.wood,upgrades.woodCap);
  cap.stone=Math.max(cap.stone,upgrades.stoneCap);
  return cap;
}
function canAfford(clan,cost){
  if(cost.wood&&(wood[clan]||0)<cost.wood)return false;
  if(cost.stone&&minerals.stone<cost.stone)return false;
  if(cost.iron&&minerals.iron<cost.iron)return false;
  if(cost.gold&&minerals.gold<cost.gold)return false;
  return true;
}
function payCost(clan,cost){
  if(cost.wood)wood[clan]=(wood[clan]||0)-cost.wood;
  if(cost.stone)minerals.stone-=cost.stone;
  if(cost.iron)minerals.iron-=cost.iron;
  if(cost.gold)minerals.gold-=cost.gold;
}
function clampStorage(){
  var c0=getStorageCapacity(0),c1=getStorageCapacity(1);
  var cap={wood:Math.max(c0.wood,c1.wood),stone:Math.max(c0.stone,c1.stone),
    iron:Math.max(c0.iron,c1.iron),gold:Math.max(c0.gold,c1.gold),
    diamond:Math.max(c0.diamond,c1.diamond),emerald:Math.max(c0.emerald,c1.emerald)};
  for(var c in wood)wood[c]=Math.min(wood[c],cap.wood);
  var keys=['stone','iron','gold','diamond','emerald'];
  for(var i=0;i<keys.length;i++)minerals[keys[i]]=Math.min(minerals[keys[i]],cap[keys[i]]||0);
}

function generateWorld(){
  tiles.fill(0);oreMap.fill(0);mountainHP.fill(0);burnTimer.fill(0);flowDepth.fill(0);biomeMap.fill(0);
  trees=[];rocks=[];
  var biomeCount=(selectedSize==='empire')?(3+(Math.random()<0.5?0:1)):2;
  var shuffled=BIOMES.slice();
  for(var si=0;si<shuffled.length;si++){var sj=si+Math.floor(Math.random()*(shuffled.length-si));
    var tmpB=shuffled[si];shuffled[si]=shuffled[sj];shuffled[sj]=tmpB;}
  var biomeList=shuffled.slice(0,biomeCount);
  currentBiome=biomeList.map(function(b){return b.name;}).join(' · ');
  if(biomeCount===2){
    var b1=biomeList[0],b2=biomeList[1];
    var splitType=Math.random()<0.5?'x':'y';
    var waveA=Math.random()*6.28,waveB=Math.random()*6.28,bias=0.35+Math.random()*0.3;
    for(var y=0;y<ROWS;y++)
      for(var x=0;x<COLS;x++){
        var t=splitType==='x'?x/COLS:y/ROWS;
        var wave=Math.sin(x*0.18+waveA)*0.09+Math.cos(y*0.14+waveB)*0.09+Math.sin((x+y)*0.08+waveA+waveB)*0.05;
        biomeMap[y*COLS+x]=(t+wave)<bias?0:1;
      }
    for(var i=0;i<tiles.length;i++){var bid=biomeMap[i]===0?b1.id:b2.id;tiles[i]=BASE_TILE[bid]!==undefined?BASE_TILE[bid]:0;}
  }else{
    var seeds=[];
    for(var kk=0;kk<biomeCount;kk++)seeds.push({x:Math.random()*COLS,y:Math.random()*ROWS});
    for(var y2=0;y2<ROWS;y2++)
      for(var x2=0;x2<COLS;x2++){
        var best=0,bd=Infinity;
        for(var s=0;s<seeds.length;s++){var ddx=x2-seeds[s].x,ddy=y2-seeds[s].y;var dd=ddx*ddx+ddy*ddy;if(dd<bd){bd=dd;best=s;}}
        biomeMap[y2*COLS+x2]=best;
      }
    for(var i2=0;i2<tiles.length;i2++){var bid2=biomeList[biomeMap[i2]].id;tiles[i2]=BASE_TILE[bid2]!==undefined?BASE_TILE[bid2]:0;}
  }
  var scale=(COLS*ROWS)/(64*46);
  for(var bi=0;bi<biomeList.length;bi++){
    var bb=biomeList[bi];
    if(bb.id==='mountain'){
      var blobCount=Math.floor(randInt(8,14)*Math.min(3,Math.sqrt(scale)));
      for(var mi=0;mi<blobCount;mi++){
        var mx=rnd(2,COLS-2),my=rnd(2,ROWS-2),angle=rnd(0,Math.PI*2);
        for(var k=0;k<randInt(12,26);k++){
          drawBlobRegion(mx,my,randInt(1,2),2,0.78,bi,biomeMap);
          angle+=rnd(-0.4,0.4);mx+=Math.cos(angle)*2;my+=Math.sin(angle)*2;
          if(mx<2||mx>COLS-2||my<2||my>ROWS-2)break;
        }
      }
    }
  }
  var lakeCount=Math.floor(randInt(3,6)*Math.min(3,Math.sqrt(scale)));
  for(var li=0;li<lakeCount;li++)carveLake(rnd(COLS*0.15,COLS*0.85),rnd(ROWS*0.15,ROWS*0.85),rnd(2,3.5));
  for(var bi2=0;bi2<biomeList.length;bi2++){
    var bb2=biomeList[bi2];
    var n=Math.min(400,Math.floor((bb2.id==='forestfloor'?110:bb2.id==='mountain'?70:bb2.id==='sandy'?40:55)*scale/2));
    for(var ti=0;ti<n;ti++){
      var tx=randInt(2,COLS-3),ty=randInt(2,ROWS-3);
      if(biomeMap[ty*COLS+tx]!==bi2)continue;
      var t2=tiles[ty*COLS+tx];
      var allowed=(bb2.id==='sandy')?t2===3:(t2===0||t2===3||t2===8||t2===9);
      if(!allowed)continue;
      var close=false;
      for(var tj=0;tj<trees.length;tj++){var o=trees[tj];
        if(Math.abs(o.x-(tx*TILE+TILE/2))<TILE*0.8&&Math.abs(o.y-(ty*TILE+TILE/2))<TILE*0.8){close=true;break;}}
      if(close)continue;
      var kinds;
      if(bb2.id==='mountain')kinds=['pine','pine','pine','dead','birch'];
      else if(bb2.id==='sandy')kinds=['palm','palm','palm','palm','dead','oak'];
      else if(bb2.id==='forestfloor')kinds=['oak','oak','oak','oak','pine','birch'];
      else kinds=['birch','birch','birch','birch','oak'];
      addTreeAt(tx,ty,pick(kinds));
    }
  }
  for(var ri=0;ri<biomeList.length;ri++){
    var bb3=biomeList[ri];
    var nR=Math.min(120,Math.floor((bb3.id==='forestfloor'?45:bb3.id==='mountain'?15:bb3.id==='sandy'?9:3)*scale/2));

}
function cleanupRocksOnWater(){
  for(var i=rocks.length-1;i>=0;i--){
    var r=rocks[i],tx=Math.floor(r.x/TILE),ty=Math.floor(r.y/TILE);
    if(tx<0||tx>=COLS||ty<0||ty>=ROWS){rocks.splice(i,1);continue;}
    var g=tiles[ty*COLS+tx];if(g!==0&&g!==3&&g!==8&&g!==9)rocks.splice(i,1);
  }
}
function drawBlobRegion(cx,cy,radius,tileType,density,regionId,bMap){
  var r=Math.ceil(radius),so=Math.random()*100;
  for(var dy=-r;dy<=r;dy++)
    for(var dx=-r;dx<=r;dx++){
      var nx=Math.floor(cx+dx),ny=Math.floor(cy+dy);
      if(nx<0||nx>=COLS||ny<0||ny>=ROWS)continue;
      if(bMap[ny*COLS+nx]!==regionId)continue;
      var d=Math.hypot(dx,dy);
      var wob=Math.sin((dx+so)*0.7)*0.5+Math.cos((dy+so*1.3)*0.6)*0.5;
      if(d+wob<radius&&Math.random()<density)tiles[ny*COLS+nx]=tileType;
    }
}
function spawnRocksRegion(n,regionId,bMap){
  for(var i=0;i<n;i++){
    var tx=randInt(2,COLS-3),ty=randInt(2,ROWS-3);
    if(bMap[ty*COLS+tx]!==regionId)continue;
    var t=tiles[ty*COLS+tx];if(t!==0&&t!==3&&t!==8&&t!==9)continue;
    var cx=tx*TILE+TILE/2,cy=ty*TILE+TILE/2,close=false;
    for(var j=0;j<rocks.length;j++)if(Math.hypot(rocks[j].x-cx,rocks[j].y-cy)<TILE*1.3){close=true;break;}
    if(close)continue;
    for(var j2=0;j2<trees.length;j2++)if(Math.hypot(trees[j2].x-cx,trees[j2].y-cy)<TILE*1.3){close=true;break;}
    if(close)continue;
    var sv=0.8+Math.random()*0.5;
    rocks.push({x:cx,y:cy,hp:45,maxHp:45,size:TILE*0.95*sv,seed:Math.random()});
  }
}
function cleanupTreesOnWater(){
  for(var i=trees.length-1;i>=0;i--){
    var t=trees[i],tx=Math.floor(t.x/TILE),ty=Math.floor(t.y/TILE);
    if(tx<0||tx>=COLS||ty<0||ty>=ROWS){trees.splice(i,1);continue;}
    var g=tiles[ty*COLS+tx];if(g===1||g===2||g===4)trees.splice(i,1);
  }
}
function addTreeAt(tx,ty,k){
  if(trees.length>=500)return;
  var t=TREE_TYPES[k],sv=0.7+Math.random()*0.6;
  trees.push({x:tx*TILE+TILE/2,y:ty*TILE+TILE/2,type:k,
    hp:Math.round(t.hp*sv),maxHp:Math.round(t.hp*sv),size:t.size*sv,
    seed:Math.random(),sway:Math.random()*Math.PI*2,burn:0,shake:0,sizeVar:sv});
}
function carveLake(cx,cy,radius){
  var r=Math.ceil(radius),so=Math.random()*100;
  for(var dy=-r-1;dy<=r+1;dy++)
    for(var dx=-r-1;dx<=r+1;dx++){
      var nx=Math.floor(cx+dx),ny=Math.floor(cy+dy);
      if(nx<0||nx>=COLS||ny<0||ny>=ROWS)continue;
      var d=Math.hypot(dx,dy);
      var wob=Math.sin((dx+so)*0.7)*0.5+Math.cos((dy+so*1.3)*0.6)*0.5;
      var edge=r+wob;
      if(d<edge){var idx=ny*COLS+nx;tiles[idx]=1;flowDepth[idx]=MAX_FLOW;}
      else if(d<edge+1.5){var idx2=ny*COLS+nx;if(tiles[idx2]!==1)tiles[idx2]=3;}
    }
}
function addOceanBorder(){
  var eMin=Math.min(COLS,ROWS),hard=1,soft=Math.max(3,Math.floor(eMin*0.05));
  for(var y=0;y<ROWS;y++)
    for(var x=0;x<COLS;x++){
      if(x<hard||x>=COLS-hard||y<hard||y>=ROWS-hard){var idx=y*COLS+x;tiles[idx]=1;flowDepth[idx]=MAX_FLOW;}
    }
  for(var y2=0;y2<ROWS;y2++)
    for(var x2=0;x2<COLS;x2++){
      var dist=Math.min(x2,y2,COLS-1-x2,ROWS-1-y2);
      if(dist>=soft)continue;
      var idx2=y2*COLS+x2;if(tiles[idx2]===1)continue;
      var tE=Math.max(0,dist-hard)/Math.max(1,soft-hard);
      var noise=Math.sin(x2*0.62+y2*0.89)*0.32+Math.cos(x2*0.27-y2*0.53)*0.28+Math.sin(x2*1.13+y2*0.41)*0.22+Math.cos(x2*0.83+y2*1.27)*0.18;
      var wave=(noise+1)*0.5,thr=0.85-tE*0.65;
      if(wave<thr){tiles[idx2]=1;flowDepth[idx2]=MAX_FLOW;}
    }
}
function addOresToMountains(){
  for(var y=0;y<ROWS;y++)
    for(var x=0;x<COLS;x++){
      var idx=y*COLS+x;if(tiles[idx]!==2)continue;
      mountainHP[idx]=MOUNTAIN_HP;
      var roll=Math.random(),ore=0;
      if(roll<0.55)ore=1;else if(roll<0.8)ore=2;else if(roll<0.93)ore=3;else if(roll<0.98)ore=4;else ore=5;
      oreMap[idx]=ore;
    }
}
function addBeaches(){
  var tc=[];
  for(var y=0;y<ROWS;y++)
    for(var x=0;x<COLS;x++){
      var idx=y*COLS+x;
      if(tiles[idx]!==0&&tiles[idx]!==8&&tiles[idx]!==9)continue;
      if(hasNear(x,y,1)&&Math.random()<0.7)tc.push(idx);
    }
  for(var i=0;i<tc.length;i++)tiles[tc[i]]=3;
}
function hasNear(x,y,v){
  for(var dy=-1;dy<=1;dy++)
    for(var dx=-1;dx<=1;dx++){
      if(!dx&&!dy)continue;
      var nx=x+dx,ny=y+dy;
      if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&tiles[ny*COLS+nx]===v)return true;
    }
  return false;
}

function hostile(a,b){
  if(a.type==='traitor'&&b.type==='traitor')return false; // Предатели не бьют друг друга
  if(a.type==='traitor'){
    if(b.type==='beast'||b.type==='shadow')return true;
    return true; // Предатель атакует всех жителей
  }
  if(b.type==='traitor'){
    if(a.isExposed)return true; // Атакуют, только если заметили
    return false;
  }
  if(a.clan===b.clan){
    if(a.villageId&&b.villageId&&a.villageId!==b.villageId){
      var va=villages[a.villageId],vb=villages[b.villageId];
      if(areAtWar(va,vb))return true;
    }
    return false;
  }
  return true;
}
function breed(p1,p2){
  var c=makeBeing((p1.x+p2.x)/2,(p1.y+p2.y)/2,p1.type,true,Math.random()<0.5?0:1,p1.villageId);
  if(!c)return;
  for(var i=0;i<6;i++)hearts.push({x:c.x+rnd(-10,10),y:c.y-5+rnd(-5,5),vx:rnd(-25,25),vy:rnd(-70,-35),
    life:1.2,maxLife:1.2,size:8+Math.random()*4,color:p1.clan===0?'#ff7aaa':'#c89aff'});
  p1.breedCd=BREED_COOLDOWN;p2.breedCd=BREED_COOLDOWN;
}
function findPartner(u){
  var best=null,bd=BREED_DISTANCE;
  for(var i=0;i<beings.length;i++){
    var o=beings[i];
    if(o===u||o.clan!==u.clan||o.isBaby||o.gender===u.gender)continue;
    if(o.villageId!==u.villageId)continue;
    if(o.breedCd>0||u.breedCd>0)continue;
    var d=Math.hypot(o.x-u.x,o.y-u.y);if(d<bd){bd=d;best=o;}
  }
  return best;
}
function findNearestMountain(x,y,maxDist){
  var tx0=Math.floor(x/TILE),ty0=Math.floor(y/TILE),r=Math.ceil(maxDist/TILE),best=null,bd=maxDist;
  for(var dy=-r;dy<=r;dy++)
    for(var dx=-r;dx<=r;dx++){
      var tx=tx0+dx,ty=ty0+dy;
      if(tx<0||tx>=COLS||ty<0||ty>=ROWS)continue;
      var idx=ty*COLS+tx,t=tiles[idx];
      if(t!==2&&t!==6&&t!==7)continue;
      if(mountainHP[idx]<=0)continue;
      var cx=tx*TILE+TILE/2,cy=ty*TILE+TILE/2;
      var d=Math.hypot(cx-x,cy-y);
      if(d<bd){bd=d;best={tx:tx,ty:ty,idx:idx,x:cx,y:cy,type:t};}
    }
  return best;
}
function generateBoltPath(x1,y1,x2,y2,segments){
  var pts=[{x:x1,y:y1}],dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);
  var px=-dy/Math.max(0.01,len),py=dx/Math.max(0.01,len);
  for(var i=1;i<segments;i++){
    var t=i/segments,qx=x1+dx*t,qy=y1+dy*t;
    var spread=len*0.4*Math.sin(t*Math.PI),off=(Math.random()-0.5)*spread;
    pts.push({x:qx+px*off,y:qy+py*off});
  }
  pts.push({x:x2,y:y2});return pts;
}

        u.vx=rdx/rd*u.speed*0.75;u.vy=rdy/rd*u.speed*0.75;
        if(Math.abs(rdx)>2)u.side=rdx>0?1:-1;
      }else{
        u.wanderT-=sdt;
        if(u.wanderT<=0){u.wanderA=Math.random()*Math.PI*2;u.wanderT=1+Math.random()*2.5;}
        u.vx=Math.cos(u.wanderA)*u.speed*0.42;u.vy=Math.sin(u.wanderA)*u.speed*0.42;
      }
      if(Math.abs(u.vx)>5)u.side=u.vx>0?1:-1;
    }
    
    if(doing!=='chop'&&doing!=='breed'&&doing!=='mine'){
      var nx2=u.x+u.vx*sdt,ny2=u.y+u.vy*sdt,blocked=false;
      for(var i8=0;i8<trees.length;i8++){var t4=trees[i8];
        if(doing==='walk_to_tree'&&t4===u.chopTarget)continue;
        if(Math.hypot(t4.x-nx2,t4.y-ny2)<u.size+6){blocked=true;break;}}
      if(!blocked&&walkable(nx2,u.y))u.x=nx2;
      else if(doing!=='walk_to_tree'&&doing!=='walk_to_mine')u.wanderA+=Math.PI*0.7;
      blocked=false;
      for(var i9=0;i9<trees.length;i9++){var t5=trees[i9];
        if(doing==='walk_to_tree'&&t5===u.chopTarget)continue;
        if(Math.hypot(t5.x-u.x,t5.y-ny2)<u.size+6){blocked=true;break;}}
      if(!blocked&&walkable(u.x,ny2))u.y=ny2;
      else if(doing!=='walk_to_tree'&&doing!=='walk_to_mine')u.wanderA+=Math.PI*0.7;
    }
    
    // Расталкивание (не толпятся в куче)
    for(var i10=0;i10<beings.length;i10++){
      var o2=beings[i10];if(o2===u||u.swimming||o2.swimming)continue;
      var dx8=o2.x-u.x,dy8=o2.y-u.y,d12=Math.hypot(dx8,dy8);
      var minD=(u.size+o2.size)*1.5; // Чуть больше дистанция
      if(d12<minD&&d12>0.01){var push=(minD-d12)*0.5;u.x-=dx8/d12*push*0.6;u.y-=dy8/d12*push*0.6;}
    }
    
    u.x=cl(u.x,4,WORLD_W-4);u.y=cl(u.y,4,WORLD_H-4);
    if(u.atkCd>0)u.atkCd-=sdt;if(u.flash>0)u.flash-=sdt;
    if(Math.hypot(u.vx,u.vy)>5)u.walkPhase+=sdt*12;
    u.currentAction=doing;
    
    if(!u.isLeader&&u.age>=5&&u.bldCd<=0&&(u.currentAction==='wander'||u.currentAction==='idle')&&u.villageId&&u.type!=='traitor'){
      var vN=villages[u.villageId];
      if(vN&&vN.order==='auto'){
        var counts={cottage:0,tent:0,warehouse:0,forge:0,tavern:0,tower:0};
        for(var jb=0;jb<builds.length;jb++){var bN=builds[jb];if(bN.villageId!==u.villageId)continue;counts[bN.type]=(counts[bN.type]||0)+1;}
        var homes=(counts.cottage||0)+(counts.tent||0),plan=null;
        if(counts.warehouse===0)plan={type:'warehouse',cost:{wood:0,stone:0,iron:0,gold:0}};
        else if(counts.forge===0&&homes>=2&&canAfford(u.clan,BUILD_COST.forge[0]))plan={type:'forge',cost:BUILD_COST.forge[0]};
        else if(counts.tavern===0&&homes>=3&&canAfford(u.clan,BUILD_COST.tavern[0]))plan={type:'tavern',cost:BUILD_COST.tavern[0]};
        else if(counts.tower<Math.ceil(homes/4)&&canAfford(u.clan,BUILD_COST.tower[0]))plan={type:'tower',cost:BUILD_COST.tower[0]};
        else if(counts.warehouse<Math.ceil(homes/3)&&canAfford(u.clan,BUILD_COST.warehouse[0]))plan={type:'warehouse',cost:BUILD_COST.warehouse[0]};
        else if(Math.random()<0.55)plan={type:u.clan===0?'cottage':'tent',cost:BUILD_COST[u.clan===0?'cottage':'tent'][0]};
        if(plan&&canAfford(u.clan,plan.cost)){
          var bxN=0,byN=0,okN=false;
          for(var tryi=0;tryi<8;tryi++){
            var angN=Math.random()*Math.PI*2,distN=TILE*(2.5+Math.random()*3);
            bxN=u.x+Math.cos(angN)*distN;byN=u.y+Math.sin(angN)*distN;
            if(walkable(bxN,byN)&&bxN>TILE*2&&bxN<WORLD_W-TILE*2&&byN>TILE*2&&byN<WORLD_H-TILE*2){
              var freeB=true;
              for(var jb2=0;jb2<builds.length;jb2++){if(Math.hypot(builds[jb2].x-bxN,builds[jb2].y-byN)<TILE*2.2){freeB=false;break;}}
              if(freeB){var ctrN=getVillageCenter(u.villageId);if(ctrN&&Math.hypot(ctrN.x-bxN,ctrN.y-byN)<TILE*15){okN=true;break;}}
            }
          }
          if(okN){
            payCost(u.clan,plan.cost);
            var nbN=placeBuild(bxN,byN,plan.type,u.clan,u.villageId);
            if(plan.type==='cottage'&&Math.random()<0.35){nbN.level=2;nbN.maxHp=BUILD_LEVELS.cottage[1].hp;nbN.hp=nbN.maxHp;}
            u.bldCd=28+Math.random()*18;
            for(var k2=0;k2<4;k2++)hearts.push({x:bxN+rnd(-6,6),y:byN-8,vx:rnd(-15,15),vy:rnd(-40,-25),life:0.9,maxLife:0.9,size:7,color:'#ffe14a'});
          }else u.bldCd=4+Math.random()*4;
        }else u.bldCd=6+Math.random()*4;
      }
    }
  }
  for(var i11=trees.length-1;i11>=0;i11--){
    var t6=trees[i11];
    if(t6.hp<=0){
      var chop=null,cd=Infinity;
      for(var j=0;j<beings.length;j++){
        var u3=beings[j];if(u3.clan>1)continue;
        if(u3.chopTarget===t6){var d13=Math.hypot(t6.x-u3.x,t6.y-u3.y);if(d13<cd){cd=d13;chop=u3;}}
      }
      if(chop){var wamt=Math.round(5*t6.sizeVar);wood[chop.clan]=Math.min((wood[chop.clan]||0)+wamt,getStorageCapacity(chop.clan).wood);}
      trees.splice(i11,1);
    }
  }
  for(var i12=beings.length-1;i12>=0;i12--){if(beings[i12].hp<=0)beings.splice(i12,1);}
}

// ═══ ТИК ЗДАНИЙ ═══
function tickBuilds(dt){
  var sdt=dt*speedMult;
  for(var bi=0;bi<builds.length;bi++){
    var b=builds[bi];
    if(b.flash>0)b.flash-=sdt;
    if(b.construction!==undefined&&b.construction>0){
      b.construction-=sdt;
      if(b.construction<=0){
        b.construction=0;
        for(var h=0;h<6;h++)hearts.push({x:b.x+(Math.random()-0.5)*TILE*1.5,y:b.y-TILE*0.4,
          vx:(Math.random()-0.5)*40,vy:-40-Math.random()*40,life:1,maxLife:1,size:6+Math.random()*3,color:'#ffe14a'});
      }
      if(Math.random()<sdt*5&&sparks.length<200){
        sparks.push({x:b.x+(Math.random()-0.5)*TILE*1.8,y:b.y-Math.random()*TILE*1.2-TILE*0.2,
          vx:(Math.random()-0.5)*40,vy:-Math.random()*50-10,life:0.4+Math.random()*0.3,maxLife:0.7,
          c:Math.random()<0.5?'#ffe14a':'#ffa540',s:2});
      }
      continue;
    }
    b.pop+=sdt*1.5;
    var lvls=BUILD_LEVELS[b.type];if(!lvls)continue;
    var L=lvls[b.level-1];if(!L)continue;
    b.spawnT-=sdt;
    if(b.type!=='warehouse'&&b.spawnT<=0&&b.hp>0){
      var cnt=getVillageMembers(b.villageId).length;
      if(cnt<35&&beings.length<upgrades.popLimit){
        var nb=makeBeing(b.x+rnd(-15,15),b.y+rnd(20,35),b.type==='cottage'?'human':'troll',false,null,b.villageId);
        if(nb)nb.villageId=b.villageId;
      }
      b.spawnT=L.spawnEvery;
    }
    if(b.level<3){
      var hasR=false;
      for(var i=0;i<beings.length;i++){
        var u=beings[i];if(u.villageId!==b.villageId)continue;
        if(Math.hypot(u.x-b.x,u.y-b.y)<TILE*4){hasR=true;break;}
      }
      var cost=BUILD_COST[b.type]&&BUILD_COST[b.type][b.level];
      if(hasR&&cost&&canAfford(b.clan,cost)){
        var rate=b.level===1?1/120:1/240;
        b.upgradeProg+=sdt*rate;
        if(b.upgradeProg>=1){
          payCost(b.clan,cost);b.upgradeProg=0;b.level++;
          b.maxHp=lvls[b.level-1].hp;b.hp=b.maxHp;
          b.spawnT=lvls[b.level-1].spawnEvery;clampStorage();
        }
      }else if(hasR&&b.upgradeProg>0)b.upgradeProg=Math.max(0,b.upgradeProg-sdt*0.05);
    }
  }
  for(var i2=builds.length-1;i2>=0;i2--){if(builds[i2].hp<=0)builds.splice(i2,1);}
  clampStorage();checkConquest();
}
function checkConquest(){
  var destroyed=[];
  for(var k in villages){var v=villages[k];if(!v.isKingdom)continue;
    if(getVillageBuilds(v.id).length===0&&getVillageMembers(v.id).length===0)destroyed.push(v);}
  if(!destroyed.length)return;
  for(var di=0;di<destroyed.length;di++){
    var v2=destroyed[di],bd=Infinity,conqueror=null;
    for(var k2 in villages){
      var v3=villages[k2];if(v3.id===v2.id)continue;
      if(getVillageBuilds(v3.id).length===0&&getVillageMembers(v3.id).length===0)continue;
      var d=Math.hypot((v3.cx||0)-v2.cx,(v3.cy||0)-v2.cy);
      if(d<bd){bd=d;conqueror=v3;}
    }
    if(conqueror){
      toast('🏴 '+conqueror.name+' завоевал '+v2.name+'!',3.5);
      var isPlayerDefeated=(playerKingdomId===v2.id);
      for(var b2=0;b2<builds.length;b2++)if(builds[b2].villageId===v2.id)builds[b2].villageId=conqueror.id;
      for(var b3=0;b3<beings.length;b3++)if(beings[b3].villageId===v2.id)beings[b3].villageId=conqueror.id;
      for(var k3 in villages){var v4=villages[k3];
        var wi=v4.wars.indexOf(v2.id);if(wi>=0)v4.wars.splice(wi,1);
        var ai2=v4.allies.indexOf(v2.id);if(ai2>=0)v4.allies.splice(ai2,1);}
      delete villages[v2.id];
      if(isPlayerDefeated){gameOver=true;gameOverKingdomName=v2.name;saveWorld();}
    }else delete villages[v2.id];
  }
  buildOwnerMap();saveWorld();
}

// ═══ ТИКИ ПРОЧЕГО ═══
function tickTrees(dt){
  var sdt=dt*speedMult;
  for(var i=0;i<trees.length;i++){
    var t=trees[i];
    if(t.shake>0)t.shake-=sdt;
    if(t.burn>0){t.burn-=sdt;t.hp-=20*sdt;}
    var tx=Math.floor(t.x/TILE),ty=Math.floor(t.y/TILE);
    if(tx>=0&&tx<COLS&&ty>=0&&ty<ROWS){if(tiles[ty*COLS+tx]===4&&t.burn<=0)t.burn=2;}
  }
}
function tickFire(dt){
  var sdt=dt*speedMult;
  for(var i=0;i<burnTimer.length;i++){
    if(burnTimer[i]<=0)continue;
    burnTimer[i]-=sdt;
    var px=(i%COLS)*TILE+TILE/2,py=Math.floor(i/COLS)*TILE+TILE/2;
    for(var j=0;j<beings.length;j++){var u=beings[j];if(u.swimming)continue;if(Math.abs(u.x-px)<TILE&&Math.abs(u.y-py)<TILE){u.hp-=25*sdt;u.flash=0.1;}}
    for(var jA=0;jA<animals.length;jA++){var aa=animals[jA];if(Math.abs(aa.x-px)<TILE&&Math.abs(aa.y-py)<TILE){aa.hp-=25*sdt;aa.flash=0.1;}}
    for(var j2=0;j2<builds.length;j2++){var b=builds[j2];if(Math.abs(b.x-px)<40&&Math.abs(b.y-py)<40){b.hp-=30*sdt;b.flash=0.1;}}
    var gen=burnGen[i];
    if(gen<MAX_BURN_GEN&&Math.random()<sdt*1.2){
      var dirs=[[1,0],[-1,0],[0,1],[0,-1]],dir=dirs[Math.floor(Math.random()*4)];
      var nx=(i%COLS)+dir[0],ny=Math.floor(i/COLS)+dir[1];
      if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS){
        var ni=ny*COLS+nx;
        if((tiles[ni]===0||tiles[ni]===3||tiles[ni]===8||tiles[ni]===9)&&burnTimer[ni]<=0){burnTimer[ni]=1.5+Math.random()*1.5;burnGen[ni]=gen+1;}
      }
    }
    if(burnTimer[i]<=0){var t=tiles[i];if(t===0||t===3||t===4||t===8||t===9)tiles[i]=5;flowDepth[i]=0;}
  }
}
function tickSparks(dt){
  var sdt=dt*speedMult;
  if(getSetting('quality','high')==='low'&&sparks.length>30)sparks.splice(0,sparks.length-30);
  for(var i=sparks.length-1;i>=0;i--){
    var p=sparks[i];p.x+=p.vx*sdt;p.y+=p.vy*sdt;p.vy+=60*sdt;p.life-=sdt;
    if(p.life<=0)sparks.splice(i,1);
  }
}
function tickHearts(dt){
  var sdt=dt*speedMult;
  if(getSetting('quality','high')==='low'&&hearts.length>10)hearts.splice(0,hearts.length-10);
  for(var i=hearts.length-1;i>=0;i--){
    var h=hearts[i];h.x+=h.vx*sdt;h.y+=h.vy*sdt;h.vy+=30*sdt;h.life-=sdt;
    if(h.life<=0)hearts.splice(i,1);
  }
}
function tickAnimals(dt){
  var sdt=dt*speedMult;
  for(var i=animals.length-1;i>=0;i--){
    var a=animals[i],flee=null,fd=95;
    for(var j=0;j<beings.length;j++){
      var u=beings[j];if(u.swimming||u.clan>=2)continue;
      var d=Math.hypot(u.x-a.x,u.y-a.y);if(d<fd){fd=d;flee=u;}
    }
    if(flee){
      var dx=a.x-flee.x,dy=a.y-flee.y,dd=Math.max(0.01,Math.hypot(dx,dy));
      a.vx=dx/dd*a.speed*1.4;a.vy=dy/dd*a.speed*1.4;
      if(Math.abs(dx)>2)a.side=dx>0?1:-1;
    }else{
      a.wanderT-=sdt;
      if(a.wanderT<=0){a.wanderA=Math.random()*Math.PI*2;a.wanderT=1+Math.random()*3;}
      a.vx=Math.cos(a.wanderA)*a.speed*0.4;a.vy=Math.sin(a.wanderA)*a.speed*0.4;
      if(Math.abs(a.vx)>5)a.side=a.vx>0?1:-1;
    }
    var nx=a.x+a.vx*sdt,ny=a.y+a.vy*sdt;
    if(walkable(nx,a.y))a.x=nx;else a.wanderA+=Math.PI*0.7;
    if(walkable(a.x,ny))a.y=ny;else a.wanderA+=Math.PI*0.7;
    a.x=cl(a.x,4,WORLD_W-4);a.y=cl(a.y,4,WORLD_H-4);
    if(a.flash>0)a.flash-=sdt;
    if(Math.hypot(a.vx,a.vy)>5)a.walkPhase+=sdt*12;
    if(a.hp<=0){
      var bestClan=0,bd=Infinity;
      for(var k=0;k<beings.length;k++){var u2=beings[k];if(u2.clan>1)continue;
        var d2=Math.hypot(u2.x-a.x,u2.y-a.y);if(d2<bd){bd=d2;bestClan=u2.clan;}}
      food[bestClan]=Math.min((food[bestClan]||0)+a.meat,upgrades.foodCap);
      for(var hh=0;hh<4;hh++)hearts.push({x:a.x+rnd(-6,6),y:a.y-4,vx:rnd(-15,15),vy:rnd(-40,-20),life:0.9,maxLife:0.9,size:7,color:'#8aff6a'});
      animals.splice(i,1);
    }
  }
}

function paintAnimal(a){
  if(!a||!a.type)return;
  var T=ANIMAL_TYPES[a.type];if(!T)return;
  var s=a.size,fl=a.flash>0;
  var isMoving=Math.hypot(a.vx,a.vy)>5;
  var wc=isMoving?Math.sin(a.walkPhase):0,wc2=isMoving?Math.sin(a.walkPhase+Math.PI):0;
  var bob=isMoving?Math.abs(Math.sin(a.walkPhase*2))*s*0.08:0;
  
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.beginPath();ctx.ellipse(a.x,a.y+s*0.8,s*1.1,s*0.3,0,0,Math.PI*2);ctx.fill();
  
  ctx.save();ctx.translate(a.x,a.y-bob);
  if(a.side<0)ctx.scale(-1,1);
  var base=fl?'#ffffff':T.color,dark=fl?'#ffffff':T.dark;
  var light=fl?'#ffffff':mixHex(T.color,'#ffffff',0.3);
  var r=ANIMAL_RENDER[a.type];
  if(r)r(s,base,dark,light,wc,wc2);
  ctx.restore();
  if(a.hp<a.maxHp){
    var bw=s*1.9,bh=3,bx=a.x-bw/2,by=a.y-s*1.9;
    ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(bx-1,by-1,bw+2,bh+2);
    var r2=a.hp/a.maxHp;
    ctx.fillStyle=r2>0.5?'#4aff6a':r2>0.25?'#f0e05a':'#ff4a5a';
    ctx.fillRect(bx,by,bw*r2,bh);
  }
}

function drawToolInHand(u,s){
  var a=u.currentAction,t='axe';
  if(u.type==='warrior')t='sword';
  else if(u.type==='traitor')t='dagger';
  else if(a==='chop'||a==='walk_to_tree')t='axe';
  else if(a==='mine'||a==='walk_to_mine')t='pickaxe';
  else if(a==='attack'||a==='hunt')t='sword';
  else if(u.type==='traitor')t='dagger';
  else return;

  var hx=s*0.4+s*0.05,hy=-s*1.05+s*0.08+s*0.85*0.85;
  ctx.save();ctx.translate(hx,hy);
  var rot=(t==='axe')?Math.sin(worldTime*20)*1.3:(t==='pickaxe')?Math.sin(worldTime*16)*1.15:(t==='dagger')?Math.sin(worldTime*15)*1.1-0.2:Math.sin(worldTime*14)*0.9-0.15;
  ctx.rotate(rot);
  if(t==='axe')drawAxeTool(s);
  else if(t==='pickaxe')drawPickaxeTool(s);
  else if(t==='dagger')drawDaggerTool(s);
  else drawSwordTool(s);
  ctx.restore();
}

function drawWindow(cx,cy,w,h,isOn,cross){

    var t=Math.min(1,(dark-0.45)/0.4);
    winCol='rgb('+Math.round(160+95*t)+','+Math.round(190+45*t)+','+Math.round(210-60*t)+')';

  ctx.strokeStyle='#2a2010';ctx.lineWidth=0.9;

    ctx.beginPath();ctx.moveTo(cx,cy-h/2);ctx.lineTo(cx,cy+h/2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-w/2,cy);ctx.lineTo(cx+w/2,cy);ctx.stroke();

function drawCottageLog(b,x,y,w,h,fl){

    if(b.level===1)drawCottageLog(b,x,y,w,h,fl);
    else if(b.level===2)drawCottageTudor(b,x,y,w,h,fl);
    else drawCottageMansion(b,x,y,w,h,fl);
  }else if(b.type==='tent')drawTentModel(b,x,y,w,h,fl);
  else drawWarehouseModel(b,x,y,w,h,fl);
  ctx.restore();
  if(constructing){
    var sx=x-w*0.12,sy=y-h*0.05,sw=w*1.24,sh=h*1.15,lw=2/zoom;
    ctx.save();ctx.lineCap='round';
    ctx.strokeStyle='rgba(180,130,60,0.85)';ctx.lineWidth=lw*1.2;
    for(var i=0;i<=3;i++){var px=sx+sw*i/3;ctx.beginPath();ctx.moveTo(px,sy);ctx.lineTo(px,sy+sh);ctx.stroke();}
    for(var j=0;j<=2;j++){var py=sy+sh*j/2;ctx.beginPath();ctx.moveTo(sx,py);ctx.lineTo(sx+sw,py);ctx.stroke();}
    var barW=w*1.15,barH=4/zoom,bx2=b.x-barW/2,by2=y-h*0.22;
    ctx.fillStyle='rgba(0,0,0,0.75)';
    roundRect(bx2-2/zoom,by2-2/zoom,barW+4/zoom,barH+4/zoom,3/zoom);ctx.fill();
    var grd=ctx.createLinearGradient(bx2,0,bx2+barW,0);
    grd.addColorStop(0,'#ff8a3a');grd.addColorStop(0.6,'#ffc850');grd.addColorStop(1,'#ffe14a');
    ctx.fillStyle=grd;roundRect(bx2,by2,barW*prog,barH,2/zoom);ctx.fill();
    ctx.font='bold '+(14/zoom)+'px -apple-system,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#ffe14a';
    ctx.fillText('🏗',b.x,by2-10/zoom);
    ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.restore();
  }
  if(zoom>0.5)paintVillageMarker(b,y);
}

// ═══ ДЕРЕВЬЯ / КАМНИ / ГОРЫ ═══
function paintTree(t){
  var T=TREE_TYPES[t.type],s=t.size,seed=t.seed;
  var sway=Math.sin(worldTime*1.2+t.sway)*1.5,shake=t.shake>0?Math.sin(worldTime*40)*t.shake*6:0;
  var burning=t.burn>0;
  
  var sh=ctx.createRadialGradient(t.x+s*0.15,t.y+s*0.35,1,t.x+s*0.15,t.y+s*0.35,s*0.85);
  sh.addColorStop(0,'rgba(0,0,0,0.4)');sh.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sh;ctx.beginPath();ctx.ellipse(t.x+s*0.15,t.y+s*0.35,s*0.85,s*0.32,0,0,Math.PI*2);ctx.fill();
  
  var tw=s*0.24,tx=t.x-tw/2+shake,ty=t.y-s*0.5;
  var tg=ctx.createLinearGradient(tx,0,tx+tw,0);
  tg.addColorStop(0,burning?'#2a1810':T.trunk);
  tg.addColorStop(0.45,burning?'#3a2010':(t.type!=='birch'?shadeHex(T.trunk,1.35):T.trunk));
  tg.addColorStop(1,burning?'#1a0e08':shadeHex(T.trunk,0.7));
  ctx.fillStyle=tg;ctx.fillRect(tx,ty,tw,s*0.9);
  if(t.type==='dead'){
    ctx.strokeStyle=burning?'#3a2010':T.trunk;ctx.lineWidth=Math.max(1.5,s*0.09);ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(t.x+shake,t.y-s*0.3);ctx.lineTo(t.x-s*0.45+shake,t.y-s*0.75);
    ctx.moveTo(t.x+shake,t.y-s*0.5);ctx.lineTo(t.x+s*0.38+shake,t.y-s*0.95);
    ctx.moveTo(t.x+shake,t.y-s*0.6);ctx.lineTo(t.x-s*0.28+shake,t.y-s*1.05);
    ctx.stroke();return;
  }
  if(t.type==='pine'){
    for(var k=0;k<4;k++){
      var ly=t.y-s*0.35-k*s*0.42,lw=s*(1.05-k*0.2);
      var base=burning?'#2a1808':(k===0?T.c1:T.c2);
      ctx.fillStyle=base;
      ctx.beginPath();ctx.moveTo(t.x+sway*k*0.3+shake,ly-s*0.75);ctx.lineTo(t.x-lw+shake,ly);ctx.lineTo(t.x+lw+shake,ly);ctx.closePath();ctx.fill();
    }
  }else if(t.type==='palm'){
    var topX=t.x+sway+shake,topY=t.y-s*1.15;
    var bc=burning?'#3a2a10':T.c1;
    for(var k2=0;k2<7;k2++){
      var ang=(k2/7)*Math.PI*2-Math.PI/2+Math.sin(worldTime+seed*6)*0.08;
      var lx=topX+Math.cos(ang)*s,ly2=topY+Math.sin(ang)*s*0.6;
      ctx.fillStyle=bc;ctx.beginPath();ctx.moveTo(topX,topY);
      ctx.quadraticCurveTo(topX+Math.cos(ang)*s*0.55,topY+Math.sin(ang)*s*0.55-s*0.3,lx,ly2);ctx.fill();
    }
  }else{
    var topX2=t.x+sway*0.5+shake,topY2=t.y-s*1.05;
    var c1=burning?'#3a2a10':T.c1,c2=burning?'#5a3a10':T.c2;
    
    ctx.fillStyle=c1;
    ctx.beginPath();
    ctx.arc(topX2-s*0.3,topY2+s*0.1,s*0.6,0,Math.PI*2);
    ctx.arc(topX2+s*0.32,topY2+s*0.12,s*0.58,0,Math.PI*2);
    ctx.arc(topX2,topY2-s*0.2,s*0.62,0,Math.PI*2);
    ctx.arc(topX2-s*0.05,topY2+s*0.35,s*0.55,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle=c2;
    ctx.beginPath();
    ctx.arc(topX2-s*0.18,topY2+s*0.02,s*0.48,0,Math.PI*2);
    ctx.arc(topX2+s*0.22,topY2+s*0.05,s*0.45,0,Math.PI*2);
    ctx.fill();
  }
  if(burning){
    var fl=Math.sin(worldTime*10+t.sway)*0.3+0.7;
    ctx.globalAlpha=fl*0.65;
    var fg=ctx.createRadialGradient(t.x,t.y-s*0.8,2,t.x,t.y-s*0.8,s*1.3);
    fg.addColorStop(0,'rgba(255,240,140,0.95)');fg.addColorStop(0.4,'rgba(255,140,40,0.7)');fg.addColorStop(1,'rgba(180,40,20,0)');
    ctx.fillStyle=fg;ctx.beginPath();ctx.arc(t.x,t.y-s*0.8,s*1.3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  }
}

// ═══ УЛУЧШЕННЫЕ ВАЛУНЫ ═══
function paintRock(r){
  var s = r.size, hp = r.hp / r.maxHp;
  
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.ellipse(r.x, r.y + s * 0.4, s * 0.9, s * 0.4, 0, 0, Math.PI * 2); ctx.fill();

  var bg = ctx.createLinearGradient(r.x - s * 0.6, r.y - s * 0.6, r.x + s * 0.6, r.y + s * 0.6);
  bg.addColorStop(0, '#b0b0b8');
  bg.addColorStop(0.4, '#8a8a92');
  bg.addColorStop(0.8, '#5a5a62');
  bg.addColorStop(1, '#3a3a42');
  
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(r.x - s * 0.7, r.y - s * 0.1);
  ctx.lineTo(r.x - s * 0.5, r.y - s * 0.6);
  ctx.lineTo(r.x + s * 0.2, r.y - s * 0.7);
  ctx.lineTo(r.x + s * 0.7, r.y - s * 0.3);
  ctx.lineTo(r.x + s * 0.6, r.y + s * 0.5);
  ctx.lineTo(r.x - s * 0.1, r.y + s * 0.6);
  ctx.lineTo(r.x - s * 0.6, r.y + s * 0.3);
  ctx.closePath();
  ctx.fill();
  
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath();
  ctx.moveTo(r.x - s * 0.5, r.y - s * 0.4);
  ctx.lineTo(r.x - s * 0.1, r.y - s * 0.6);
  ctx.lineTo(r.x + s * 0.3, r.y - s * 0.4);
  ctx.lineTo(r.x - s * 0.1, r.y - s * 0.2);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(r.x - s * 0.3, r.y - s * 0.2);
  ctx.lineTo(r.x - s * 0.1, r.y + s * 0.1);
  ctx.lineTo(r.x + s * 0.2, r.y + s * 0.05);
  ctx.stroke();
  
  ctx.beginPath();
  ctx.moveTo(r.x + s * 0.1, r.y - s * 0.5);
  ctx.lineTo(r.x + s * 0.3, r.y - s * 0.1);
  ctx.stroke();

  if (r.seed > 0.5) {
    ctx.fillStyle = 'rgba(80, 160, 60, 0.4)';
    ctx.beginPath();
    ctx.arc(r.x - s * 0.4, r.y - s * 0.3, s * 0.15, 0, Math.PI * 2);
    ctx.arc(r.x - s * 0.2, r.y - s * 0.45, s * 0.1, 0, Math.PI * 2);
    ctx.fill();
  }

  if (r.hp < r.maxHp) {
    var bw = s * 1.2, bh = 2.5, bx = r.x - bw / 2, by = r.y - s * 0.9;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(bx - 0.5, by - 0.5, bw + 1, bh + 1);
    ctx.fillStyle = hp > 0.5 ? '#4aff6a' : hp > 0.25 ? '#f0e05a' : '#ff4a5a';
    ctx.fillRect(bx, by, bw * hp, bh);
  }
}

function drawMountainTile(gx,gy,idx){
  var px=gx*TILE,py=gy*TILE,seed=decorSeed[idx],ore=oreMap[idx],hp=mountainHP[idx];
  var maxHp=MOUNTAIN_HP,dmgRatio=1-Math.max(0,hp/maxHp);
  var bg=ctx.createLinearGradient(px,py,px,py+TILE);
  bg.addColorStop(0,'#4a4a5e');bg.addColorStop(0.5,'#5a5a6e');bg.addColorStop(1,'#3a3a4a');
  ctx.fillStyle=bg;ctx.fillRect(px,py,TILE+1,TILE+1);
  var cx=px+TILE*0.5,topY=py+TILE*(0.1+seed*0.15),baseY=py+TILE*0.98,w2=TILE*(0.75+seed*0.15);
  ctx.fillStyle='#9090a8';
  ctx.beginPath();ctx.moveTo(cx,topY);ctx.lineTo(cx-w2*0.5,baseY);ctx.lineTo(cx,baseY);ctx.closePath();ctx.fill();
  ctx.fillStyle='#3a3a4e';
  ctx.beginPath();ctx.moveTo(cx,topY);ctx.lineTo(cx+w2*0.5,baseY);ctx.lineTo(cx,baseY);ctx.closePath();ctx.fill();
  if(ore>0&&ORE_TYPES[ore]){
    for(var k=0;k<3;k++){
      var ox=px+((seed*(k+1)*137)%(TILE-12))+6;
      var oy=py+((seed*(k+1)*179)%(TILE-12))+6;
      drawOreGem(ox,oy,2.6,ore,1);
    }
  }
  if(hp<maxHp&&hp>0){
    var bw=TILE-6,bh=2.5,bx=px+3,by=py+2;
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(bx-1,by-1,bw+2,bh+2);
    ctx.fillStyle=dmgRatio<0.5?'#ffd94a':'#ff6a3a';
    ctx.fillRect(bx,by,bw*(1-dmgRatio),bh);
  }
}
function drawShaftTile(gx,gy){

  var bg=ctx.createLinearGradient(px,py,px,py+TILE);
  bg.addColorStop(0,'#6a4a2a');bg.addColorStop(1,'#4a2e18');
  ctx.fillStyle=bg;ctx.fillRect(px,py,TILE+1,TILE+1);
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(px+TILE/2,py+TILE/2,TILE*0.55,0,Math.PI*2);ctx.fill();
}
function drawDeepShaftTile(gx,gy){
  var px=gx*TILE,py=gy*TILE;
  var bg=ctx.createLinearGradient(px,py,px,py+TILE);
  bg.addColorStop(0,'#3a3a4a');bg.addColorStop(1,'#1a1a2a');
  ctx.fillStyle=bg;ctx.fillRect(px,py,TILE+1,TILE+1);

}
function drawFireOverlay(px,py,idx){
  var fl=Math.sin(worldTime*9+idx*0.7)*0.35+0.65;
  var intensity=Math.min(1,burnTimer[idx]/2.5);
  var glow=ctx.createRadialGradient(px+TILE/2,py+TILE*0.7,1,px+TILE/2,py+TILE*0.7,TILE*0.9);
  glow.addColorStop(0,'rgba(255,200,60,'+(0.55*intensity*fl)+')');
  glow.addColorStop(0.5,'rgba(255,120,30,'+(0.35*intensity)+')');
  glow.addColorStop(1,'rgba(255,60,0,0)');
  ctx.fillStyle=glow;ctx.fillRect(px-2,py-2,TILE+4,TILE+4);
}
function drawBolts(){
  for(var bi=0;bi<bolts.length;bi++){
    var b=bolts[bi],a=b.life/b.maxLife;
    ctx.save();
    if(b.blur>0){ctx.shadowColor=b.blurColor||b.color;ctx.shadowBlur=b.blur*a;}
    ctx.strokeStyle=b.color;ctx.globalAlpha=a;ctx.lineWidth=b.width;ctx.lineCap='round';
    ctx.beginPath();
    if(b.path.length>0){
      ctx.moveTo(b.path[0].x,b.path[0].y);
      for(var i=1;i<b.path.length;i++)ctx.lineTo(b.path[i].x,b.path[i].y);
    }
    ctx.stroke();ctx.restore();
  }
  ctx.globalAlpha=1;
}
function drawDayNight(){
  var darkness=getDarkness();
  if(darkness>0.05){ctx.fillStyle='rgba(15,20,60,'+(darkness*0.55)+')';ctx.fillRect(0,0,cw,VIEW_H);}
}
function drawHeart(x,y,size,color){
  ctx.save();ctx.translate(x,y);var s=size/16;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(0,5*s);ctx.bezierCurveTo(-8*s,-1*s,-8*s,-8*s,0,-4*s);
  ctx.bezierCurveTo(8*s,-8*s,8*s,-1*s,0,5*s);ctx.closePath();ctx.fill();ctx.restore();
}
function drawOreGem(cx,cy,r,type,scale){
  scale=scale||1;ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);
  var oc=ORE_TYPES[type];if(!oc){ctx.restore();return;}
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.arc(0,r*1.3,r*0.9,0,Math.PI*2);ctx.fill();
  if(type===1){
    var g1=ctx.createLinearGradient(-r,-r,r,r);
    g1.addColorStop(0,'#e0e0e8');g1.addColorStop(0.5,'#a8a8b2');g1.addColorStop(1,'#6a6a74');
    ctx.fillStyle=g1;ctx.beginPath();
    ctx.moveTo(-r*0.8,-r*0.5);ctx.lineTo(r*0.3,-r*0.9);ctx.lineTo(r*0.9,-r*0.2);
    ctx.lineTo(r*0.5,r*0.8);ctx.lineTo(-r*0.6,r*0.6);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#4a4a52';ctx.lineWidth=r*0.15;ctx.stroke();
  }else if(type===2){
    var g2=ctx.createLinearGradient(-r,-r,r,r);
    g2.addColorStop(0,'#e0a878');g2.addColorStop(0.4,'#b87848');g2.addColorStop(0.7,'#8a5020');g2.addColorStop(1,'#5a3418');
    ctx.fillStyle=g2;ctx.beginPath();
    ctx.moveTo(-r*0.9,r*0.3);ctx.lineTo(-r*0.7,-r*0.3);ctx.lineTo(r*0.6,-r*0.5);
    ctx.lineTo(r*0.95,r*0.1);ctx.lineTo(r*0.7,r*0.6);ctx.lineTo(-r*0.6,r*0.7);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#3a1a08';ctx.lineWidth=r*0.18;ctx.stroke();
  }else if(type===3){
    var g3=ctx.createRadialGradient(-r*0.3,-r*0.4,r*0.1,0,0,r*1.4);
    g3.addColorStop(0,'#fff5a0');g3.addColorStop(0.4,'#ffe14a');g3.addColorStop(0.8,'#c89818');g3.addColorStop(1,'#7a5a10');
    ctx.fillStyle=g3;ctx.beginPath();ctx.arc(0,0,r*0.9,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#4a3008';ctx.lineWidth=r*0.15;ctx.stroke();
  }else if(type===4){
    var g4=ctx.createLinearGradient(-r,-r,r,r);
    g4.addColorStop(0,'#c8ffff');g4.addColorStop(0.4,'#5affd0');g4.addColorStop(0.8,'#2a9a88');g4.addColorStop(1,'#0a4a40');
    ctx.fillStyle=g4;ctx.beginPath();
    ctx.moveTo(0,-r*1.1);ctx.lineTo(r*0.85,-r*0.3);ctx.lineTo(r*0.55,r*0.75);
    ctx.lineTo(-r*0.55,r*0.75);ctx.lineTo(-r*0.85,-r*0.3);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#0a4a40';ctx.lineWidth=r*0.16;ctx.stroke();
  }else if(type===5){
    var g5=ctx.createLinearGradient(-r,-r,r,r);
    g5.addColorStop(0,'#c8ffcc');g5.addColorStop(0.4,'#5aff6a');g5.addColorStop(0.8,'#1a8a2a');g5.addColorStop(1,'#0a4a10');
    ctx.fillStyle=g5;ctx.beginPath();
    for(var i=0;i<6;i++){
      var a=(i/6)*Math.PI*2-Math.PI/2,px2=Math.cos(a)*r,py2=Math.sin(a)*r;
      if(i===0)ctx.moveTo(px2,py2);else ctx.lineTo(px2,py2);
    }
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#0a4a10';ctx.lineWidth=r*0.16;ctx.stroke();
  }
  ctx.restore();
}
function drawOreHudIcon(cx,cy,size,type,full){
  ctx.save();ctx.translate(cx,cy);
  var col=full?'#ff8060':(ORE_TYPES[type]?ORE_TYPES[type].color:'#fff');
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,size*0.8,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ═══ РЕНДЕР МИРА ═══
function renderWorld(){
  var bgGrad=ctx.createLinearGradient(0,0,0,VIEW_H);
  bgGrad.addColorStop(0,'#1a1030');bgGrad.addColorStop(1,'#2a1a4a');
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,cw,VIEW_H);
  var vw=cw/zoom,vh=VIEW_H/zoom;
  var x0=Math.max(0,Math.floor(camX/TILE)-2),x1=Math.min(COLS,Math.ceil((camX+vw)/TILE)+2);
  var y0=Math.max(0,Math.floor(camY/TILE)-2),y1=Math.min(ROWS,Math.ceil((camY+vh)/TILE)+2);
  ctx.save();ctx.scale(zoom,zoom);ctx.translate(-camX,-camY);
  for(var y=y0;y<y1;y++)for(var x=x0;x<x1;x++){
    var idx=y*COLS+x,t=tiles[idx],seed=decorSeed[idx],px=x*TILE,py=y*TILE;
    if(t===0){var a1=tileCache.grass;ctx.drawImage(a1[Math.floor(seed*a1.length)%a1.length],px,py,TILE+1,TILE+1);}
    else if(t===8){var a2=tileCache.forestfloor;ctx.drawImage(a2[Math.floor(seed*a2.length)%a2.length],px,py,TILE+1,TILE+1);}
    else if(t===9){var a3=tileCache.snow;ctx.drawImage(a3[Math.floor(seed*a3.length)%a3.length],px,py,TILE+1,TILE+1);}
    else if(t===3){var a4=tileCache.sand;ctx.drawImage(a4[Math.floor(seed*a4.length)%a4.length],px,py,TILE+1,TILE+1);}
    else if(t===5){var a5=tileCache.burnt;ctx.drawImage(a5[Math.floor(seed*a5.length)%a5.length],px,py,TILE+1,TILE+1);}
  }
  for(var y2=y0;y2<y1;y2++)for(var x2=x0;x2<x1;x2++){
    var idx2=y2*COLS+x2,t2=tiles[idx2];
    if(t2===2)drawMountainTile(x2,y2,idx2);
    else if(t2===6)drawShaftTile(x2,y2);
    else if(t2===7)drawDeepShaftTile(x2,y2);
  }
  var wbf=Math.floor(worldTime*10);
  for(var y3=y0;y3<y1;y3++)for(var x3=x0;x3<x1;x3++){
    var idx3=y3*COLS+x3;if(tiles[idx3]!==1)continue;
    var px3=x3*TILE,py3=y3*TILE,fo=Math.floor(x3*TILE*0.08+y3*TILE*0.05);
    var wF=((wbf+fo)%WATER_FRAMES+WATER_FRAMES)%WATER_FRAMES;
    ctx.drawImage(tileCache.water[wF],px3,py3,TILE+1,TILE+1);
  }
  var lbf=Math.floor(worldTime*7);
  for(var y4=y0;y4<y1;y4++)for(var x4=x0;x4<x1;x4++){
    var idx4=y4*COLS+x4;if(tiles[idx4]!==4)continue;
    var px4=x4*TILE,py4=y4*TILE,fF=((lbf+Math.floor(y4*0.9))%LAVA_FRAMES+LAVA_FRAMES)%LAVA_FRAMES;
    ctx.drawImage(tileCache.lava[fF],px4,py4,TILE+1,TILE+1);
  }
  for(var y5=y0;y5<y1;y5++)for(var x5=x0;x5<x1;x5++){
    var idx5=y5*COLS+x5;if(burnTimer[idx5]<=0)continue;
    var t5=tiles[idx5];if(t5!==0&&t5!==3&&t5!==8&&t5!==9)continue;
    drawFireOverlay(x5*TILE,y5*TILE,idx5);
  }
  drawKingdomBorders();drawBolts();
  var list=[];

function drawClockDial(){
  var size=68,cx=size/2+14,cy=VIEW_H-14-size/2;
  var bgGrad=ctx.createRadialGradient(cx,cy,2,cx,cy,size*0.55);
  bgGrad.addColorStop(0,'rgba(40,25,70,0.95)');bgGrad.addColorStop(1,'rgba(15,8,30,0.95)');
  ctx.fillStyle=bgGrad;ctx.beginPath();ctx.arc(cx,cy,size/2,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(160,120,255,0.7)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,cy,size/2-1,0,Math.PI*2);ctx.stroke();
  var angle=cyclePhase*Math.PI*2-Math.PI/2,arrowLen=size/2-10;
  ctx.strokeStyle='#ffe14a';ctx.lineWidth=2.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(angle)*arrowLen,cy+Math.sin(angle)*arrowLen);ctx.stroke();
  ctx.fillStyle='#ffe14a';ctx.beginPath();ctx.arc(cx,cy,2.5,0,Math.PI*2);ctx.fill();
  var ph=cyclePhase,timeLabel;
  if(ph<0.1||ph>=0.9)timeLabel='🌙 Ночь';
  else if(ph<0.25)timeLabel='🌅 Рассвет';
  else if(ph<0.4)timeLabel='☀️ Утро';
  else if(ph<0.6)timeLabel='☀️ День';
  else if(ph<0.75)timeLabel='🌇 Закат';
  else timeLabel='🌆 Вечер';
  ctx.font='bold 10px -apple-system,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(200,180,255,0.9)';
  ctx.fillText(timeLabel,cx,cy+size/2+10);
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
}
function renderMinimap(){
  var ms=Math.min(96,cw*0.22),mx=cw-ms-10,my=VIEW_H-ms-10;
  minimapRect={x:mx,y:my,w:ms,h:ms};
  ctx.fillStyle='rgba(10,5,20,0.72)';
  roundRect(mx,my,ms,ms,6);ctx.fill();
  ctx.strokeStyle='rgba(160,120,255,0.8)';ctx.lineWidth=1.5;
  roundRect(mx,my,ms,ms,6);ctx.stroke();
  
  var pw=ms-4,ph=ms-4,px=mx+2,py=my+2,sx=pw/COLS,sy=ph/ROWS;
  var step=Math.max(1,Math.floor(COLS/100));
  
  for(var y=0;y<ROWS;y+=step){
    for(var x=0;x<COLS;x+=step){
      var t=tiles[y*COLS+x],c='rgba(80,120,60,0.5)'; // grass default
      if(t===1)c='rgba(40,90,160,0.85)'; // water
      else if(t===2||t===6||t===7)c='rgba(120,120,140,0.8)'; // mountains
      else if(t===4)c='rgba(255,80,20,0.9)'; // lava
      else if(t===5)c='rgba(60,40,30,0.85)'; // burnt
      else if(t===9)c='rgba(240,250,255,0.9)'; // snow
      else if(t===3)c='rgba(210,180,120,0.8)'; // sand
      
      ctx.fillStyle=c;
      ctx.fillRect(px+x*sx,py+y*sy,Math.ceil(sx*step),Math.ceil(sy*step));
    }
  }
  
  for(var ib=0;ib<builds.length;ib++){
    var b=builds[ib],v=villages[b.villageId];
    ctx.fillStyle=v?v.color:'#fff';
    ctx.fillRect(px+b.x/TILE*sx-1,py+b.y/TILE*sy-1,2.5,2.5);
  }
  for(var ik in villages){
    var v2=villages[ik];
    var kx=px+(v2.cx/TILE)*sx,ky=py+(v2.cy/TILE)*sy;
    ctx.fillStyle=v2.isKingdom?v2.color:'#ffd94a';
    ctx.beginPath();ctx.arc(kx,ky,v2.isKingdom?4:3,0,Math.PI*2);ctx.fill();
  }
  var vw=cw/zoom/TILE,vh=VIEW_H/zoom/TILE;
  ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=1;
  ctx.strokeRect(px+camX/TILE*sx,py+camY/TILE*sy,vw*sx,vh*sy);
}
function hitMinimap(x,y){
  var r=minimapRect;if(!r.w)return null;
  if(x<r.x||x>r.x+r.w||y<r.y||y>r.y+r.h)return null;
  return {x:(x-r.x-2)/(r.w-4)*WORLD_W,y:(y-r.y-2)/(r.h-4)*WORLD_H};
}

function findObjectAt(wx,wy){
  for(var i=beings.length-1;i>=0;i--){
    var u=beings[i];
    var s=u.size*(u.isBaby?0.75:1);
    var r=u.type==='beast'?s*1.7:s*1.5;
    if(Math.hypot(u.x-wx,u.y-wy)<r)return {type:'being',ref:u};
  }
  for(var iA=animals.length-1;iA>=0;iA--){
    var an=animals[iA];
    if(Math.hypot(an.x-wx,an.y-wy)<an.size*1.5)return {type:'animal',ref:an};
  }
  for(var i2=builds.length-1;i2>=0;i2--){
    var b=builds[i2],L=BUILD_LEVELS[b.type][b.level-1];
    var hw=(b.type==='warehouse'?L.w*1.1:TILE*2.2)/2;
    var hh=(b.type==='warehouse'?L.h*1.1:TILE*2)/2;
    if(Math.abs(b.x-wx)<hw&&Math.abs(b.y-wy)<hh)return {type:'build',ref:b};
  }
  for(var i3=trees.length-1;i3>=0;i3--){
    var t=trees[i3];
    if(Math.hypot(t.x-wx,t.y-wy)<t.size*1.2)return {type:'tree',ref:t};
  }
  for(var i4=rocks.length-1;i4>=0;i4--){
    var r2=rocks[i4];
    if(Math.hypot(r2.x-wx,r2.y-wy)<r2.size*0.9)return {type:'rock',ref:r2};
  }
  return null;
}

// ═══ МАГАЗИН ═══
function canAffordUpgrade(cost){
  for(var k in cost){
    if(k==='wood'){if((wood[0]+wood[1])<cost[k])return false;}
    else if((minerals[k]||0)<cost[k])return false;
  }
  return true;
}
function payUpgrade(cost){
  for(var k in cost){
    if(k==='wood'){
      var need=cost[k];
      var take0=Math.min(wood[0],need);
      wood[0]-=take0;need-=take0;
      wood[1]=Math.max(0,wood[1]-need);
    }else minerals[k]=(minerals[k]||0)-cost[k];
  }
}
function formatCost(cost){
  var p=[];
  if(cost.wood)p.push('🪵'+cost.wood);
  if(cost.stone)p.push('🪨'+cost.stone);
  if(cost.iron)p.push('🔩'+cost.iron);
  if(cost.gold)p.push('🥇'+cost.gold);
  if(cost.diamond)p.push('💎'+cost.diamond);
  return p.join(' ');
}
function applyUpgrade(id){
  var lvl=upgradeLevels[id]||0;
  if(lvl>=3)return;
  var cost=UPGRADE_COSTS[id][lvl];
  if(!canAffordUpgrade(cost))return;
  payUpgrade(cost);
  upgradeLevels[id]=lvl+1;
  if(id==='popLimit')upgrades.popLimit=[150,200,300,500][lvl+1];
  if(id==='foodCap')upgrades.foodCap=[100,200,400,800][lvl+1];
  if(id==='woodCap')upgrades.woodCap=[100,200,400,800][lvl+1];
  if(id==='stoneCap')upgrades.stoneCap=[50,150,300,600][lvl+1];
  clampStorage();
}

function getSeenVersion(){try{return localStorage.getItem(VERSION_KEY)||null;}catch(e){return null;}}
function setSeenVersion(v){try{localStorage.setItem(VERSION_KEY,v);}catch(e){}}
function versionNum(v){var p=String(v).split('.').map(function(x){return parseInt(x,10)||0;});return p[0]*10000+p[1]*100+p[2];}
var changelogVisible=false,changelogEntries=[],changelogScroll=0,changelogScrollMax=0;
var changelogDragging=false,changelogLastY=0,changelogTouchId=null,changelogMode='update';
function checkChangelog(){
  var seen=getSeenVersion();if(seen===APP_VERSION)return;
  var seenNum=seen?versionNum(seen):-1;
  changelogEntries=CHANGELOG.filter(function(e){return versionNum(e.version)>seenNum;});
  if(changelogEntries.length===0)return;
  changelogMode='update';changelogVisible=true;changelogScroll=0;changelogScrollMax=0;
}
function openHistory(){changelogEntries=CHANGELOG.slice();changelogMode='history';changelogVisible=true;changelogScroll=0;changelogScrollMax=0;}
function closeHistory(){changelogVisible=false;if(changelogMode==='update')setSeenVersion(APP_VERSION);changelogMode='update';}
function hitChangelogClose(x,y){
  if(!changelogVisible)return false;
  var btnW=Math.min(280,cw-60),btnH=54,btnX=(cw-btnW)/2,btnY=ch-68;
  return x>=btnX&&x<=btnX+btnW&&y>=btnY&&y<=btnY+btnH;
}
function wrapTextDraw(text,x,y,maxW,lineH){
  var words=text.split(' '),line='',yy=y;
  for(var i=0;i<words.length;i++){
    var test=line?line+' '+words[i]:words[i];
    if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,yy);line=words[i];yy+=lineH;}
    else line=test;
  }
  if(line)ctx.fillText(line,x,yy);
}
function renderChangelog(){
  if(!changelogVisible)return;
  var isH=changelogMode==='history';
  ctx.fillStyle='rgba(8,4,20,0.97)';ctx.fillRect(0,0,cw,ch);
  ctx.fillStyle='#ffe14a';ctx.font='bold 28px -apple-system,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(isH?'📜 ИСТОРИЯ':'📢 ЧТО НОВОГО',cw/2,42);
  ctx.font='bold 13px -apple-system,sans-serif';
  ctx.fillStyle='rgba(200,180,255,0.8)';
  ctx.fillText('Версия '+APP_VERSION,cw/2,68);
  var listTop=100,listBottom=ch-90,listH=listBottom-listTop;
  ctx.save();ctx.beginPath();ctx.rect(0,listTop,cw,listH);ctx.clip();
  var cy=listTop+16-changelogScroll,innerX=40,innerW=cw-80;
  for(var v=0;v<changelogEntries.length;v++){
    var entry=changelogEntries[v];
    ctx.textAlign='left';ctx.font='bold 18px -apple-system,sans-serif';
    ctx.fillStyle='#ffe14a';ctx.fillText('v'+entry.version,innerX,cy+16);
    cy+=30;
    if(entry.title){
      ctx.font='bold 14px -apple-system,sans-serif';
      ctx.fillStyle='#fff';ctx.fillText(entry.title,innerX,cy+6);
      cy+=24;
    }
    for(var c=0;c<entry.changes.length;c++){
      var ch2=entry.changes[c],meta=CHANGE_META[ch2.t]||CHANGE_META.imp;
      ctx.fillStyle=meta.color;ctx.fillRect(innerX,cy+2,3,30);
      ctx.font='bold 10px -apple-system,sans-serif';
      ctx.fillStyle=meta.color;
      ctx.fillText(meta.icon+' '+meta.label,innerX+12,cy+10);
      ctx.font='13px -apple-system,sans-serif';
      ctx.fillStyle='rgba(230,220,255,0.95)';
      wrapTextDraw(ch2.text,innerX+12,cy+26,innerW-16,16);
      cy+=46;
    }
    cy+=14;
  }
  changelogScrollMax=Math.max(0,cy+changelogScroll-(listBottom-16));
  ctx.restore();
  var btnW=Math.min(280,cw-60),btnH=54,btnX=(cw-btnW)/2,btnY=ch-68;
  ctx.fillStyle='#7a5cc9';
  roundRect(btnX,btnY,btnW,btnH,16);ctx.fill();
  ctx.strokeStyle='#ffe14a';ctx.lineWidth=2.5;
  roundRect(btnX,btnY,btnW,btnH,16);ctx.stroke();
  ctx.font='bold 18px -apple-system,sans-serif';
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(isH?'✕ ЗАКРЫТЬ':'▶ ПРОДОЛЖИТЬ',cw/2,btnY+btnH/2+1);
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
}
function changelogStart(t){
  if(hitChangelogClose(t.clientX,t.clientY)){closeHistory();return;}
  if(t.clientY>100&&t.clientY<ch-90){changelogDragging=true;changelogLastY=t.clientY;changelogTouchId=t.identifier;}
}
function changelogMove(t){
  if(changelogDragging&&(changelogTouchId===null||t.identifier===changelogTouchId)){
    var dy=t.clientY-changelogLastY;changelogLastY=t.clientY;
    changelogScroll=cl(changelogScroll-dy,0,changelogScrollMax);
  }
}
function changelogEnd(t){
  if(changelogTouchId===null||t.identifier===changelogTouchId){changelogDragging=false;changelogTouchId=null;}
}

function applyFullSettings(id){

    var s2=readSettings();

    writeSettings(s2);
    toast(s2.quality==='high'?'🎨 Качество: высокое':'🎨 Качество: низкое',1.5);
  }

    var s3=readSettings();
    var keys=Object.keys(RAID_DIFFICULTIES);
    var curIdx=keys.indexOf(s3.raidDifficulty||'normal');

    writeSettings(s3);
    toast('🐻 Сложность набегов: '+RAID_DIFFICULTIES[keys[nextIdx]].name,2);

var lastWallTime=0,lastBuildTime=0;
function useTool(px,py){
  var tx=Math.floor(px/TILE),ty=Math.floor(py/TILE);
  if(tx<0||tx>=COLS||ty<0||ty>=ROWS)return;
  var i=ty*COLS+tx;

  // Убрать - работает как быстрая кисть
  if(activeTool==='remove'){
    var nowR=performance.now();
    if(nowR-lastTick<50)return; // Задержка 50мс
    lastTick=nowR;
    tiles[i]=0;burnTimer[i]=0;oreMap[i]=0;mountainHP[i]=0;flowDepth[i]=0;
    beings=beings.filter(function(u){return Math.floor(u.x/TILE)!==tx||Math.floor(u.y/TILE)!==ty;});
    builds=builds.filter(function(b){return Math.floor(b.x/TILE)!==tx||Math.floor(b.y/TILE)!==ty;});
    trees=trees.filter(function(t){return Math.floor(t.x/TILE)!==tx||Math.floor(t.y/TILE)!==ty;});
    rocks=rocks.filter(function(r){return Math.floor(r.x/TILE)!==tx||Math.floor(r.y/TILE)!==ty;});
    animals=animals.filter(function(a){return Math.floor(a.x/TILE)!==tx||Math.floor(a.y/TILE)!==ty;});
    return;
  }

  if(activeTool==='wallwood'||activeTool==='wallstone'){
    var now=performance.now();
    if(now-lastWallTime<70)return;
    lastWallTime=now;
    if(!walkable(px,py))return;
    if(px<TILE||px>WORLD_W-TILE||py<TILE||py>WORLD_H-TILE)return;
    for(var iw=0;iw<builds.length;iw++){
      if(Math.floor(builds[iw].x/TILE)===tx&&Math.floor(builds[iw].y/TILE)===ty)return;
    }
    placeBuild(px,py,activeTool,0,playerKingdomId||undefined);return;
  }
  if(activeTool==='war'||activeTool==='ally'){
    var v=null;
    for(var bi=builds.length-1;bi>=0;bi--){
      var b=builds[bi],L=BUILD_LEVELS[b.type]&&BUILD_LEVELS[b.type][b.level-1];
      if(!L)continue;
      var hw=(b.type==='warehouse'?L.w*1.1:TILE*2.2)/2;
      var hh=(b.type==='warehouse'?L.h*1.1:TILE*2)/2;
      if(Math.abs(b.x-px)<hw+8&&Math.abs(b.y-py)<hh+8){if(villages[b.villageId])v=villages[b.villageId];break;}
    }
    if(!v){
      var bd=Infinity;
      for(var k in villages){var vv=villages[k];var dd=Math.hypot((vv.cx||0)-px,(vv.cy||0)-py);if(dd<bd){bd=dd;v=vv;}}
    }
    if(!v){toast('Нажми на территорию города',1.6);return;}
    if(!warSelected){warSelected=v.id;toast('Выбрано: '+v.name+' — нажми на второй город',2.2);}
    else if(warSelected===v.id){warSelected=null;toast('Отменено',1.2);}
    else{
      var v1=villages[warSelected];
      if(activeTool==='war')declareWar(v1,v);
      else if(!makeAlliance(v1,v))toast('Нельзя: идёт война',1.8);
      warSelected=null;
    }
    return;
  }
  
  // Кузница, Таверна, Башня
  if(activeTool==='forge'||activeTool==='tavern'||activeTool==='tower'){
    var nowB=performance.now();
    if(nowB-lastBuildTime<200)return; // Защита от спама
    lastBuildTime=nowB;
    if(canBuild(px,py,0)){
      placeBuild(px,py,activeTool,0,playerKingdomId||undefined);
      for(var hb=0;hb<4;hb++)hearts.push({x:px+rnd(-10,10),y:py-5,vx:rnd(-20,20),vy:rnd(-40,-20),life:1,maxLife:1,size:7,color:'#ffe14a'});
    } else {
      toast('Здесь нельзя строить (близко к другому дому)',1.5);
    }
    return;
  }

  var now2=performance.now();
  var terrain=activeTool==='grass'||activeTool==='forestfloor'||activeTool==='snow'||activeTool==='water'||activeTool==='rock'||activeTool==='sand';
  var isTree=['oak','pine','birch','palm','dead'].indexOf(activeTool)>=0;
  var isAnimal=['rabbit','deer','boar','fox','wolf','sheep','goat','chicken'].indexOf(activeTool)>=0;
  var delay=(isTree||activeTool==='boulder'||isAnimal||activeTool==='house2')?180:130;
  if(!terrain&&now2-lastTick<delay)return;
  lastTick=now2;
  
  if(activeTool==='grass'){tiles[i]=0;burnTimer[i]=0;oreMap[i]=0;mountainHP[i]=0;flowDepth[i]=0;}
  else if(activeTool==='forestfloor'){tiles[i]=8;burnTimer[i]=0;oreMap[i]=0;mountainHP[i]=0;flowDepth[i]=0;}
  else if(activeTool==='snow'){tiles[i]=9;burnTimer[i]=0;oreMap[i]=0;mountainHP[i]=0;flowDepth[i]=0;}
  else if(activeTool==='water'){tiles[i]=1;burnTimer[i]=0;oreMap[i]=0;mountainHP[i]=0;flowDepth[i]=MAX_FLOW;}
  else if(activeTool==='rock'){tiles[i]=2;burnTimer[i]=0;flowDepth[i]=0;mountainHP[i]=MOUNTAIN_HP;
    var roll=Math.random();oreMap[i]=roll<0.55?1:roll<0.8?2:roll<0.93?3:roll<0.98?4:5;}
  else if(activeTool==='sand'){tiles[i]=3;burnTimer[i]=0;oreMap[i]=0;mountainHP[i]=0;flowDepth[i]=0;}
  else if(activeTool==='flame'){
    if(tiles[i]===0||tiles[i]===3||tiles[i]===8||tiles[i]===9){burnTimer[i]=2.5+Math.random()*1.5;burnGen[i]=0;}
    else if(tiles[i]===4)burnTimer[i]=2;
  }
  else if(activeTool==='oak'||activeTool==='pine'||activeTool==='birch'||activeTool==='palm'||activeTool==='dead')placeTree(px,py,activeTool);
  else if(activeTool==='boulder')placeRock(px,py);
  else if(activeTool==='house2'){
    if(walkable(px,py)&&px>TILE&&px<WORLD_W-TILE&&py>TILE&&py<WORLD_H-TILE){
      var okH=true;
      for(var hi2=0;hi2<builds.length;hi2++)if(Math.hypot(builds[hi2].x-px,builds[hi2].y-py)<TILE*2.2){okH=false;break;}
      if(okH){var nb=placeBuild(px,py,'cottage',0,playerKingdomId||undefined);
        nb.level=2;nb.maxHp=BUILD_LEVELS.cottage[1].hp;nb.hp=nb.maxHp;nb.upgradeProg=0;}
    }
  }
  else if(activeTool==='rabbit')makeAnimal(px,py,'rabbit');
  else if(activeTool==='deer')makeAnimal(px,py,'deer');
  else if(activeTool==='boar')makeAnimal(px,py,'boar');
  else if(activeTool==='fox')makeAnimal(px,py,'fox');
  else if(activeTool==='wolf')makeAnimal(px,py,'wolf');
  else if(activeTool==='sheep')makeAnimal(px,py,'sheep');
  else if(activeTool==='goat')makeAnimal(px,py,'goat');
  else if(activeTool==='chicken')makeAnimal(px,py,'chicken');
  else if(activeTool==='human')makeBeing(px,py,'human',false,null,playerKingdomId||undefined);
  else if(activeTool==='warrior')makeBeing(px,py,'warrior',false,null,playerKingdomId||undefined);
  else if(activeTool==='troll')makeBeing(px,py,'troll',false,null,playerKingdomId||undefined);
  else if(activeTool==='beast')makeBeing(px,py,'beast',false,null);
  else if(activeTool==='traitor')makeBeing(px,py,'traitor',false,null);
  else if(activeTool==='shadow')makeBeing(px,py,'shadow',false,null);
  else if(activeTool==='bolt')strikeBolt(px,py,'normal');
  else if(activeTool==='divine')strikeBolt(px,py,'divine');
}

var touches=new Map(),pinchDist=0,pinchZoom=1;

function handleSpecialClick(x,y){
  if(gameOver){if(hitGameOverBtn(x,y)){saveWorld();appState='settings';gameOver=false;}return true;}
  if(showMusicPicker){var mp=hitMusicPicker(x,y);if(mp)applyMusicPicker(mp);return true;}
  if(showFullSettings){var h=hitFullSettings(x,y);if(h)applyFullSettings(h);return true;}
  if(showPauseMenu){
    var pm=hitPauseMenu(x,y);
    if(pm){
      if(pm==='resume'){showPauseMenu=false;paused=false;}
      else if(pm==='save'){saveWorld();toast('💾 Сохранено',1.5);}
      else if(pm==='music'){showPauseMenu=false;showMusicPicker=true;}
      else if(pm==='settings'){showFullSettings=true;}
      else if(pm==='menu'){saveWorld();appState='settings';showPauseMenu=false;paused=false;}
      return true;
    }
    return true;
  }
  if(hitPauseBtn(x,y)){paused=!paused;if(paused)showPauseMenu=true;return true;}
  if(hitSpeedButton(x,y)){speedMult=speedMult>=3?1:speedMult+1;toast('⏩ Скорость: '+speedMult+'×',1.2);return true;}
  var ord=hitOrderButton(x,y);
  if(ord){
    if(inspected&&inspected.ref&&inspected.ref.villageId&&villages[inspected.ref.villageId]){
      villages[inspected.ref.villageId].order=ord;
      toast('👑 '+villages[inspected.ref.villageId].name+': '+ORDER_LABELS[ord],2.2);
      saveWorld();
    }
    return true;
  }
  if(showShop){
    if(hitShopClose(x,y)){showShop=false;return true;}
    var buyId=hitShopBuy(x,y);
    if(buyId){applyUpgrade(buyId);return true;}
    return true;
  }
  if(appState==='settings'){
    var mi=hitMenuIcon(x,y);
    if(mi){
      if(mi==='music'){showMusicPicker=true;return true;}
      if(mi==='settings'){showFullSettings=true;return true;}
      if(mi==='history'){openHistory();return true;}
      if(mi==='delete'){deleteSave();return true;}
    }
    return false;
  }
  if(appState!=='playing')return false;
  if(y<60){
    var tb=hitTopButton(x,y);
    if(tb==='shop'){showShop=true;return true;}
  }
  var mm=hitMinimap(x,y);
  if(mm){camX=cl(mm.x-cw/zoom/2,0,Math.max(0,WORLD_W-cw/zoom));camY=cl(mm.y-VIEW_H/zoom/2,0,Math.max(0,WORLD_H-VIEW_H/zoom));boundCamera();return true;}
  return false;
}
