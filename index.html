    function formatToday() {
      var d = new Date();
      return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() +
        1).padStart(2, '0') + '.' + d.getFullYear()
    }

    function getEntryDate(e) {
      if (e.date) return e.date;
      var d = loadDates();
      return d[e.version] || ''

    function markVersionDateSeen(v) {
      var d = loadDates();
      if (!d[v]) {
        d[v] = formatToday();
        saveDates(d)

      var s = loadSeenHistory();
      if (!s[v]) {
        s[v] = Date.now();
        saveSeenHistory(s)
      }

    function createVillage(clan, x, y, name) {
      var id = nextVillageId++;
      var v = {
        id: id,
        name: name || ('Город №' + id),
        clan: clan,
        color: KINGDOM_COLORS[(id - 1) % KINGDOM_COLORS.length],
        allies: [],
        wars: [],
        cx: x || 0,
        cy: y || 0,
        isKingdom: false
      };
      villages[id] = v;
      return v;
    }

    function createKingdoms() {
      villages = {};
      nextVillageId = 1;
      ownerMap = null;
      playerKingdomId = 0;
      var isEmpire = (selectedSize === 'empire');
      var names = KINGDOM_NAMES.slice();
      var cx = WORLD_W / 2,
        cy = WORLD_H / 2;
      var r = Math.min(WORLD_W, WORLD_H) * 0.30;
      var count = isEmpire ? KINGDOM_COUNT : 1;
      var pos;
      if (isEmpire) pos = [{
        x: cx - r,
        y: cy - r
      }, {
        x: cx + r,
        y: cy - r
      }, {
        x: cx - r,
        y: cy + r
      }, {
        x: cx + r,
        y: cy + r
      }];
      else pos = [{
        x: cx,
        y: cy
      }];
      for (var i = 0; i < count; i++) {
        var ni = Math.floor(Math.random() * names.length);
        var nm = names.splice(ni, 1)[0];
        var v = createVillage(0, pos[i].x, pos[i].y, nm);
        v.isKingdom = isEmpire;
        if (isEmpire) v.color = KINGDOM_COLORS[i];
        var startHouses = isEmpire ? 3 : 5;
        for (var b = 0; b < startHouses; b++) {
          var ang = Math.random() * Math.PI * 2;
          var dist = TILE * (3 + Math.random() * 3);
          var bx = cl(pos[i].x + Math.cos(ang) * dist, TILE * 2, WORLD_W -
            TILE * 2);
          var by = cl(pos[i].y + Math.sin(ang) * dist, TILE * 2, WORLD_H -
            TILE * 2);
          if (!walkable(bx, by)) continue;
          var nb = placeBuild(bx, by, 'cottage', 0, v.id);
          nb.villageId = v.id;
          for (var p = 0; p < 3; p++) {
            var px = bx + rnd(-20, 20),
              py = by + rnd(-20, 20);
            if (walkable(px, py)) makeBeing(px, py, 'human', false, null, v.id);
          }
          var wx2 = bx + rnd(-15, 15),
            wy2 = by + rnd(-15, 15);
          if (walkable(wx2, wy2)) makeBeing(wx2, wy2, 'warrior', false, null, v
            .id);
        }
      }
      if (!isEmpire) playerKingdomId = 1;
      buildOwnerMap();
    }

    function buildOwnerMap() {
      var klist = [];
      for (var k in villages) {
        var v = villages[k];
        if (v.isKingdom) klist.push(v)
      }
      if (!klist.length) {
        ownerMap = null;
        return
      }
      if (!ownerMap || ownerMap.length !== COLS * ROWS) ownerMap =
        new Uint8Array(COLS * ROWS);
      var step = Math.max(1, Math.floor(Math.sqrt(COLS * ROWS / 40000)));
      for (var ty = 0; ty < ROWS; ty += step)
        for (var tx = 0; tx < COLS; tx += step) {
          var wx = tx * TILE + TILE / 2,
            wy = ty * TILE + TILE / 2;
          var best = 0,
            bd = Infinity;
          for (var i = 0; i < klist.length; i++) {
            var kk = klist[i];
            var d = (kk.cx - wx) * (kk.cx - wx) + (kk.cy - wy) * (kk.cy - wy);
            if (d < bd) {
              bd = d;
              best = i
            }
          }
          for (var dy2 = 0; dy2 < step && ty + dy2 < ROWS; dy2++)
            for (var dx2 = 0; dx2 < step && tx + dx2 < COLS; dx2++) ownerMap[(
              ty + dy2) * COLS + tx + dx2] = best;
        }
    }

    function getKingdomList() {
      var o = [];
      for (var k in villages) {
        var v = villages[k];
        if (v.isKingdom) o.push(v)
      }
      o.sort(function(a, b) {
        return a.id - b.id
      });
      return o
    }

    function getVillageCenter(vid) {
      var v = villages[vid];
      if (v && v.cx) return {
        x: v.cx,
        y: v.cy
      };
      var bs = getVillageBuilds(vid);
      if (!bs.length) return null;
      var cx = 0,
        cy = 0;
      for (var i = 0; i < bs.length; i++) {
        cx += bs[i].x;
        cy += bs[i].y
      }
      return {
        x: cx / bs.length,
        y: cy / bs.length
      };
    }

    function getVillageBuilds(vid) {
      var o = [];
      for (var i = 0; i < builds.length; i++)
        if (builds[i].villageId === vid) o.push(builds[i]);
      return o
    }

    function getVillageMembers(vid) {
      var o = [];
      for (var i = 0; i < beings.length; i++)
        if (beings[i].villageId === vid) o.push(beings[i]);
      return o
    }

    function nearestVillage(clan, x, y, maxD) {
      maxD = maxD || (TILE * 15);
      var best = null,
        bd = maxD;
      for (var k in villages) {
        var v = villages[k];
        if (v.clan !== clan) continue;
        var d = Math.hypot((v.cx || 0) - x, (v.cy || 0) - y);
        if (d < bd) {
          bd = d;
          best = v
        }
      }
      return best;
    }

    function assignVillage(obj, clan, x, y) {
      var v = nearestVillage(clan, x, y);
      if (!v) v = createVillage(clan, x, y);
      obj.villageId = v.id;
      return v
    }

    function areAtWar(v1, v2) {
      if (!v1 || !v2 || v1.id === v2.id) return false;
      if (v1.allies.indexOf(v2.id) >= 0) return false;
      if (v1.wars.indexOf(v2.id) >= 0) return true;
      if (v2.wars.indexOf(v1.id) >= 0) return true;
      for (var i = 0; i < v1.allies.length; i++) {
        var av = villages[v1.allies[i]];
        if (av && (av.wars.indexOf(v2.id) >= 0)) return true
      }
      for (var j = 0; j < v2.allies.length; j++) {
        var av2 = villages[v2.allies[j]];
        if (av2 && (av2.wars.indexOf(v1.id) >= 0)) return true
      }
      return false;
    }

    function declareWar(v1, v2) {
      if (!v1 || !v2 || v1.id === v2.id) return false;
      if (v1.wars.indexOf(v2.id) < 0) v1.wars.push(v2.id);
      if (v2.wars.indexOf(v1.id) < 0) v2.wars.push(v1.id);
      var ai = v1.allies.indexOf(v2.id);
      if (ai >= 0) v1.allies.splice(ai, 1);
      var ai2 = v2.allies.indexOf(v1.id);
      if (ai2 >= 0) v2.allies.splice(ai2, 1);
      toast('⚔️ ' + v1.name + ' начал войну с ' + v2.name, 2.8);
      for (var i = 0; i < beings.length; i++) {
        var u = beings[i];
        if (u.villageId === v1.id || u.villageId === v2.id) {
          u.atkCd = 0;
          u.currentAction = 'idle'
        }
      }
      saveWorld();
      return true;
    }

    function makeAlliance(v1, v2) {
      if (!v1 || !v2 || v1.id === v2.id) return false;
      if (v1.wars.indexOf(v2.id) >= 0 || v2.wars.indexOf(v1.id) >= 0)
        return false;
      if (v1.allies.indexOf(v2.id) < 0) v1.allies.push(v2.id);
      if (v2.allies.indexOf(v1.id) < 0) v2.allies.push(v1.id);
      toast('🤝 ' + v1.name + ' + ' + v2.name + ' — союз!', 2.8);
      return true;
    }

    function drawKingdomBorders() {
      if (!ownerMap) return;
      var klist = [];
      for (var k in villages) {
        var v = villages[k];
        if (v.isKingdom) klist.push(v)
      }
      if (klist.length < 2) return;
      var vw = cw / zoom,
        vh = VIEW_H / zoom;
      var x0 = Math.max(1, Math.floor(camX / TILE) - 1);
      var x1 = Math.min(COLS - 1, Math.ceil((camX + vw) / TILE) + 1);
      var y0 = Math.max(1, Math.floor(camY / TILE) - 1);
      var y1 = Math.min(ROWS - 1, Math.ceil((camY + vh) / TILE) + 1);
      var lw = Math.max(2, 3 / zoom);
      ctx.save();
      ctx.lineWidth = lw;
      ctx.lineCap = 'round';
      for (var y = y0; y < y1; y++)
        for (var x = x0; x < x1; x++) {
          var o = ownerMap[y * COLS + x],
            oR = ownerMap[y * COLS + (x + 1)],
            oD = ownerMap[(y + 1) * COLS + x];
          if (o !== oR) {
            var k1 = klist[o] || klist[oR];
            if (k1) {
              ctx.strokeStyle = k1.color;
              ctx.globalAlpha = 0.75;
              ctx.beginPath();
              ctx.moveTo((x + 1) * TILE, y * TILE);
              ctx.lineTo((x + 1) * TILE, (y + 1) * TILE);
              ctx.stroke()
            }
          }
          if (o !== oD) {
            var k2 = klist[o] || klist[oD];
            if (k2) {
              ctx.strokeStyle = k2.color;
              ctx.globalAlpha = 0.75;
              ctx.beginPath();
              ctx.moveTo(x * TILE, (y + 1) * TILE);
              ctx.lineTo((x + 1) * TILE, (y + 1) * TILE);
              ctx.stroke()
            }
          }
        }
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function cl(v, a, b) {
      return v < a ? a : v > b ? b : v
    }

    function rnd(a, b) {
      return a + Math.random() * (b - a)
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath()
    }

    function toWorld(sx, sy) {
      return {
        x: camX + sx / zoom,
        y: camY + sy / zoom
      }
    }

    function boundCamera() {
      var vw = cw / zoom,
        vh = VIEW_H / zoom;
      camX = cl(camX, 0, Math.max(0, WORLD_W - vw));
      camY = cl(camY, 0, Math.max(0, WORLD_H - vh))
    }

    function recalcView() {
      UIH = Math.max(180, Math.min(220, ch * 0.28));
      VIEW_H = hideBar ? ch : ch - UIH;
      boundCamera()
    }

    function randInt(min, max) {
      return Math.floor(rnd(min, max + 1))
    }

    function pick(a) {
      return a[Math.floor(Math.random() * a.length)]
    }

    function sRand(seed, i) {
      var x = Math.sin(seed * 12.9898 + i * 78.233) * 43758.5453;
      return x - Math.floor(x)
    }

    function shadeHex(hex, f) {
      var n = parseInt(hex.slice(1), 16);
      var r = (n >> 16) & 0xff,
        g = (n >> 8) & 0xff,
        b = n & 0xff;
      r = Math.min(255, Math.max(0, Math.round(r * f)));
      g = Math.min(255, Math.max(0, Math.round(g * f)));
      b = Math.min(255, Math.max(0, Math.round(b * f)));
      return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1)
    }

    function getDarkness() {
      return (Math.cos(cyclePhase * Math.PI * 2) + 1) / 2
    }

    var TILE_SS = 4,
      WATER_FRAMES = 12,
      LAVA_FRAMES = 12,
      tileCache = {};

    function makeTileCanvas(size, fn) {
      var c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      fn(c.getContext('2d'), size);
      return c
    }

    function drawGrassTexture(c, s, seed) {
      var g = c.createLinearGradient(0, 0, 0, s);
      g.addColorStop(0, '#5fc054');
      g.addColorStop(0.5, '#52b048');
      g.addColorStop(1, '#469438');
      c.fillStyle = g;
      c.fillRect(0, 0, s, s);
      var blades = 55 + Math.floor(sRand(seed, 1) * 35);
      var greens = ['#7ade68', '#6cce58', '#5abe48', '#4aae38', '#8ae878',
        '#3a9e2e'
      ];
      c.lineCap = 'round';
      for (var j = 0; j < blades; j++) {
        var x2 = sRand(seed, j * 13 + 2) * s,
          y2 = sRand(seed, j * 13 + 3) * s,
          h = s * (0.05 + sRand(seed, j * 13 + 4) * 0.10),
          lean = (sRand(seed, j * 13 + 5) - 0.5) * s * 0.06;
        c.strokeStyle = greens[j % greens.length];
        c.lineWidth = s * 0.014;
        c.beginPath();
        c.moveTo(x2, y2 + h);
        c.quadraticCurveTo(x2 + lean * 0.4, y2 + h * 0.5, x2 + lean, y2);
        c.stroke();
      }
    }

    function drawForestFloorTexture(c, s, seed) {
      var g = c.createLinearGradient(0, 0, s, s);
      g.addColorStop(0, '#3e5a2e');
      g.addColorStop(0.5, '#2e4a20');
      g.addColorStop(1, '#223818');
      c.fillStyle = g;
      c.fillRect(0, 0, s, s);
      var lc = ['#8a5a2a', '#a8732a', '#6a4a20', '#b8862a', '#5a3a18',
        '#c8983a'
      ];
      for (var i = 0; i < 28; i++) {
        var x = sRand(seed, i * 5 + 11) * s,
          y = sRand(seed, i * 5 + 12) * s,
          w = s * (0.08 + sRand(seed, i * 5 + 13) * 0.14),
          h = s * (0.02 + sRand(seed, i * 5 + 14) * 0.03),
          a = sRand(seed, i * 5 + 15) * Math.PI;
        c.save();
        c.translate(x, y);
        c.rotate(a);
        c.fillStyle = lc[i % 6];
        c.globalAlpha = 0.55 + sRand(seed, i * 5 + 16) * 0.35;
        c.beginPath();
        c.ellipse(0, 0, w, h, 0, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
      c.globalAlpha = 1;
    }

    function drawSnowTexture(c, s, seed) {
      var g = c.createRadialGradient(s * 0.4, s * 0.35, s * 0.1, s * 0.5, s *
        0.5, s * 0.9);
      g.addColorStop(0, '#f8fcff');
      g.addColorStop(0.5, '#e0ecf5');
      g.addColorStop(1, '#bdd0e0');
      c.fillStyle = g;
      c.fillRect(0, 0, s, s);
      for (var i = 0; i < 35; i++) {
        var x = sRand(seed, i * 3 + 5) * s,
          y = sRand(seed, i * 3 + 6) * s,
          r = s * (0.02 + sRand(seed, i * 3 + 7) * 0.05);
        c.fillStyle = 'rgba(255,255,255,0.6)';
        c.beginPath();
        c.arc(x, y, r, 0, Math.PI * 2);
        c.fill()
      }
    }

    function drawSandTexture(c, s, seed) {
      var g = c.createLinearGradient(0, 0, s, s);
      g.addColorStop(0, '#e0c486');
      g.addColorStop(0.4, '#d4b678');
      g.addColorStop(0.7, '#c4a868');
      g.addColorStop(1, '#b49860');
      c.fillStyle = g;
      c.fillRect(0, 0, s, s);
      for (var i = 0; i < 150; i++) {
        var x = sRand(seed, i * 3 + 10) * s,
          y = sRand(seed, i * 3 + 11) * s,
          shade = sRand(seed, i * 3 + 12),
          sz = s * (0.008 + sRand(seed, i * 3 + 13) * 0.008);
        if (shade > 0.65) c.fillStyle = 'rgba(255,245,215,0.7)';
        else if (shade > 0.35) c.fillStyle = 'rgba(200,170,110,0.5)';
        else c.fillStyle = 'rgba(140,110,65,0.45)';
        c.fillRect(x, y, sz, sz)
      }
    }

    function drawWaterTexture(c, s, frame) {
      var t = frame / WATER_FRAMES * Math.PI * 2;
      var g = c.createLinearGradient(0, 0, s, s);
      g.addColorStop(0, '#2864a8');
      g.addColorStop(0.4, '#2260a4');
      g.addColorStop(0.7, '#1c5290');
      g.addColorStop(1, '#164278');
      c.fillStyle = g;
      c.fillRect(0, 0, s, s);
      var waves = [{
        f: 1,
        a: 0.055,
        al: 0.42,
        tk: 0.022,
        p: 0
      }, {
        f: 2,
        a: 0.045,
        al: 0.32,
        tk: 0.018,
        p: 1.2
      }];
      c.lineCap = 'round';
      for (var wi = 0; wi < waves.length; wi++) {
        var w = waves[wi];
        c.strokeStyle = 'rgba(215,235,255,' + w.al + ')';
        c.lineWidth = s * w.tk;
        c.beginPath();
        for (var px = 0; px <= s; px += 2) {
          var nx = px / s,
            y = s * 0.5 + Math.sin(2 * Math.PI * w.f * nx + t * 1.5 + w.p) * s *
            w.a;
          if (px === 0) c.moveTo(px, y);
          else c.lineTo(px, y)
        }
        c.stroke()
      }
    }

    function drawLavaTexture(c, s, frame) {
      var t = frame / LAVA_FRAMES * Math.PI * 2;
      var g = c.createRadialGradient(s * 0.5, s * 0.5, 0, s * 0.5, s * 0.5, s *
        0.8);
      g.addColorStop(0, '#2a0808');
      g.addColorStop(0.6, '#1a0505');
      g.addColorStop(1, '#0e0202');
      c.fillStyle = g;
      c.fillRect(0, 0, s, s);
      for (var i = 0; i < 4; i++) {
        var seed = i * 2.1,
          yBase = ((i * 0.27 + 0.15) % 1) * s,
          segs = 20;
        c.lineCap = 'round';
        for (var k = 0; k < segs; k++) {
          var p1x = (k / segs) * s,
            p1y = yBase + Math.sin(2 * Math.PI * ((k / segs) * 1.5 + t * 0.5 +
              seed)) * s * 0.18,
            p2x = ((k + 1) / segs) * s,
            p2y = yBase + Math.sin(2 * Math.PI * (((k + 1) / segs) * 1.5 + t *
              0.5 + seed)) * s * 0.18,
            pulse = 0.7 + Math.sin(t * 2 + i * 1.3 + k * 0.3) * 0.3;
          c.strokeStyle = 'rgba(255,80,10,' + (0.35 * pulse) + ')';
          c.lineWidth = s * 0.06;
          c.beginPath();
          c.moveTo(p1x, p1y);
          c.lineTo(p2x, p2y);
          c.stroke();
          c.strokeStyle = 'rgba(255,240,150,' + (0.95 * pulse) + ')';
          c.lineWidth = s * 0.012;
          c.beginPath();
          c.moveTo(p1x, p1y);
          c.lineTo(p2x, p2y);
          c.stroke()
        }
      }
    }

    function drawBurntTexture(c, s, seed) {
      var g = c.createLinearGradient(0, 0, 0, s);
      g.addColorStop(0, '#3a2a24');
      g.addColorStop(0.5, '#2a1e18');
      g.addColorStop(1, '#1a120e');
      c.fillStyle = g;
      c.fillRect(0, 0, s, s);
      for (var i = 0; i < 40; i++) {
        var x = sRand(seed, i * 3) * s,
          y = sRand(seed, i * 3 + 1) * s,
          r = s * (0.015 + sRand(seed, i * 3 + 2) * 0.03);
        c.fillStyle = 'rgba(60,45,38,0.6)';
        c.beginPath();
        c.arc(x, y, r, 0, Math.PI * 2);
        c.fill()
      }
    }

    function prerenderTiles() {
      var S = TILE * TILE_SS,
        V = 6;
      tileCache.grass = [];
      for (var v = 0; v < V; v++) tileCache.grass.push(makeTileCanvas(S,
        function(c, s) {
          drawGrassTexture(c, s, v * 13 + 1)
        }));
      tileCache.forestfloor = [];
      for (var v2 = 0; v2 < V; v2++) tileCache.forestfloor.push(makeTileCanvas(
        S,
        function(c, s) {
          drawForestFloorTexture(c, s, v2 * 13 + 7)
        }));
      tileCache.snow = [];
      for (var v3 = 0; v3 < V; v3++) tileCache.snow.push(makeTileCanvas(S,
        function(c, s) {
          drawSnowTexture(c, s, v3 * 17 + 5)
        }));
      tileCache.sand = [];
      for (var v4 = 0; v4 < V; v4++) tileCache.sand.push(makeTileCanvas(S,
        function(c, s) {
          drawSandTexture(c, s, v4 * 17 + 3)
        }));
      tileCache.burnt = [];
      for (var v5 = 0; v5 < 4; v5++) tileCache.burnt.push(makeTileCanvas(S,
        function(c, s) {
          drawBurntTexture(c, s, v5 * 23 + 7)
        }));
      tileCache.water = [];
      for (var f = 0; f < WATER_FRAMES; f++) tileCache.water.push(
        makeTileCanvas(S, function(c, s) {
          drawWaterTexture(c, s, f)
        }));
      tileCache.lava = [];
      for (var f2 = 0; f2 < LAVA_FRAMES; f2++) tileCache.lava.push(
        makeTileCanvas(S, function(c, s) {
          drawLavaTexture(c, s, f2)
        }));
    }

    function getStorageCapacity(clan) {
      var cap = Object.assign({}, BASE_STORAGE);
      for (var i = 0; i < builds.length; i++) {
        var b = builds[i];
        if (b.clan !== clan || b.type !== 'warehouse') continue;
        var wC = WAREHOUSE_CAPACITY[b.level - 1];
        for (var k in wC) cap[k] = (cap[k] || 0) + wC[k]
      }
      cap.wood = Math.max(cap.wood, upgrades.woodCap);
      cap.stone = Math.max(cap.stone, upgrades.stoneCap);
      return cap;
    }

    function canAfford(clan, cost) {
      if (cost.wood && (wood[clan] || 0) < cost.wood) return false;
      if (cost.stone && minerals.stone < cost.stone) return false;
      if (cost.iron && minerals.iron < cost.iron) return false;
      if (cost.gold && minerals.gold < cost.gold) return false;
      return true;
    }

    function payCost(clan, cost) {
      if (cost.wood) wood[clan] = (wood[clan] || 0) - cost.wood;
      if (cost.stone) minerals.stone -= cost.stone;
      if (cost.iron) minerals.iron -= cost.iron;
      if (cost.gold) minerals.gold -= cost.gold;
    }

    function clampStorage() {
      var c0 = getStorageCapacity(0),
        c1 = getStorageCapacity(1);
      var cap = {
        wood: Math.max(c0.wood, c1.wood),
        stone: Math.max(c0.stone, c1.stone),
        iron: Math.max(c0.iron, c1.iron),
        gold: Math.max(c0.gold, c1.gold),
        diamond: Math.max(c0.diamond, c1.diamond),
        emerald: Math.max(c0.emerald, c1.emerald)
      };
      for (var c in wood) wood[c] = Math.min(wood[c], cap.wood);
      var keys = ['stone', 'iron', 'gold', 'diamond', 'emerald'];
      for (var i = 0; i < keys.length; i++) minerals[keys[i]] = Math.min(
        minerals[keys[i]], cap[keys[i]] || 0);
    }

        if (d.version < 1 || d.version > 40) return false;
        applyLoadedData(d);

      }

    function renderKingdomPick() {

    function hitKingdomPick(x, y) {

    function generateWorld() {
      tiles.fill(0);
      oreMap.fill(0);
      mountainHP.fill(0);
      burnTimer.fill(0);
      flowDepth.fill(0);
      biomeMap.fill(0);
      trees = [];
      rocks = [];
      var biomeCount = (selectedSize === 'empire') ? (3 + (Math.random() < 0.5 ?
        0 : 1)) : 2;
      var shuffled = BIOMES.slice();
      for (var si = 0; si < shuffled.length; si++) {
        var sj = si + Math.floor(Math.random() * (shuffled.length - si));
        var tmpB = shuffled[si];
        shuffled[si] = shuffled[sj];
        shuffled[sj] = tmpB
      }
      var biomeList = shuffled.slice(0, biomeCount);
      currentBiome = biomeList.map(function(b) {
        return b.name
      }).join(' · ');
      if (biomeCount === 2) {
        var b1 = biomeList[0],
          b2 = biomeList[1];
        var splitType = Math.random() < 0.5 ? 'x' : 'y';
        var waveA = Math.random() * 6.28,
          waveB = Math.random() * 6.28;
        var bias = 0.35 + Math.random() * 0.30;
        for (var y = 0; y < ROWS; y++)
          for (var x = 0; x < COLS; x++) {
            var t = splitType === 'x' ? x / COLS : y / ROWS;
            var wave = Math.sin(x * 0.18 + waveA) * 0.09 + Math.cos(y * 0.14 +
              waveB) * 0.09 + Math.sin((x + y) * 0.08 + waveA + waveB) * 0.05;
            biomeMap[y * COLS + x] = (t + wave) < bias ? 0 : 1;
          }
        for (var i = 0; i < tiles.length; i++) {
          var bid = biomeMap[i] === 0 ? b1.id : b2.id;
          tiles[i] = BASE_TILE[bid] !== undefined ? BASE_TILE[bid] : 0
        }
      } else {
        var seeds = [];
        for (var kk = 0; kk < biomeCount; kk++) seeds.push({
          x: Math.random() * COLS,
          y: Math.random() * ROWS
        });
        for (var y2 = 0; y2 < ROWS; y2++)
          for (var x2 = 0; x2 < COLS; x2++) {
            var best = 0,
              bd = Infinity;
            for (var s = 0; s < seeds.length; s++) {
              var ddx = x2 - seeds[s].x,
                ddy = y2 - seeds[s].y;
              var dd = ddx * ddx + ddy * ddy;
              if (dd < bd) {
                bd = dd;
                best = s
              }
            }
            biomeMap[y2 * COLS + x2] = best;
          }
        for (var i2 = 0; i2 < tiles.length; i2++) {
          var bid2 = biomeList[biomeMap[i2]].id;
          tiles[i2] = BASE_TILE[bid2] !== undefined ? BASE_TILE[bid2] : 0
        }
      }
      var scale = (COLS * ROWS) / (64 * 46);
      for (var bi = 0; bi < biomeList.length; bi++) {
        var bb = biomeList[bi];
        if (bb.id === 'mountain') {
          var blobCount = Math.floor(randInt(8, 14) * Math.min(3, Math.sqrt(
            scale)));
          for (var mi = 0; mi < blobCount; mi++) {
            var mx = rnd(2, COLS - 2),
              my = rnd(2, ROWS - 2),
              angle = rnd(0, Math.PI * 2);
            for (var k = 0; k < randInt(12, 26); k++) {
              drawBlobRegion(mx, my, randInt(1, 2), 2, 0.78, bi, biomeMap);
              angle += rnd(-0.4, 0.4);
              mx += Math.cos(angle) * 2;
              my += Math.sin(angle) * 2;
              if (mx < 2 || mx > COLS - 2 || my < 2 || my > ROWS - 2) break;
            }
          }
        }
      }
      var lakeCount = Math.floor(randInt(3, 6) * Math.min(3, Math.sqrt(scale)));
      for (var li = 0; li < lakeCount; li++) carveLake(rnd(COLS * 0.15, COLS *
        0.85), rnd(ROWS * 0.15, ROWS * 0.85), rnd(2, 3.5));
      for (var bi2 = 0; bi2 < biomeList.length; bi2++) {
        var bb2 = biomeList[bi2];
        var n = Math.min(400, Math.floor((bb2.id === 'forestfloor' ? 110 : bb2
            .id === 'mountain' ? 70 : bb2.id === 'sandy' ? 40 : 55) *
          scale / 2));
        for (var ti = 0; ti < n; ti++) {
          var tx = randInt(2, COLS - 3),
            ty = randInt(2, ROWS - 3);
          if (biomeMap[ty * COLS + tx] !== bi2) continue;
          var t2 = tiles[ty * COLS + tx];
          var allowed = (bb2.id === 'sandy') ? t2 === 3 : (t2 === 0 || t2 ===
            3 || t2 === 8 || t2 === 9);
          if (!allowed) continue;
          var close = false;
          for (var tj = 0; tj < trees.length; tj++) {
            var o = trees[tj];
            if (Math.abs(o.x - (tx * TILE + TILE / 2)) < TILE * 0.8 && Math.abs(
                o.y - (ty * TILE + TILE / 2)) < TILE * 0.8) {
              close = true;
              break
            }
          }
          if (close) continue;
          var kinds;
          if (bb2.id === 'mountain') kinds = ['pine', 'pine', 'pine', 'dead',
            'birch'
          ];
          else if (bb2.id === 'sandy') kinds = ['palm', 'palm', 'palm', 'palm',
            'dead', 'oak'
          ];
          else if (bb2.id === 'forestfloor') kinds = ['oak', 'oak', 'oak',
            'oak', 'pine', 'birch'
          ];
          else kinds = ['birch', 'birch', 'birch', 'birch', 'oak'];
          addTreeAt(tx, ty, pick(kinds));
        }
      }
      for (var ri = 0; ri < biomeList.length; ri++) {
        var bb3 = biomeList[ri];
        var nR = Math.min(120, Math.floor((bb3.id === 'forestfloor' ? 45 : bb3
            .id === 'mountain' ? 15 : bb3.id === 'sandy' ? 9 : 3) * scale /
          2));
        spawnRocksRegion(nR, ri, biomeMap);
      }
      addOceanBorder();
      addBeaches();
      addOresToMountains();
      cleanupTreesOnWater();
      cleanupRocksOnWater();
    }

    function cleanupRocksOnWater() {
      for (var i = rocks.length - 1; i >= 0; i--) {
        var r = rocks[i];
        var tx = Math.floor(r.x / TILE),
          ty = Math.floor(r.y / TILE);
        if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) {
          rocks.splice(i, 1);
          continue
        }
        var g = tiles[ty * COLS + tx];
        if (g !== 0 && g !== 3 && g !== 8 && g !== 9) rocks.splice(i, 1)
      }
    }

    function drawBlobRegion(cx, cy, radius, tileType, density, regionId, bMap) {
      var r = Math.ceil(radius),
        so = Math.random() * 100;
      for (var dy = -r; dy <= r; dy++)
        for (var dx = -r; dx <= r; dx++) {
          var nx = Math.floor(cx + dx),
            ny = Math.floor(cy + dy);
          if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
          if (bMap[ny * COLS + nx] !== regionId) continue;
          var d = Math.hypot(dx, dy);
          var wob = Math.sin((dx + so) * 0.7) * 0.5 + Math.cos((dy + so * 1.3) *
            0.6) * 0.5;
          if (d + wob < radius && Math.random() < density) tiles[ny * COLS +
            nx] = tileType;
        }
    }

    function spawnRocksRegion(n, regionId, bMap) {
      for (var i = 0; i < n; i++) {
        var tx = randInt(2, COLS - 3),
          ty = randInt(2, ROWS - 3);
        if (bMap[ty * COLS + tx] !== regionId) continue;
        var t = tiles[ty * COLS + tx];
        if (t !== 0 && t !== 3 && t !== 8 && t !== 9) continue;
        var cx = tx * TILE + TILE / 2,
          cy = ty * TILE + TILE / 2,
          close = false;
        for (var j = 0; j < rocks.length; j++) {
          if (Math.hypot(rocks[j].x - cx, rocks[j].y - cy) < TILE * 1.3) {
            close = true;
            break
          }
        }
        if (close) continue;
        for (var j2 = 0; j2 < trees.length; j2++) {
          if (Math.hypot(trees[j2].x - cx, trees[j2].y - cy) < TILE * 1.3) {
            close = true;
            break
          }
        }
        if (close) continue;
        var sv = 0.8 + Math.random() * 0.5;
        rocks.push({
          x: cx,
          y: cy,
          hp: 45,
          maxHp: 45,
          size: TILE * 0.95 * sv,
          seed: Math.random()
        });
      }
    }

    function cleanupTreesOnWater() {
      for (var i = trees.length - 1; i >= 0; i--) {
        var t = trees[i];
        var tx = Math.floor(t.x / TILE),
          ty = Math.floor(t.y / TILE);
        if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) {
          trees.splice(i, 1);
          continue
        }
        var g = tiles[ty * COLS + tx];
        if (g === 1 || g === 2 || g === 4) trees.splice(i, 1)
      }
    }

    function addTreeAt(tx, ty, k) {
      if (trees.length >= 500) return;
      var t = TREE_TYPES[k];
      var sv = 0.7 + Math.random() * 0.6;
      trees.push({
        x: tx * TILE + TILE / 2,
        y: ty * TILE + TILE / 2,
        type: k,
        hp: Math.round(t.hp * sv),
        maxHp: Math.round(t.hp * sv),
        size: t.size * sv,
        seed: Math.random(),
        sway: Math.random() * Math.PI * 2,
        burn: 0,
        shake: 0,
        sizeVar: sv
      });
    }

    function carveLake(cx, cy, radius) {
      var r = Math.ceil(radius),
        so = Math.random() * 100;
      for (var dy = -r - 1; dy <= r + 1; dy++)
        for (var dx = -r - 1; dx <= r + 1; dx++) {
          var nx = Math.floor(cx + dx),
            ny = Math.floor(cy + dy);
          if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
          var d = Math.hypot(dx, dy);
          var wob = Math.sin((dx + so) * 0.7) * 0.5 + Math.cos((dy + so * 1.3) *
            0.6) * 0.5;
          var edge = r + wob;
          if (d < edge) {
            var idx = ny * COLS + nx;
            tiles[idx] = 1;
            flowDepth[idx] = MAX_FLOW
          } else if (d < edge + 1.5) {
            var idx2 = ny * COLS + nx;
            if (tiles[idx2] !== 1) tiles[idx2] = 3
          }
        }
    }

    function addOceanBorder() {
      var eMin = Math.min(COLS, ROWS),
        hard = 1,
        soft = Math.max(3, Math.floor(eMin * 0.05));
      for (var y = 0; y < ROWS; y++)
        for (var x = 0; x < COLS; x++) {
          if (x < hard || x >= COLS - hard || y < hard || y >= ROWS - hard) {
            var idx = y * COLS + x;
            tiles[idx] = 1;
            flowDepth[idx] = MAX_FLOW
          }
        }
      for (var y2 = 0; y2 < ROWS; y2++)
        for (var x2 = 0; x2 < COLS; x2++) {
          var dist = Math.min(x2, y2, COLS - 1 - x2, ROWS - 1 - y2);
          if (dist >= soft) continue;
          var idx2 = y2 * COLS + x2;
          if (tiles[idx2] === 1) continue;
          var tE = Math.max(0, dist - hard) / Math.max(1, soft - hard);
          var noise = Math.sin(x2 * 0.62 + y2 * 0.89) * 0.32 + Math.cos(x2 *
              0.27 - y2 * 0.53) * 0.28 + Math.sin(x2 * 1.13 + y2 * 0.41) *
            0.22 + Math.cos(x2 * 0.83 + y2 * 1.27) * 0.18;
          var wave = (noise + 1) * 0.5,
            thr = 0.85 - tE * 0.65;
          if (wave < thr) {
            tiles[idx2] = 1;
            flowDepth[idx2] = MAX_FLOW
          }
        }
    }

    function addOresToMountains() {
      for (var y = 0; y < ROWS; y++)
        for (var x = 0; x < COLS; x++) {
          var idx = y * COLS + x;
          if (tiles[idx] !== 2) continue;
          mountainHP[idx] = MOUNTAIN_HP;
          var roll = Math.random(),
            ore = 0;
          if (roll < 0.55) ore = 1;
          else if (roll < 0.80) ore = 2;
          else if (roll < 0.93) ore = 3;
          else if (roll < 0.98) ore = 4;
          else ore = 5;
          oreMap[idx] = ore;
        }
    }

    function addBeaches() {
      var tc = [];
      for (var y = 0; y < ROWS; y++)
        for (var x = 0; x < COLS; x++) {
          var idx = y * COLS + x;
          if (tiles[idx] !== 0 && tiles[idx] !== 8 && tiles[idx] !== 9)
            continue;
          if (hasNear(x, y, 1) && Math.random() < 0.7) tc.push(idx);
        }
      for (var i = 0; i < tc.length; i++) tiles[tc[i]] = 3;
    }

    function hasNear(x, y, v) {
      for (var dy = -1; dy <= 1; dy++)
        for (var dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          var nx = x + dx,
            ny = y + dy;
          if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && tiles[ny * COLS +
              nx] === v) return true;
        }
      return false;
    }

    function makeBeing(x, y, type, isBaby, gender, villageId) {
      if (isBaby === undefined || isBaby === null) isBaby = false;
      if (beings.length >= upgrades.popLimit) return null;
      var t = BEING[type];
      var g = (gender !== null && gender !== undefined) ? gender : (Math
        .random() < 0.5 ? 0 : 1);
      var b = {
        x: x,
        y: y,
        vx: 0,
        vy: 0,
        type: type,
        clan: t.clan,
        villageId: villageId || 0,
        hp: t.hp,
        maxHp: t.hp,
        size: t.size,
        skin: t.skin,
        cloth: t.cloth,
        clothDark: t.clothDark,
        hair: t.hair,
        speed: t.speed,
        dmg: t.dmg,
        buildType: t.buildType,
        weapon: t.weapon,
        atkCd: 0,

    function findNearestMountain(x, y, maxDist) {

      var best = null,
        bd = maxDist;
      for (var dy = -r; dy <= r; dy++)

            ty = ty0 + dy;

          var idx = ty * COLS + tx,

          if (mountainHP[idx] <= 0) continue;
          var cx = tx * TILE + TILE / 2,

          var d = Math.hypot(cx - x, cy - y);
          if (d < bd) {
            bd = d;
            best = {

              ty: ty,
              idx: idx,
              x: cx,
              y: cy,
              type: t
            }

        x: x1,
        y: y1

        dy = y2 - y1,
        len = Math.hypot(dx, dy);
      var px = -dy / Math.max(0.01, len),
        py = dx / Math.max(0.01, len);
      for (var i = 1; i < segments; i++) {
        var t = i / segments;
        var qx = x1 + dx * t,
          qy = y1 + dy * t;
        var spread = len * 0.4 * Math.sin(t * Math.PI);
        var off = (Math.random() - 0.5) * spread;
        pts.push({
          x: qx + px * off,
          y: qy + py * off
        });
      }
      pts.push({
        x: x2,
        y: y2
      });
      return pts;
    }

        speed: t.speed,
        wanderA: Math.random() * Math.PI * 2,
        wanderT: 0,

    function tickAnimals(dt) {
      for (var i = animals.length - 1; i >= 0; i--) {
        var a = animals[i];
        var flee = null,
          fd = 95;
        for (var j = 0; j < beings.length; j++) {
          var u = beings[j];
          if (u.swimming || u.clan >= 2) continue;
          var d = Math.hypot(u.x - a.x, u.y - a.y);
          if (d < fd) {
            fd = d;
            flee = u
          }
        }
        if (flee) {
          var dx = a.x - flee.x,
            dy = a.y - flee.y,
            dd = Math.max(0.01, Math.hypot(dx, dy));
          a.vx = dx / dd * a.speed * 1.4;
          a.vy = dy / dd * a.speed * 1.4;
          if (Math.abs(dx) > 2) a.side = dx > 0 ? 1 : -1;
        } else {
          a.wanderT -= dt;
          if (a.wanderT <= 0) {
            a.wanderA = Math.random() * Math.PI * 2;
            a.wanderT = 1 + Math.random() * 3
          }
          a.vx = Math.cos(a.wanderA) * a.speed * 0.4;
          a.vy = Math.sin(a.wanderA) * a.speed * 0.4;
          if (Math.abs(a.vx) > 5) a.side = a.vx > 0 ? 1 : -1;
        }
        var nx = a.x + a.vx * dt,
          ny = a.y + a.vy * dt;
        if (walkable(nx, a.y)) a.x = nx;
        else a.wanderA += Math.PI * 0.7;
        if (walkable(a.x, ny)) a.y = ny;
        else a.wanderA += Math.PI * 0.7;
        a.x = cl(a.x, 4, WORLD_W - 4);
        a.y = cl(a.y, 4, WORLD_H - 4);
        if (a.flash > 0) a.flash -= dt;
        if (Math.hypot(a.vx, a.vy) > 5) a.walkPhase += dt * 12;
        if (a.hp <= 0) {
          var bestClan = 0,
            bd = Infinity;
          for (var k = 0; k < beings.length; k++) {
            var u2 = beings[k];
            if (u2.clan > 1) continue;
            var d2 = Math.hypot(u2.x - a.x, u2.y - a.y);
            if (d2 < bd) {
              bd = d2;
              bestClan = u2.clan
            }
          }
          food[bestClan] = Math.min((food[bestClan] || 0) + a.meat, upgrades
            .foodCap);
          for (var hh = 0; hh < 4; hh++) hearts.push({
            x: a.x + rnd(-6, 6),
            y: a.y - 4,
            vx: rnd(-15, 15),
            vy: rnd(-40, -20),
            life: 0.9,
            maxLife: 0.9,
            size: 7,
            color: '#8aff6a'
          });
          animals.splice(i, 1);
        }

        ctx.beginPath();
        ctx.arc(s * 0.55, -s * 0.35, s * 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#c83a3a';
        ctx.beginPath();
        ctx.arc(s * 0.55, -s * 0.85, s * 0.05, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(s * 0.65, -s * 0.8, s * 0.05, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#e8a02a';
        ctx.beginPath();
        ctx.moveTo(s * 0.85, -s * 0.35);
        ctx.lineTo(s * 1.1, -s * 0.3);
        ctx.lineTo(s * 0.85, -s * 0.25);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(s * 0.7, -s * 0.4, s * 0.05, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      if (a.hp < a.maxHp) {
        var bw = s * 1.8,
          bh = 3,
          bx = a.x - bw / 2,
          by = a.y - s * 1.6;
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
        var r = a.hp / a.maxHp;
        ctx.fillStyle = r > 0.5 ? '#4aff6a' : r > 0.25 ? '#f0e05a' : '#ff4a5a';
        ctx.fillRect(bx, by, bw * r, bh);
      }
    }

    function findBearSpawnPoint() {
      for (var tries = 0; tries < 80; tries++) {
        var ox = rnd(TILE * 6, WORLD_W - TILE * 6);
        var oy = rnd(TILE * 6, WORLD_H - TILE * 6);
        if (walkable(ox, oy)) return {
          x: ox,
          y: oy
        };
      }
      if (walkable(WORLD_W / 2, WORLD_H / 2)) return {
        x: WORLD_W / 2,
        y: WORLD_H / 2
      };
      for (var ty = 5; ty < ROWS - 5; ty++)
        for (var tx = 5; tx < COLS - 5; tx++) {
          var fx = tx * TILE + TILE / 2,
            fy = ty * TILE + TILE / 2;
          if (walkable(fx, fy)) return {
            x: fx,
            y: fy
          }
        }
      return null;
    }

    function spawnBearRaid() {
      var klist = [];
      for (var k in villages) {
        var v = villages[k];
        if (v.isKingdom || getVillageBuilds(v.id).length > 0) klist.push(v)
      }
      if (!klist.length) {
        toast('🐻 Нет городов для атаки!', 3);
        return
      }
      var raidCount = getRaidSize();
      toast('🐻 НАБЕГ МЕДВЕДЕЙ! ' + raidCount + ' хищников!', 4.5);
      var spawned = 0;
      for (var i = 0; i < raidCount; i++) {
        var pt = findBearSpawnPoint();
        if (!pt) break;
        var bear = {
          x: pt.x,
          y: pt.y,
          vx: 0,
          vy: 0,
          type: 'beast',
          clan: 2,
          villageId: 0,
          hp: 300,
          maxHp: 300,
          size: 11,
          speed: 70,
          dmg: 40,
          skin: BEING.beast.skin,
          cloth: BEING.beast.cloth,
          clothDark: BEING.beast.clothDark,
          hair: BEING.beast.hair,
          buildType: null,
          weapon: null,
          atkCd: 0,
          bldCd: 999,
          chopCd: 0,
          chopTarget: null,
          mineCd: 0,
          mineTarget: null,
          plantCd: 999,
          warehouseCd: 999,
          wanderA: Math.random() * Math.PI * 2,
          wanderT: 0,
          flash: 0,
          side: 1,
          walkPhase: Math.random() * 6.28,
          age: 0,
          gender: 0,
          isBaby: false,
          growth: 1,
          breedCd: 9999,
          swimming: false,
          swimTarget: null,
          drownTime: 0,
          currentAction: 'idle',
          hunger: 100,
          raidTarget: null
        };
        var target = klist[Math.floor(Math.random() * klist.length)];
        if (target) bear.raidTarget = target.id;
        beings.push(bear);
        spawned++;
        hearts.push({
          x: pt.x,
          y: pt.y - 10,
          vx: rnd(-20, 20),
          vy: rnd(-60, -30),
          life: 1.2,
          maxLife: 1.2,
          size: 10,
          color: '#ff4a4a'
        });
      }
      if (spawned === 0) toast('⚠️ Не удалось заспавнить медведей', 2.5);
    }

    function tickBeings(dt) {
      var nowMs = Date.now();
      if (!nextRaidTime) nextRaidTime = nowMs + RAID_INTERVAL * 1000;
      raidTimer = (RAID_INTERVAL * 1000 - (nextRaidTime - nowMs)) / 1000;
      if (raidTimer < 0) raidTimer = 0;
      if (nowMs >= nextRaidTime) {
        nextRaidTime = nowMs + RAID_INTERVAL * 1000;
        raidTimer = 0;
        spawnBearRaid()
      }
      var popCap = {
        0: getPopulationCap(0),
        1: getPopulationCap(1)
      };
      var popCount = {
        0: getPopulationCount(0),
        1: getPopulationCount(1)
      };
      for (var hi = 0; hi < beings.length; hi++) {
        var hu = beings[hi];
        if (hu.hunger === undefined) hu.hunger = 100;
        hu.hunger -= dt * HUNGER_DECAY;
        if (hu.hunger <= 0) {
          hu.hunger = 0;
          hu.hp -= 2.5 * dt;
          hu.flash = 0.05
        } else if (hu.hunger < 40) {
          var fc = food[hu.clan] || 0;
          if (fc > 0) {
            var eat = Math.min(fc, 25);
            food[hu.clan] = fc - eat;
            hu.hunger = Math.min(100, hu.hunger + eat * 3)
          }
        }
      }
      for (var bi = 0; bi < beings.length; bi++) {
        var u = beings[bi];
        u.currentAction = 'idle';
        u.age += dt;
        var curTx = Math.floor(u.x / TILE),
          curTy = Math.floor(u.y / TILE);
        var onWater = curTx >= 0 && curTx < COLS && curTy >= 0 && curTy <
          ROWS && tiles[curTy * COLS + curTx] === 1;
        if (onWater) u.swimming = true;
        else if (u.swimming) {
          u.swimming = false;
          u.swimTarget = null;
          u.drownTime = 0
        }
        if (u.swimming) {
          if (!u.swimTarget || !walkable(u.swimTarget.x, u.swimTarget.y)) {
            var best = null,
              bd = Infinity,
              R = 15;
            for (var dy = -R; dy <= R; dy++)
              for (var dx = -R; dx <= R; dx++) {
                var tx = curTx + dx,
                  ty = curTy + dy;
                if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) continue;
                var tIdx = ty * COLS + tx;
                if (tiles[tIdx] === 1) continue;
                if (!WALKABLE[tiles[tIdx]]) continue;
                var d = Math.hypot(dx, dy);
                if (d < bd) {
                  bd = d;
                  best = {
                    tx: tx,
                    ty: ty,
                    x: tx * TILE + TILE / 2,
                    y: ty * TILE + TILE / 2
                  }
                }
              }
            u.swimTarget = best;
          }
          if (u.swimTarget) {
            var dx2 = u.swimTarget.x - u.x,
              dy2 = u.swimTarget.y - u.y;
            var d2 = Math.max(0.01, Math.hypot(dx2, dy2));
            var ss = u.speed * 0.55;
            u.vx = dx2 / d2 * ss;
            u.vy = dy2 / d2 * ss;
            if (Math.abs(dx2) > 2) u.side = dx2 > 0 ? 1 : -1;
            u.x = cl(u.x + u.vx * dt, 4, WORLD_W - 4);
            u.y = cl(u.y + u.vy * dt, 4, WORLD_H - 4);
          } else {
            u.drownTime += dt;
            if (u.drownTime > 15) {
              u.hp -= 6 * dt;
              u.flash = 0.1
            }
          }
          u.walkPhase += dt * 6;
          if (u.atkCd > 0) u.atkCd -= dt;
          if (u.flash > 0) u.flash -= dt;
          u.currentAction = 'swimming';
          continue;
        }
        if (u.isBaby) {
          u.growth += dt / BABY_TIME;
          if (u.growth >= 1) {
            u.growth = 1;
            u.isBaby = false
          }
        }
        if (u.breedCd > 0) u.breedCd -= dt;
        if (u.warehouseCd > 0) u.warehouseCd -= dt;
        var target = null,
          tDist = Infinity,
          isBuild = false;
        for (var i = 0; i < beings.length; i++) {
          var o = beings[i];
          if (o === u || !hostile(u, o) || o.swimming) continue;
          var d3 = Math.hypot(o.x - u.x, o.y - u.y);
          if (d3 < tDist) {
            tDist = d3;
            target = o;
            isBuild = false
          }
        }
        for (var i2 = 0; i2 < builds.length; i2++) {
          var b = builds[i2];
          if (b.clan === u.clan && b.villageId === u.villageId) continue;
          if (b.clan === u.clan && u.villageId && b.villageId) {
            var bv = villages[b.villageId],
              uv = villages[u.villageId];
            if (!bv || !uv || !areAtWar(bv, uv)) continue;
          } else if (b.clan === u.clan) continue;
          var d4 = Math.hypot(b.x - u.x, b.y - u.y);
          if (d4 < tDist) {
            tDist = d4;
            target = b;
            isBuild = true
          }
        }
        var atWarLong = false;
        if (u.villageId && villages[u.villageId] && villages[u.villageId].wars
          .length > 0) atWarLong = true;
        var range = atWarLong ? 4000 : (u.type === 'beast' ? 320 : 200);
        var doing = 'idle';
        if (target && tDist < range) {
          doing = 'attack';
          var dx3 = target.x - u.x,
            dy3 = target.y - u.y;
          var d5 = Math.max(0.01, Math.hypot(dx3, dy3));
          u.vx = dx3 / d5 * u.speed;
          u.vy = dy3 / d5 * u.speed;
          if (Math.abs(dx3) > 2) u.side = dx3 > 0 ? 1 : -1;
          var hitR = isBuild ? u.size + 40 : u.size + target.size + 4;
          if (tDist < hitR && u.atkCd <= 0) {
            target.hp -= u.dmg;
            target.flash = 0.15;
            u.atkCd = 0.5
          }
        } else if (u.clan === 0 || u.clan === 1) {
          var canBreed = !u.isBaby && u.breedCd <= 0 && popCount[u.clan] <
            popCap[u.clan] && u.type !== 'warrior';
          if (canBreed) {
            var partner = findPartner(u);
            if (partner) {
              doing = 'breed';
              var dx4 = partner.x - u.x,
                dy4 = partner.y - u.y;
              var d6 = Math.max(0.01, Math.hypot(dx4, dy4));
              u.vx = dx4 / d6 * u.speed * 0.7;
              u.vy = dy4 / d6 * u.speed * 0.7;
              if (Math.abs(dx4) > 2) u.side = dx4 > 0 ? 1 : -1;
              if (d6 < BREED_DISTANCE * 0.7) breed(u, partner);
              u.x = cl(u.x + u.vx * dt, 4, WORLD_W - 4);
              u.y = cl(u.y + u.vy * dt, 4, WORLD_H - 4);
              if (u.atkCd > 0) u.atkCd -= dt;
              if (u.flash > 0) u.flash -= dt;
              if (Math.hypot(u.vx, u.vy) > 5) u.walkPhase += dt * 12;
              u.currentAction = 'breed';
              continue;
            }
          }
          if (u.hunger < 70) {
            var nearA = null,
              ad = Infinity;
            for (var ai = 0; ai < animals.length; ai++) {
              var an = animals[ai];
              var dd0 = Math.hypot(an.x - u.x, an.y - u.y);
              if (dd0 < ad && dd0 < 220) {
                ad = dd0;
                nearA = an
              }
            }
            if (nearA) {
              if (ad < u.size + nearA.size + 10) {
                u.vx *= 0.3;
                u.vy *= 0.3;
                if (Math.abs(nearA.x - u.x) > 2) u.side = nearA.x > u.x ? 1 : -
                  1;
                if (u.atkCd <= 0) {
                  nearA.hp -= u.dmg * 0.8;
                  nearA.flash = 0.15;
                  u.atkCd = 0.6
                }
                if (u.atkCd > 0) u.atkCd -= dt;
                if (u.flash > 0) u.flash -= dt;
                u.currentAction = 'hunt';
                continue;
              } else {
                var adx = nearA.x - u.x,
                  ady = nearA.y - u.y;
                var add = Math.max(0.01, Math.hypot(adx, ady));
                u.vx = adx / add * u.speed;
                u.vy = ady / add * u.speed;
                if (Math.abs(adx) > 2) u.side = adx > 0 ? 1 : -1;
                u.x = cl(u.x + u.vx * dt, 4, WORLD_W - 4);
                u.y = cl(u.y + u.vy * dt, 4, WORLD_H - 4);
                if (u.atkCd > 0) u.atkCd -= dt;
                if (u.flash > 0) u.flash -= dt;
                if (Math.hypot(u.vx, u.vy) > 5) u.walkPhase += dt * 12;
                u.currentAction = 'walk_to_animal';
                continue;
              }
            }
          }
          var nearTree = null,
            ntd = Infinity;
          for (var i3 = 0; i3 < trees.length; i3++) {
            var t2 = trees[i3];
            var d7 = Math.hypot(t2.x - u.x, t2.y - u.y);
            if (d7 < ntd && d7 < 120) {
              ntd = d7;
              nearTree = t2
            }
          }
          var nearRock = null,
            nrd = Infinity;
          for (var i4 = 0; i4 < rocks.length; i4++) {
            var r = rocks[i4];
            var d8 = Math.hypot(r.x - u.x, r.y - u.y);
            if (d8 < nrd && d8 < 120) {
              nrd = d8;
              nearRock = r
            }
          }
          var nearMtn = findNearestMountain(u.x, u.y, 120);
          var ntdMtn = nearMtn ? Math.hypot(nearMtn.x - u.x, nearMtn.y - u.y) :
            Infinity;
          if (u.type === 'warrior') {
            doing = 'wander';
            u.wanderT -= dt;
            if (u.wanderT <= 0) {
              u.wanderA = Math.random() * Math.PI * 2;
              u.wanderT = 1 + Math.random() * 2.5
            }
            u.vx = Math.cos(u.wanderA) * u.speed * 0.42;
            u.vy = Math.sin(u.wanderA) * u.speed * 0.42;
            if (Math.abs(u.vx) > 5) u.side = u.vx > 0 ? 1 : -1;
          } else if (nearMtn && ntdMtn < ntd && ntdMtn < nrd) {
            if (ntdMtn < u.size + 22) {
              doing = 'mine';
              u.mineTarget = nearMtn;
              u.vx *= 0.5;
              u.vy *= 0.5;
              if (Math.abs(nearMtn.x - u.x) > 2) u.side = nearMtn.x > u.x ? 1 :
                -1;
              u.mineCd -= dt;
              if (u.mineCd <= 0) {
                var dmg = MINING_DAMAGE * (1 + u.dmg * 0.05);
                mountainHP[nearMtn.idx] -= dmg;
                u.mineCd = 1.6;
                if (mountainHP[nearMtn.idx] <= 0) {
                  var tt = tiles[nearMtn.idx];
                  if (tt === 2) {
                    tiles[nearMtn.idx] = 6;
                    mountainHP[nearMtn.idx] = SHAFT_HP;
                    oreMap[nearMtn.idx] = Math.random() < 0.6 ? 2 : 3;
                    flowDepth[nearMtn.idx] = 0
                  } else if (tt === 6) {
                    tiles[nearMtn.idx] = 7;
                    mountainHP[nearMtn.idx] = DEEP_SHAFT_HP;
                    oreMap[nearMtn.idx] = Math.random() < 0.5 ? 4 : 5;
                    flowDepth[nearMtn.idx] = 0
                  } else if (tt === 7) {
                    var ot = oreMap[nearMtn.idx];
                    if (ot > 0) minerals[ORE_TYPES[ot].name] += ORE_PER_TILE *
                      2;
                    tiles[nearMtn.idx] = 0;
                    mountainHP[nearMtn.idx] = 0;
                    oreMap[nearMtn.idx] = 0;
                    flowDepth[nearMtn.idx] = 0
                  }
                  clampStorage();
                }
              }
            } else {
              doing = 'walk_to_mine';
              var dx5 = nearMtn.x - u.x,
                dy5 = nearMtn.y - u.y;
              var d9 = Math.max(0.01, Math.hypot(dx5, dy5));
              u.vx = dx5 / d9 * u.speed * 0.8;
              u.vy = dy5 / d9 * u.speed * 0.8;
              if (Math.abs(dx5) > 2) u.side = dx5 > 0 ? 1 : -1;
            }
          } else if (nearRock && nrd < ntd && nrd < ntdMtn) {
            if (nrd < u.size + 20) {
              doing = 'mine';
              u.vx *= 0.5;
              u.vy *= 0.5;
              if (Math.abs(nearRock.x - u.x) > 2) u.side = nearRock.x > u.x ?
                1 : -1;
              u.mineCd -= dt;
              if (u.mineCd <= 0) {
                nearRock.hp -= MINING_DAMAGE;
                u.mineCd = 1.4;
                if (nearRock.hp <= 0) {
                  minerals.stone += 2;
                  clampStorage();
                  var ri = rocks.indexOf(nearRock);
                  if (ri >= 0) rocks.splice(ri, 1)
                }
              }
            } else {
              doing = 'walk_to_mine';
              var dx6 = nearRock.x - u.x,
                dy6 = nearRock.y - u.y;
              var d10 = Math.max(0.01, Math.hypot(dx6, dy6));
              u.vx = dx6 / d10 * u.speed * 0.8;
              u.vy = dy6 / d10 * u.speed * 0.8;
              if (Math.abs(dx6) > 2) u.side = dx6 > 0 ? 1 : -1;
            }
          } else if (nearTree && ntd < u.size + 22) {
            doing = 'chop';
            u.chopTarget = nearTree;
            u.vx *= 0.5;
            u.vy *= 0.5;
            if (Math.abs(nearTree.x - u.x) > 2) u.side = nearTree.x > u.x ? 1 :
              -1;
            u.chopCd -= dt;
            if (u.chopCd <= 0) {
              nearTree.hp -= 3;
              nearTree.shake = 0.25;
              u.chopCd = 1.4
            }
          } else if (nearTree && ntd < 100) {
            doing = 'walk_to_tree';
            var dx7 = nearTree.x - u.x,
              dy7 = nearTree.y - u.y;
            var d11 = Math.max(0.01, Math.hypot(dx7, dy7));
            u.vx = dx7 / d11 * u.speed * 0.8;
            u.vy = dy7 / d11 * u.speed * 0.8;
            if (Math.abs(dx7) > 2) u.side = dx7 > 0 ? 1 : -1;
          } else {
            u.plantCd -= dt;
            if (u.plantCd <= 0 && !u.isBaby && u.age > 8) {
              var tx2 = Math.floor(u.x / TILE),
                ty2 = Math.floor(u.y / TILE);
              if (tx2 >= 1 && tx2 < COLS - 1 && ty2 >= 1 && ty2 < ROWS - 1) {
                var idx2 = ty2 * COLS + tx2;
                if (tiles[idx2] === 0 || tiles[idx2] === 3 || tiles[idx2] ===
                  8 || tiles[idx2] === 9) {
                  var ok = true;
                  for (var i5 = 0; i5 < trees.length; i5++) {
                    var t3 = trees[i5];
                    if (Math.hypot(t3.x - u.x, t3.y - u.y) < TILE * 1.2) {
                      ok = false;
                      break
                    }
                  }
                  if (ok)
                    for (var i6 = 0; i6 < builds.length; i6++) {
                      var b2 = builds[i6];
                      if (Math.hypot(b2.x - u.x, b2.y - u.y) < TILE * 2) {
                        ok = false;
                        break
                      }
                    }
                  if (ok) {
                    var kinds = ['birch', 'birch', 'oak'];
                    var k = pick(kinds);
                    var tt2 = TREE_TYPES[k];
                    var sv2 = 0.75 + Math.random() * 0.55;
                    trees.push({
                      x: u.x,
                      y: u.y,
                      type: k,
                      hp: Math.round(tt2.hp * sv2),
                      maxHp: Math.round(tt2.hp * sv2),
                      size: tt2.size * sv2,
                      seed: Math.random(),
                      sway: Math.random() * Math.PI * 2,
                      burn: 0,
                      shake: 0,
                      sizeVar: sv2
                    });
                    u.plantCd = 30 + Math.random() * 40;
                  } else u.plantCd = 3 + Math.random() * 4;
                } else u.plantCd = 5;
              } else u.plantCd = 5;
            }
            doing = 'wander';
            u.wanderT -= dt;
            if (u.wanderT <= 0) {
              u.wanderA = Math.random() * Math.PI * 2;
              u.wanderT = 1 + Math.random() * 2.5
            }
            u.vx = Math.cos(u.wanderA) * u.speed * 0.42;
            u.vy = Math.sin(u.wanderA) * u.speed * 0.42;
            if (Math.abs(u.vx) > 5) u.side = u.vx > 0 ? 1 : -1;
            if (u.buildType && u.age > 5 && !u.isBaby) {
              u.bldCd -= dt;
              if (u.bldCd <= 0 && canBuild(u.x, u.y, u.clan)) {
                var myW = builds.filter(function(b3) {
                  return b3.villageId === u.villageId && b3.type ===
                    'warehouse'
                }).length;
                var typeToBuild = u.buildType,
                  cost;
                if (myW < 1) {
                  typeToBuild = 'warehouse';
                  cost = {
                    wood: 0,
                    stone: 0,
                    iron: 0,
                    gold: 0
                  }
                } else {
                  if (myW < 3 && u.warehouseCd <= 0 && Math.random() < 0.15)
                    typeToBuild = 'warehouse';
                  cost = BUILD_COST[typeToBuild][0];
                }
                if (canAfford(u.clan, cost)) {
                  payCost(u.clan, cost);
                  var nb = placeBuild(u.x, u.y, typeToBuild, u.clan, u
                    .villageId);
                  if (typeToBuild === 'cottage' && Math.random() < 0.35) {
                    nb.level = 2;
                    nb.maxHp = BUILD_LEVELS.cottage[1].hp;
                    nb.hp = nb.maxHp;
                    nb.upgradeProg = 0
                  }
                  u.bldCd = 26 + Math.random() * 15;
                  if (typeToBuild === 'warehouse') u.warehouseCd = 60 + Math
                    .random() * 40;
                } else u.bldCd = 8 + Math.random() * 5;
              } else if (u.bldCd <= 0) u.bldCd = 5 + Math.random() * 3;
            }
          }
        } else {
          if (u.raidTarget && villages[u.raidTarget]) {
            doing = 'raid';
            var rv = villages[u.raidTarget];
            var rdx = (rv.cx || 0) - u.x,
              rdy = (rv.cy || 0) - u.y;
            var rd = Math.max(0.01, Math.hypot(rdx, rdy));
            u.vx = rdx / rd * u.speed * 0.75;
            u.vy = rdy / rd * u.speed * 0.75;
            if (Math.abs(rdx) > 2) u.side = rdx > 0 ? 1 : -1;
          } else {
            u.wanderT -= dt;
            if (u.wanderT <= 0) {
              u.wanderA = Math.random() * Math.PI * 2;
              u.wanderT = 1 + Math.random() * 2.5
            }
            u.vx = Math.cos(u.wanderA) * u.speed * 0.42;
            u.vy = Math.sin(u.wanderA) * u.speed * 0.42;
          }
          if (Math.abs(u.vx) > 5) u.side = u.vx > 0 ? 1 : -1;
        }
        if (doing !== 'chop' && doing !== 'breed' && doing !== 'mine') {
          var nx2 = u.x + u.vx * dt,
            ny2 = u.y + u.vy * dt;
          var blocked = false;
          for (var i7 = 0; i7 < trees.length; i7++) {
            var t4 = trees[i7];
            if (doing === 'walk_to_tree' && t4 === u.chopTarget) continue;
            if (Math.hypot(t4.x - nx2, t4.y - ny2) < u.size + 6) {
              blocked = true;
              break
            }
          }
          if (!blocked && walkable(nx2, u.y)) u.x = nx2;
          else if (doing !== 'walk_to_tree' && doing !== 'walk_to_mine') u
            .wanderA += Math.PI * 0.7;
          blocked = false;
          for (var i8 = 0; i8 < trees.length; i8++) {
            var t5 = trees[i8];
            if (doing === 'walk_to_tree' && t5 === u.chopTarget) continue;
            if (Math.hypot(t5.x - u.x, t5.y - ny2) < u.size + 6) {
              blocked = true;
              break
            }
          }
          if (!blocked && walkable(u.x, ny2)) u.y = ny2;
          else if (doing !== 'walk_to_tree' && doing !== 'walk_to_mine') u
            .wanderA += Math.PI * 0.7;
        }
        for (var i9 = 0; i9 < beings.length; i9++) {
          var o2 = beings[i9];
          if (o2 === u || u.swimming || o2.swimming) continue;
          var dx8 = o2.x - u.x,
            dy8 = o2.y - u.y;
          var d12 = Math.hypot(dx8, dy8);
          var minD = (u.size + o2.size) * (u.isBaby ? 0.6 : 1);
          if (d12 < minD && d12 > 0.01) {
            var push = (minD - d12) * 0.5;
            u.x -= dx8 / d12 * push * 0.4;
            u.y -= dy8 / d12 * push * 0.4
          }
        }
        u.x = cl(u.x, 4, WORLD_W - 4);
        u.y = cl(u.y, 4, WORLD_H - 4);
        if (u.atkCd > 0) u.atkCd -= dt;
        if (u.flash > 0) u.flash -= dt;
        if (Math.hypot(u.vx, u.vy) > 5) u.walkPhase += dt * 12;
        u.currentAction = doing;
      }
      for (var i10 = trees.length - 1; i10 >= 0; i10--) {
        var t6 = trees[i10];
        if (t6.hp <= 0) {
          var chop = null,
            cd = Infinity;
          for (var j = 0; j < beings.length; j++) {
            var u2 = beings[j];
            if (u2.clan > 1) continue;
            if (u2.chopTarget === t6) {
              var d13 = Math.hypot(t6.x - u2.x, t6.y - u2.y);
              if (d13 < cd) {
                cd = d13;
                chop = u2
              }
            }
          }
          if (chop) {
            var wamt = Math.round(5 * t6.sizeVar);
            wood[chop.clan] = Math.min((wood[chop.clan] || 0) + wamt,
              getStorageCapacity(chop.clan).wood)
          }
          trees.splice(i10, 1);
        }
      }
      for (var i11 = beings.length - 1; i11 >= 0; i11--) {
        if (beings[i11].hp <= 0) beings.splice(i11, 1)
      }
    }

    function checkConquest() {
      var destroyed = [];
      for (var k in villages) {
        var v = villages[k];
        if (!v.isKingdom) continue;
        if (getVillageBuilds(v.id).length === 0 && getVillageMembers(v.id)
          .length === 0) destroyed.push(v);
      }
      if (!destroyed.length) return;
      for (var di = 0; di < destroyed.length; di++) {
        var v = destroyed[di];
        var bd = Infinity,
          conqueror = null;
        for (var k2 in villages) {
          var v2 = villages[k2];
          if (v2.id === v.id) continue;
          if (getVillageBuilds(v2.id).length === 0 && getVillageMembers(v2.id)
            .length === 0) continue;
          var d = Math.hypot((v2.cx || 0) - v.cx, (v2.cy || 0) - v.cy);
          if (d < bd) {
            bd = d;
            conqueror = v2
          }
        }
        if (conqueror) {
          toast('🏴 ' + conqueror.name + ' завоевал ' + v.name + '!', 3.5);
          var isPlayerDefeated = (playerKingdomId === v.id);
          for (var b2 = 0; b2 < builds.length; b2++)
            if (builds[b2].villageId === v.id) builds[b2].villageId = conqueror
              .id;
          for (var b3 = 0; b3 < beings.length; b3++)
            if (beings[b3].villageId === v.id) beings[b3].villageId = conqueror
              .id;
          for (var k3 in villages) {
            var v3 = villages[k3];
            var wi = v3.wars.indexOf(v.id);
            if (wi >= 0) v3.wars.splice(wi, 1);
            var ai2 = v3.allies.indexOf(v.id);
            if (ai2 >= 0) v3.allies.splice(ai2, 1);
          }
          delete villages[v.id];
          if (isPlayerDefeated) toast('💀 Твоё королевство пало!', 5);
        } else delete villages[v.id];
      }
      buildOwnerMap();
      saveWorld();
    }

    function tickBuilds(dt) {
      for (var bi = 0; bi < builds.length; bi++) {
        var b = builds[bi];
        if (b.flash > 0) b.flash -= dt;
        b.pop += dt * 1.5;
        var lvls = BUILD_LEVELS[b.type];
        var L = lvls[b.level - 1];
        b.spawnT -= dt;
        if (b.type !== 'warehouse' && b.spawnT <= 0 && b.hp > 0) {
          var cnt = getVillageMembers(b.villageId).length;
          if (cnt < 35 && beings.length < upgrades.popLimit) {
            var nb = makeBeing(b.x + rnd(-15, 15), b.y + rnd(20, 35), b.type ===
              'cottage' ? 'human' : 'troll', false, null, b.villageId);
            if (nb) nb.villageId = b.villageId;
          }
          b.spawnT = L.spawnEvery;
        }
        if (b.level < 3) {
          var hasR = false;
          for (var i = 0; i < beings.length; i++) {
            var u = beings[i];
            if (u.villageId !== b.villageId) continue;
            if (Math.hypot(u.x - b.x, u.y - b.y) < TILE * 4) {
              hasR = true;
              break
            }
          }
          var cost = BUILD_COST[b.type][b.level];
          if (hasR && canAfford(b.clan, cost)) {
            var rate = b.level === 1 ? 1 / 120 : 1 / 240;
            b.upgradeProg += dt * rate;
            if (b.upgradeProg >= 1) {
              payCost(b.clan, cost);
              b.upgradeProg = 0;
              b.level++;
              b.maxHp = lvls[b.level - 1].hp;
              b.hp = b.maxHp;
              b.spawnT = lvls[b.level - 1].spawnEvery;
              clampStorage();
            }
          } else if (hasR && b.upgradeProg > 0) b.upgradeProg = Math.max(0, b
            .upgradeProg - dt * 0.05);
        }
      }
      for (var i2 = builds.length - 1; i2 >= 0; i2--) {
        if (builds[i2].hp <= 0) builds.splice(i2, 1)
      }
      clampStorage();
      checkConquest();
    }

    function tickTrees(dt) {
      for (var i = 0; i < trees.length; i++) {
        var t = trees[i];
        if (t.shake > 0) t.shake -= dt;
        if (t.burn > 0) {
          t.burn -= dt;
          t.hp -= 20 * dt
        }
        var tx = Math.floor(t.x / TILE),
          ty = Math.floor(t.y / TILE);
        if (tx >= 0 && tx < COLS && ty >= 0 && ty < ROWS) {
          if (tiles[ty * COLS + tx] === 4 && t.burn <= 0) t.burn = 2
        }
      }
    }

    function tickFire(dt) {
      for (var i = 0; i < burnTimer.length; i++) {
        if (burnTimer[i] <= 0) continue;
        burnTimer[i] -= dt;
        var px = (i % COLS) * TILE + TILE / 2,
          py = Math.floor(i / COLS) * TILE + TILE / 2;
        for (var j = 0; j < beings.length; j++) {
          var u = beings[j];
          if (u.swimming) continue;
          if (Math.abs(u.x - px) < TILE && Math.abs(u.y - py) < TILE) {
            u.hp -= 25 * dt;
            u.flash = 0.1
          }
        }
        for (var jA = 0; jA < animals.length; jA++) {
          var aa = animals[jA];
          if (Math.abs(aa.x - px) < TILE && Math.abs(aa.y - py) < TILE) {
            aa.hp -= 25 * dt;
            aa.flash = 0.1
          }
        }
        for (var j2 = 0; j2 < builds.length; j2++) {
          var b = builds[j2];
          if (Math.abs(b.x - px) < 40 && Math.abs(b.y - py) < 40) {
            b.hp -= 30 * dt;
            b.flash = 0.1
          }
        }
        var gen = burnGen[i];
        if (gen < MAX_BURN_GEN && Math.random() < dt * 1.2) {
          var dirs = [
              [1, 0],
              [-1, 0],
              [0, 1],
              [0, -1]
            ],
            dir = dirs[Math.floor(Math.random() * 4)];
          var nx = (i % COLS) + dir[0],
            ny = Math.floor(i / COLS) + dir[1];
          if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
            var ni = ny * COLS + nx;
            if ((tiles[ni] === 0 || tiles[ni] === 3 || tiles[ni] === 8 || tiles[
                ni] === 9) && burnTimer[ni] <= 0) {
              burnTimer[ni] = 1.5 + Math.random() * 1.5;
              burnGen[ni] = gen + 1
            }
          }
        }
        if (burnTimer[i] <= 0) {
          var t = tiles[i];
          if (t === 0 || t === 3 || t === 4 || t === 8 || t === 9) tiles[i] = 5;
          flowDepth[i] = 0;
        }
      }
    }

    function tickSparks(dt) {
      for (var i = sparks.length - 1; i >= 0; i--) {
        var p = sparks[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 60 * dt;
        p.life -= dt;
        if (p.life <= 0) sparks.splice(i, 1)
      }
    }

    function tickHearts(dt) {
      for (var i = hearts.length - 1; i >= 0; i--) {
        var h = hearts[i];
        h.x += h.vx * dt;
        h.y += h.vy * dt;
        h.vy += 30 * dt;
        h.life -= dt;
        if (h.life <= 0) hearts.splice(i, 1)
      }
    }

    function useTool(px, py) {
      var tx = Math.floor(px / TILE),
        ty = Math.floor(py / TILE);
      if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return;
      var i = ty * COLS + tx;
      if (activeTool === 'war' || activeTool === 'ally') {
        var v = null;
        for (var bi = builds.length - 1; bi >= 0; bi--) {
          var b = builds[bi];
          var L = BUILD_LEVELS[b.type][b.level - 1];
          var hw = (b.type === 'warehouse' ? L.w * 1.1 : TILE * 2.2) / 2;
          var hh = (b.type === 'warehouse' ? L.h * 1.1 : TILE * 2.0) / 2;
          if (Math.abs(b.x - px) < hw + 8 && Math.abs(b.y - py) < hh + 8) {
            if (villages[b.villageId]) v = villages[b.villageId];
            break
          }
        }
        if (!v) {
          var bd = Infinity;
          for (var k in villages) {
            var vv = villages[k];
            var dd = Math.hypot((vv.cx || 0) - px, (vv.cy || 0) - py);
            if (dd < bd) {
              bd = dd;
              v = vv
            }
          }
        }
        if (!v) {
          toast('Нажми на территорию города', 1.6);

        }
        if (!warSelected) {

        } else if (warSelected === v.id) {

        } else {

          }

        }
        return;
      }
      var now = performance.now();
      var terrain = activeTool === 'grass' || activeTool === 'forestfloor' ||
        activeTool === 'snow' || activeTool === 'water' || activeTool ===
        'rock' || activeTool === 'sand' || activeTool === 'remove';
      var isTree = ['oak', 'pine', 'birch', 'palm', 'dead'].indexOf(
        activeTool) >= 0;
      var isAnimal = ['rabbit', 'deer', 'boar', 'fox', 'wolf', 'sheep', 'goat',
        'chicken'
      ].indexOf(activeTool) >= 0;
      var delay = (isTree || activeTool === 'boulder' || isAnimal ||
        activeTool === 'house2') ? 180 : 130;
      if (!terrain && now - lastTick < delay) return;
      lastTick = now;
      if (activeTool === 'grass') {
        tiles[i] = 0;
        burnTimer[i] = 0;
        oreMap[i] = 0;
        mountainHP[i] = 0;
        flowDepth[i] = 0
      } else if (activeTool === 'forestfloor') {
        tiles[i] = 8;
        burnTimer[i] = 0;
        oreMap[i] = 0;
        mountainHP[i] = 0;
        flowDepth[i] = 0
      } else if (activeTool === 'snow') {
        tiles[i] = 9;
        burnTimer[i] = 0;
        oreMap[i] = 0;
        mountainHP[i] = 0;
        flowDepth[i] = 0
      } else if (activeTool === 'water') {
        tiles[i] = 1;
        burnTimer[i] = 0;
        oreMap[i] = 0;
        mountainHP[i] = 0;
        flowDepth[i] = MAX_FLOW
      } else if (activeTool === 'rock') {
        tiles[i] = 2;
        burnTimer[i] = 0;
        flowDepth[i] = 0;
        mountainHP[i] = MOUNTAIN_HP;
        var roll = Math.random();
        oreMap[i] = roll < 0.55 ? 1 : roll < 0.80 ? 2 : roll < 0.93 ? 3 : roll <
          0.98 ? 4 : 5
      } else if (activeTool === 'sand') {
        tiles[i] = 3;
        burnTimer[i] = 0;
        oreMap[i] = 0;
        mountainHP[i] = 0;
        flowDepth[i] = 0
      } else if (activeTool === 'flame') {
        if (tiles[i] === 0 || tiles[i] === 3 || tiles[i] === 8 || tiles[i] ===
          9) {
          burnTimer[i] = 2.5 + Math.random() * 1.5;
          burnGen[i] = 0
        } else if (tiles[i] === 4) burnTimer[i] = 2;
      } else if (activeTool === 'oak' || activeTool === 'pine' || activeTool ===
        'birch' || activeTool === 'palm' || activeTool === 'dead') placeTree(px,
        py, activeTool);
      else if (activeTool === 'boulder') placeRock(px, py);
      else if (activeTool === 'house2') {
        if (walkable(px, py) && px > TILE && px < WORLD_W - TILE && py > TILE &&
          py < WORLD_H - TILE) {
          var okH = true;
          for (var hi2 = 0; hi2 < builds.length; hi2++) {
            if (Math.hypot(builds[hi2].x - px, builds[hi2].y - py) < TILE *
              2.2) {
              okH = false;
              break
            }
          }
          if (okH) {
            var nb = placeBuild(px, py, 'cottage', 0, playerKingdomId ||
              undefined);
            nb.level = 2;
            nb.maxHp = BUILD_LEVELS.cottage[1].hp;
            nb.hp = nb.maxHp;
            nb.upgradeProg = 0
          }
        }
      } else if (activeTool === 'rabbit') makeAnimal(px, py, 'rabbit');
      else if (activeTool === 'deer') makeAnimal(px, py, 'deer');
      else if (activeTool === 'boar') makeAnimal(px, py, 'boar');
      else if (activeTool === 'fox') makeAnimal(px, py, 'fox');
      else if (activeTool === 'wolf') makeAnimal(px, py, 'wolf');
      else if (activeTool === 'sheep') makeAnimal(px, py, 'sheep');
      else if (activeTool === 'goat') makeAnimal(px, py, 'goat');
      else if (activeTool === 'chicken') makeAnimal(px, py, 'chicken');
      else if (activeTool === 'remove') {
        tiles[i] = 0;
        burnTimer[i] = 0;
        oreMap[i] = 0;
        mountainHP[i] = 0;
        flowDepth[i] = 0;
        beings = beings.filter(function(u) {
          return Math.floor(u.x / TILE) !== tx || Math.floor(u.y / TILE) !==
            ty
        });
        builds = builds.filter(function(b) {
          return Math.floor(b.x / TILE) !== tx || Math.floor(b.y / TILE) !==
            ty
        });
        trees = trees.filter(function(t) {
          return Math.floor(t.x / TILE) !== tx || Math.floor(t.y / TILE) !==

        });
        rocks = rocks.filter(function(r) {
          return Math.floor(r.x / TILE) !== tx || Math.floor(r.y / TILE) !==
            ty
        });
        animals = animals.filter(function(a) {
          return Math.floor(a.x / TILE) !== tx || Math.floor(a.y / TILE) !==
            ty
        });
      } else if (activeTool === 'human') makeBeing(px, py, 'human', false, null,
        playerKingdomId || undefined);
      else if (activeTool === 'warrior') makeBeing(px, py, 'warrior', false,
        null, playerKingdomId || undefined);
      else if (activeTool === 'troll') makeBeing(px, py, 'troll', false, null,
        playerKingdomId || undefined);
      else if (activeTool === 'beast') makeBeing(px, py, 'beast', false, null);
      else if (activeTool === 'shadow') makeBeing(px, py, 'shadow', false,
        null);
      else if (activeTool === 'bolt') strikeBolt(px, py);
    }

    function paintTree(t) {
      var T = TREE_TYPES[t.type];
      var s = t.size,
        seed = t.seed;
      var sway = Math.sin(worldTime * 1.2 + t.sway) * 1.5;
      var shake = t.shake > 0 ? Math.sin(worldTime * 40) * t.shake * 6 : 0;
      var burning = t.burn > 0;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(t.x + s * 0.15, t.y + s * 0.35, s * 0.85, s * 0.32, 0, 0, Math
        .PI * 2);
      ctx.fill();
      var tw = s * 0.24,
        tx = t.x - tw / 2 + shake,
        ty = t.y - s * 0.5;
      var tg = ctx.createLinearGradient(tx, 0, tx + tw, 0);
      tg.addColorStop(0, burning ? '#2a1810' : T.trunk);
      tg.addColorStop(0.45, burning ? '#3a2010' : (t.type !== 'birch' ?
        shadeHex(T.trunk, 1.35) : T.trunk));
      tg.addColorStop(1, burning ? '#1a0e08' : shadeHex(T.trunk, 0.7));
      ctx.fillStyle = tg;
      ctx.fillRect(tx, ty, tw, s * 0.9);
      if (t.type === 'dead') {
        ctx.strokeStyle = burning ? '#3a2010' : T.trunk;
        ctx.lineWidth = Math.max(1.5, s * 0.09);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(t.x + shake, t.y - s * 0.3);
        ctx.lineTo(t.x - s * 0.45 + shake, t.y - s * 0.75);
        ctx.moveTo(t.x + shake, t.y - s * 0.5);
        ctx.lineTo(t.x + s * 0.38 + shake, t.y - s * 0.95);
        ctx.moveTo(t.x + shake, t.y - s * 0.6);
        ctx.lineTo(t.x - s * 0.28 + shake, t.y - s * 1.05);
        ctx.stroke();
        return;
      }
      if (t.type === 'pine') {
        for (var k = 0; k < 4; k++) {
          var ly = t.y - s * 0.35 - k * s * 0.42;
          var lw = s * (1.05 - k * 0.2);
          var base = burning ? '#2a1808' : (k === 0 ? T.c1 : T.c2);
          ctx.fillStyle = base;
          ctx.beginPath();
          ctx.moveTo(t.x + sway * k * 0.3 + shake, ly - s * 0.75);
          ctx.lineTo(t.x - lw + shake, ly);
          ctx.lineTo(t.x + lw + shake, ly);
          ctx.closePath();
          ctx.fill();
        }
      } else if (t.type === 'palm') {
        var topX = t.x + sway + shake,
          topY = t.y - s * 1.15;
        var bc = burning ? '#3a2a10' : T.c1;
        for (var k2 = 0; k2 < 7; k2++) {
          var ang = (k2 / 7) * Math.PI * 2 - Math.PI / 2 + Math.sin(worldTime +
            seed * 6) * 0.08;
          var lx = topX + Math.cos(ang) * s,
            ly2 = topY + Math.sin(ang) * s * 0.6;
          ctx.fillStyle = bc;
          ctx.beginPath();
          ctx.moveTo(topX, topY);
          ctx.quadraticCurveTo(topX + Math.cos(ang) * s * 0.55, topY + Math.sin(
            ang) * s * 0.55 - s * 0.3, lx, ly2);
          ctx.quadraticCurveTo(topX + Math.cos(ang) * s * 0.55, topY + Math.sin(
            ang) * s * 0.55 + s * 0.05, topX, topY);
          ctx.fill();
        }
      } else {
        var topX2 = t.x + sway * 0.5 + shake,
          topY2 = t.y - s * 1.05;
        var c1 = burning ? '#3a2a10' : T.c1,
          c2 = burning ? '#5a3a10' : T.c2;
        ctx.fillStyle = c1;
        ctx.beginPath();
        ctx.arc(topX2 - s * 0.3, topY2 + s * 0.1, s * 0.6, 0, Math.PI * 2);
        ctx.arc(topX2 + s * 0.32, topY2 + s * 0.12, s * 0.58, 0, Math.PI * 2);
        ctx.arc(topX2, topY2 - s * 0.2, s * 0.62, 0, Math.PI * 2);
        ctx.arc(topX2 - s * 0.05, topY2 + s * 0.35, s * 0.55, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = c2;
        ctx.beginPath();
        ctx.arc(topX2 - s * 0.18, topY2 + s * 0.02, s * 0.48, 0, Math.PI * 2);
        ctx.arc(topX2 + s * 0.22, topY2 + s * 0.05, s * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }
      if (burning) {
        var fl = Math.sin(worldTime * 10 + t.sway) * 0.3 + 0.7;
        ctx.globalAlpha = fl * 0.65;
        var fg = ctx.createRadialGradient(t.x, t.y - s * 0.8, 2, t.x, t.y - s *
          0.8, s * 1.3);
        fg.addColorStop(0, 'rgba(255,240,140,0.95)');
        fg.addColorStop(0.4, 'rgba(255,140,40,0.7)');
        fg.addColorStop(1, 'rgba(180,40,20,0)');
