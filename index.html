function startGame(sizeId,fromSave){
  try{

    if(!fromSave)delSave();
    selectedSize=sizeId;
    var sz=WORLD_SIZES.find(function(s){return s.id===sizeId})||WORLD_SIZES[1];
    COLS=sz.cols;ROWS=sz.rows;WORLD_W=COLS*TILE;WORLD_H=ROWS*TILE;
    tiles=new Uint8Array(COLS*ROWS);
    oreMap=new Uint8Array(COLS*ROWS);

    for(var i=0;i<decorSeed.length;i++)decorSeed[i]=Math.random();
    beings=[];builds=[];trees=[];rocks=[];sparks=[];hearts=[];bolts=[];
    wood={0:0,1:0};food={0:20,1:10};minerals={stone:0,iron:0,gold:0,diamond:0,emerald:0};
    raidTimer=RAID_INTERVAL;raidWave=0;raidNotifyT=0;

    var hu=mkBeing(cx2*TILE,cy2*TILE,'human',false,null);
    if(hu)hu.hunger=HUNGER_MAX;
    rView();zoom=1;panMode=false;
    camX=cl(WORLD_W/2-(cw/zoom)/2,0,Math.max(0,WORLD_W-cw/zoom));
    camY=cl(WORLD_H/2-(VIEW_H/zoom)/2,0,Math.max(0,WORLD_H-VIEW_H/zoom));

}

function generateWorld(){

  trees=[];rocks=[];
  var i1=Math.floor(Math.random()*BIOMES.length),i2=Math.floor(Math.random()*(BIOMES.length-1));if(i2>=i1)i2++;
  var b1=BIOMES[i1],b2=BIOMES[i2];currentBiome=b1.name+' · '+b2.name;

  // Озёра

  // Деревья

  for(var bi2=0;bi2<2;bi2++){var bb2=bi2===0?b1:b2;var n=Math.floor((bb2.id==='forestfloor'?110:bb2.id==='mountain'?70:bb2.id==='sandy'?40:55)*sc/2);for(var ti=0;ti<n;ti++){var tx=rI(2,COLS-3),ty=rI(2,ROWS-3);if(biomeMap[ty*COLS+tx]!==bi2)continue;var t=tiles[ty*COLS+tx];if(!((bb2.id==='sandy')?t===3:(t===0||t===3||t===8||t===9)))continue;var cl2=false;for(var tj=0;tj<trees.length;tj++){var o=trees[tj];if(Math.abs(o.x-(tx*TILE+TILE/2))<TILE*0.8&&Math.abs(o.y-(ty*TILE+TILE/2))<TILE*0.8){cl2=true;break}}if(cl2)continue;var kinds;if(bb2.id==='mountain')kinds=['pine','pine','pine','dead','birch'];else if(bb2.id==='sandy')kinds=['palm','palm','palm','palm','dead','oak'];else if(bb2.id==='forestfloor')kinds=['oak','oak','oak','oak','pine','birch'];else kinds=['birch','birch','birch','birch','oak'];addTree(tx,ty,pk(kinds))}}
  // Камни
  for(var ri=0;ri<2;ri++){var bb3=ri===0?b1:b2;var nR=Math.floor((bb3.id==='forestfloor'?45:bb3.id==='mountain'?15:bb3.id==='sandy'?9:3)*sc/2);spawnRocks(nR,ri)}
  addOcean();addBeaches();addOres();cleanTrees();

function spawnWildAnimals(){
  var area=COLS*ROWS,cnt=Math.floor(area*0.012);
  for(var i=0;i<cnt;i++){
    var tx=rI(2,COLS-3),ty=rI(2,ROWS-3),idx=ty*COLS+tx;
    if(idx<0||idx>=tiles.length)continue;
    var t=tiles[idx];
    var isF=t===8;
    if(!isF&&t!==0&&t!==3&&t!==9)continue;
    var kind;
    if(isF)kind=pk(['deer','deer','deer','rabbit','rabbit','boar','boar','beast']);
    else kind=pk(['rabbit','rabbit','deer','boar']);

  if(y<VIEW_H){var zb=hitZoom(x,y);
    if(zb==='plus'){var mx=cw/2,my=VIEW_H/2,bf=toWorld(mx,my);zoom=cl(zoom*1.3,MIN_ZOOM,MAX_ZOOM);var af=toWorld(mx,my);camX+=bf.x-af.x;camY+=bf.y-af.y;bCam();return}
    if(zb==='minus'){var mx2=cw/2,my2=VIEW_H/2,bf2=toWorld(mx2,my2);zoom=cl(zoom/1.3,MIN_ZOOM,MAX_ZOOM);var af2=toWorld(mx2,my2);camX+=bf2.x-af2.x;camY+=bf2.y-af2.y;bCam();return}}
  if(!hideBar&&y>=VIEW_H){var tab=hitTab(x,y);if(tab){activeTab=tab;ensureTool();return}var ii=hitTool(x,y);if(ii>=0){activeTool=getTools()[ii].id;return}return}
  if(panMode){var p=touches.get(id);if(p)p.pan=true}
  else{var w=toWorld(x,y);useTool(w.x,w.y);var p2=touches.get(id);if(p2)p2.draw=true}
}
function setupInput(){
  canvas.addEventListener('touchstart',function(e){
    if(appState!=='playing')return;e.preventDefault();
    var tcs=e.changedTouches;
    for(var i=0;i<tcs.length;i++){var t=tcs[i];touches.set(t.identifier,{x:t.clientX,y:t.clientY,sx:t.clientX,sy:t.clientY,pan:false,draw:false,moved:false})}
    if(touches.size===1){var t0=tcs[0];handleDown(t0.clientX,t0.clientY,t0.identifier)}
    else if(touches.size>=2){var arr=[];touches.forEach(function(v){arr.push(v)});pinchDist=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);pinchZoom=zoom;for(var k=0;k<arr.length;k++){arr[k].pan=false;arr[k].draw=false}}
  },{passive:false});
  canvas.addEventListener('touchmove',function(e){
    if(appState!=='playing')return;e.preventDefault();
    var tcs=e.changedTouches;
    for(var i=0;i<tcs.length;i++){
      var t=tcs[i];if(!touches.has(t.identifier))continue;
      var p=touches.get(t.identifier);var dx=t.clientX-p.x,dy=t.clientY-p.y;p.x=t.clientX;p.y=t.clientY;
      if(!p.moved&&Math.hypot(t.clientX-p.sx,t.clientY-p.sy)>8)p.moved=true;
      if(p.pan){camX-=dx/zoom;camY-=dy/zoom;bCam()}
    }
    if(touches.size>=2){
      var arr=[];touches.forEach(function(v){arr.push(v)});
      var d=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);
      if(pinchDist>0){var mx=(arr[0].x+arr[1].x)/2,my=(arr[0].y+arr[1].y)/2,bf=toWorld(mx,my);zoom=cl(pinchZoom*(d/pinchDist),MIN_ZOOM,MAX_ZOOM);var af=toWorld(mx,my);camX+=bf.x-af.x;camY+=bf.y-af.y;bCam()}
    }
    else if(touches.size===1){
      var t0=tcs[0];var p2=touches.get(t0.identifier);
      if(p2&&p2.draw&&t0.clientY<VIEW_H){var w=toWorld(t0.clientX,t0.clientY);useTool(w.x,w.y)}
    }
  },{passive:false});
  canvas.addEventListener('touchend',function(e){
    if(appState!=='playing')return;e.preventDefault();
    var tcs=e.changedTouches;
    for(var i=0;i<tcs.length;i++){
      var t=tcs[i];var p=touches.get(t.identifier);
      if(p&&!p.moved&&p.pan){if(hideBar||t.clientY<VIEW_H){var w=toWorld(p.x,p.y);inspected=findObj(w.x,w.y)}}
      touches.delete(t.identifier)
    }
    if(touches.size===0)pinchDist=0;
    else if(touches.size===1){var arr=[];touches.forEach(function(v){arr.push(v)});arr[0].pan=panMode;arr[0].draw=!panMode;pinchDist=0;pinchZoom=zoom}
  },{passive:false});
  canvas.addEventListener('touchcancel',function(e){touches.clear();pinchDist=0});
  var mDown=false,mLastX=0,mLastY=0,mSX=0,mSY=0;
  canvas.addEventListener('mousedown',function(e){
    if(appState!=='playing')return;mDown=true;mLastX=e.clientX;mLastY=e.clientY;mSX=e.clientX;mSY=e.clientY;
    touches.set('m',{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,pan:false,draw:false,moved:false});
    handleDown(e.clientX,e.clientY,'m')
  });
  document.addEventListener('mousemove',function(e){
    if(!mDown||appState!=='playing')return;
    var p=touches.get('m');if(!p)return;
    var dx=e.clientX-mLastX,dy=e.clientY-mLastY;mLastX=e.clientX;mLastY=e.clientY;p.x=e.clientX;p.y=e.clientY;
    if(!p.moved&&Math.hypot(e.clientX-mSX,e.clientY-mSY)>8)p.moved=true;
    if(panMode){camX-=dx/zoom;camY-=dy/zoom;bCam()}
    else if(e.clientY<VIEW_H){var w=toWorld(e.clientX,e.clientY);useTool(w.x,w.y)}
  });
  document.addEventListener('mouseup',function(e){
    if(!mDown)return;mDown=false;
    var p=touches.get('m');
    if(p&&!p.moved&&panMode&&(hideBar||e.clientY<VIEW_H)){var w=toWorld(p.x,p.y);inspected=findObj(w.x,w.y)}
    touches.delete('m')
  });
  document.addEventListener('contextmenu',function(e){e.preventDefault()});
  document.addEventListener('wheel',function(e){
    if(appState!=='playing')return;e.preventDefault();
    var bf=toWorld(e.clientX,e.clientY);zoom=cl(zoom*(e.deltaY>0?0.9:1.1),MIN_ZOOM,MAX_ZOOM);var af=toWorld(e.clientX,e.clientY);camX+=bf.x-af.x;camY+=bf.y-af.y;bCam()
  },{passive:false});
}

// ═══ LOOP ═══
var lastT=0,loopErrCount=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=(t-lastT)/1000;lastT=t;if(dt>0.05)dt=0.05;
  worldTime+=dt;
  if(saveFlash>0)saveFlash-=dt;
  try{
    ctx.setTransform(DPR,0,0,DPR,0,0);
    if(appState!=='playing'){ctx.clearRect(0,0,cw,ch);return}
    playTime+=dt;cyclePhase=(cyclePhase+dt/DAY_LENGTH)%1;
    if(worldTime-lastAutoSave>AUTOSAVE){if(saveW())saveFlash=0.5;lastAutoSave=worldTime}
    if(flashT>0)flashT-=dt;
    tickBeings(dt);tickBuilds(dt);tickTrees(dt);tickFire(dt);tickFlow(dt);tickSparks(dt);tickHearts(dt);tickBolts(dt);tickRaids(dt);
    renderWorld();paintUI();
  }catch(e){
    if(loopErrCount<3){logErr('loop: '+e.message);loopErrCount++}
  }
}

function initCanvas(){
  DPR=Math.min(window.devicePixelRatio||1,3);
  cw=window.innerWidth;ch=window.innerHeight;
  canvas.width=Math.floor(cw*DPR);canvas.height=Math.floor(ch*DPR);
  canvas.style.width=cw+'px';canvas.style.height=ch+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled=true;
  rView();
}

// ═══ BOOT ═══
initCanvas();
preTiles();
setupInput();
window.addEventListener('resize',function(){initCanvas();camX=cl(camX,0,Math.max(0,WORLD_W-cw/zoom));camY=cl(camY,0,Math.max(0,WORLD_H-VIEW_H/zoom))});
window.addEventListener('orientationchange',function(){setTimeout(initCanvas,100)});

if(checkCL()){showScreen('changelog-screen')}
else{showScreen('settings-screen');refreshSettingsUI()}

requestAnimationFrame(loop);
</script></body></html>
