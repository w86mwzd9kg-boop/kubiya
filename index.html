    if(hitContinueButton(t.clientX,t.clientY)){loadWorld();return;}
    var sizeId=hitSizeCard(t.clientX,t.clientY);
    if(sizeId){selectedSize=sizeId;return;}
    if(hitCreateButton(t.clientX,t.clientY)){showKingdomPick(selectedSize);return;}
    return;
  }
  if(appState==='kingdomPick'){
    var k=hitKingdomPick(t.clientX,t.clientY);
    if(k)startGameWithKingdom(k);
    return;
  }
  if(hitInspectClose(t.clientX,t.clientY)){inspected=null;return;}
  touches.set(t.identifier,{x:t.clientX,y:t.clientY,startX:t.clientX,startY:t.clientY,pan:false,draw:false,moved:false});
  if(touches.size===1){
    var tb=hitTopButton(t.clientX,t.clientY);
    if(tb==='panel'){hideBar=!hideBar;recalcView();return;}
    if(tb==='mode'){panMode=!panMode;return;}
    if(tb==='save'){if(saveWorld())saveFlash=0.5;return;}
    if(tb==='history'){openHistory();return;}
    if(tb==='settings'){saveWorld();appState='settings';return;}
    if(!hideBar&&t.clientY>=VIEW_H){
      var tab=hitTab(t.clientX,t.clientY);
      if(tab){activeTab=tab;ensureToolValid();if(activeTool!=='war'&&activeTool!=='ally')warSelected=null;return;}
      var i=hitToolButton(t.clientX,t.clientY);
      if(i>=0){activeTool=getTools()[i].id;if(activeTool!=='war'&&activeTool!=='ally')warSelected=null;return;}
      return;
    }
    if(panMode)touches.get(t.identifier).pan=true;
    else{var w=toWorld(t.clientX,t.clientY);useTool(w.x,w.y);touches.get(t.identifier).draw=true;}
  }else if(touches.size===2){
    for(var info of touches.values()){info.pan=false;info.draw=false;}
    var arr=Array.from(touches.values());
    pinchDist=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);
    pinchZoom=zoom;
  }
}
function onMove(t){
  if(changelogVisible){changelogMove(t);return;}
  if(appState!=='playing'||gameOver)return;
  if(!touches.has(t.identifier))return;
  var p=touches.get(t.identifier);
  var dx=t.clientX-p.x,dy=t.clientY-p.y;
  p.x=t.clientX;p.y=t.clientY;
  if(!p.moved&&Math.hypot(t.clientX-p.startX,t.clientY-p.startY)>8)p.moved=true;
  if(touches.size===1){
    if(p.pan){camX-=dx/zoom;camY-=dy/zoom;boundCamera();}
    else if(p.draw&&t.clientY<VIEW_H){
      if(activeTool==='war'||activeTool==='ally')return;
      var w=toWorld(t.clientX,t.clientY);useTool(w.x,w.y);
    }
  }else if(touches.size>=2){
    var arr=Array.from(touches.values());
    camX-=dx/zoom;camY-=dy/zoom;
    var d=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);
    if(pinchDist>0){
      var mx=(arr[0].x+arr[1].x)/2,my=(arr[0].y+arr[1].y)/2;
      var before=toWorld(mx,my);
      zoom=cl(pinchZoom*(d/pinchDist),MIN_ZOOM,MAX_ZOOM);
      var after=toWorld(mx,my);
      camX+=before.x-after.x;camY+=before.y-after.y;
    }
    boundCamera();
  }
}
function onEnd(t){
  if(changelogVisible){changelogEnd(t);return;}
  var p=touches.get(t.identifier);
  if(p&&!p.moved&&appState==='playing'&&p.pan){
    if(hideBar||t.clientY<VIEW_H){var w=toWorld(p.x,p.y);inspected=findObjectAt(w.x,w.y);}
  }
  if(p&&!p.moved&&appState==='playing'&&!p.pan&&t.clientY<VIEW_H&&(activeTool==='war'||activeTool==='ally')){
    var w2=toWorld(p.x,p.y);useTool(w2.x,w2.y);
  }
  touches.delete(t.identifier);
  if(touches.size===0)pinchDist=0;
  else if(touches.size===1){
    var info=Array.from(touches.values())[0];
    info.pan=panMode;info.draw=!panMode;pinchDist=0;pinchZoom=zoom;
  }
}

function setupInput(){
  document.addEventListener('touchstart',function(e){
    e.preventDefault();
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i];
      if(handleSpecialClick(t.clientX,t.clientY)){e.stopPropagation();continue;}
      onStart(t);
    }
  },{passive:false});
  document.addEventListener('touchmove',function(e){
    e.preventDefault();
    for(var i=0;i<e.changedTouches.length;i++)onMove(e.changedTouches[i]);
  },{passive:false});
  document.addEventListener('touchend',function(e){
    e.preventDefault();
    for(var i=0;i<e.changedTouches.length;i++)onEnd(e.changedTouches[i]);
  },{passive:false});
  document.addEventListener('touchcancel',function(e){
    for(var i=0;i<e.changedTouches.length;i++)onEnd(e.changedTouches[i]);
  });
  var mDown=false,lastX=0,lastY=0,mStartX=0,mStartY=0;
  document.addEventListener('mousedown',function(e){
    if(changelogVisible){if(hitChangelogClose(e.clientX,e.clientY))closeHistory();return;}
    if(handleSpecialClick(e.clientX,e.clientY)){e.stopPropagation();e.preventDefault();return;}
    if(appState==='settings'){
      if(hitContinueButton(e.clientX,e.clientY)){loadWorld();return;}
      var sizeId=hitSizeCard(e.clientX,e.clientY);
      if(sizeId){selectedSize=sizeId;return;}
      if(hitCreateButton(e.clientX,e.clientY)){showKingdomPick(selectedSize);return;}
      return;
    }
    if(appState==='kingdomPick'){
      var k=hitKingdomPick(e.clientX,e.clientY);
      if(k)startGameWithKingdom(k);
      return;
    }
    if(hitInspectClose(e.clientX,e.clientY)){inspected=null;return;}
    mDown=true;lastX=e.clientX;lastY=e.clientY;mStartX=e.clientX;mStartY=e.clientY;
    var tb=hitTopButton(e.clientX,e.clientY);
    if(tb==='panel'){hideBar=!hideBar;recalcView();return;}
    if(tb==='mode'){panMode=!panMode;return;}
    if(tb==='save'){if(saveWorld())saveFlash=0.5;return;}
    if(tb==='history'){openHistory();return;}
    if(tb==='settings'){saveWorld();appState='settings';return;}
    if(!hideBar&&e.clientY>=VIEW_H){
      var tab=hitTab(e.clientX,e.clientY);
      if(tab){activeTab=tab;ensureToolValid();if(activeTool!=='war'&&activeTool!=='ally')warSelected=null;return;}
      var i=hitToolButton(e.clientX,e.clientY);
      if(i>=0){activeTool=getTools()[i].id;if(activeTool!=='war'&&activeTool!=='ally')warSelected=null;return;}
      return;
    }
    if(!panMode&&e.clientY<VIEW_H){var w=toWorld(e.clientX,e.clientY);useTool(w.x,w.y);}
  });
  document.addEventListener('mousemove',function(e){
    if(changelogVisible)return;
    if(appState!=='playing'||!mDown||gameOver)return;
    var dx=e.clientX-lastX,dy=e.clientY-lastY;
    lastX=e.clientX;lastY=e.clientY;
    if(e.buttons===4||panMode){camX-=dx/zoom;camY-=dy/zoom;boundCamera();}
    else if(!panMode&&e.clientY<VIEW_H&&activeTool!=='war'&&activeTool!=='ally'){
      var w=toWorld(e.clientX,e.clientY);useTool(w.x,w.y);
    }
  });
  document.addEventListener('mouseup',function(e){
    if(mDown&&appState==='playing'&&panMode&&!gameOver){
      var moved=Math.hypot(e.clientX-mStartX,e.clientY-mStartY)>8;
      if(!moved&&(hideBar||e.clientY<VIEW_H)){var w=toWorld(e.clientX,e.clientY);inspected=findObjectAt(w.x,w.y);}
    }
    if(mDown&&appState==='playing'&&!panMode&&(activeTool==='war'||activeTool==='ally')){
      var moved2=Math.hypot(e.clientX-mStartX,e.clientY-mStartY)>8;
      if(!moved2&&e.clientY<VIEW_H){var w2=toWorld(e.clientX,e.clientY);useTool(w2.x,w2.y);}
    }
    mDown=false;
  });
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('wheel',function(e){
    if(changelogVisible){e.preventDefault();changelogScroll=cl(changelogScroll+(e.deltaY>0?40:-40),0,changelogScrollMax);return;}
    if(appState!=='playing'||gameOver)return;
    e.preventDefault();
    var before=toWorld(e.clientX,e.clientY);
    zoom=cl(zoom*(e.deltaY>0?0.9:1.1),MIN_ZOOM,MAX_ZOOM);
    var after=toWorld(e.clientX,e.clientY);
    camX+=before.x-after.x;camY+=before.y-after.y;boundCamera();
  },{passive:false});
  document.addEventListener('visibilitychange',function(){if(document.hidden&&appState==='playing')saveWorld();});
  window.addEventListener('beforeunload',function(){if(appState==='playing')saveWorld();});
  function unlockMusic(){
    RelaxMus.styleId=getMusicStyle();
    if(RelaxMus.styleId==='off')return;
    RelaxMus.init();
    RelaxMus.start();
    document.removeEventListener('touchstart',unlockMusic);
    document.removeEventListener('mousedown',unlockMusic);
    document.removeEventListener('keydown',unlockMusic);
  }
  document.addEventListener('touchstart',unlockMusic,{passive:true});
  document.addEventListener('mousedown',unlockMusic);
  document.addEventListener('keydown',unlockMusic);
}

// ═══ INIT / LOOP ═══
var lastTime=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastTime)lastTime=t;
  var dt=(t-lastTime)/1000;
  lastTime=t;
  if(dt>0.05)dt=0.05;
  worldTime+=dt;
  if(saveFlash>0)saveFlash-=dt;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(showMusicPicker){renderMusicPicker();if(splashVisible)renderSplash();return;}
  if(showFullSettings){renderFullSettings();if(splashVisible)renderSplash();return;}
  if(showPauseMenu){renderPauseMenu();if(splashVisible)renderSplash();return;}
  if(gameOver){renderGameOver();if(splashVisible)renderSplash();return;}
  if(changelogVisible){
    if(appState==='settings')renderSettings();
    else if(appState==='kingdomPick')renderKingdomPick();
    else{
      playTime+=dt;cyclePhase=(cyclePhase+dt/DAY_LENGTH)%1;
      var saveInterval=(selectedSize==='empire')?4:AUTO_SAVE_INTERVAL;
      if(worldTime-lastAutoSave>saveInterval){if(saveWorld())saveFlash=0.5;lastAutoSave=worldTime;}
      if(flashT>0)flashT-=dt;
      tickBeings(dt);tickBuilds(dt);tickTrees(dt);tickFire(dt);
      tickFlow(dt);tickSparks(dt);tickHearts(dt);tickBolts(dt);tickAnimals(dt);
      renderWorld();paintUI();
    }
    renderChangelog();
    if(splashVisible)renderSplash();
    return;
  }
  if(paused&&appState==='playing'){renderPauseMenu();if(splashVisible)renderSplash();return;}
  if(appState==='settings'){renderSettings();}
  else if(appState==='kingdomPick'){renderKingdomPick();}
  else{
    playTime+=dt;cyclePhase=(cyclePhase+dt/DAY_LENGTH)%1;
    var saveInterval2=(selectedSize==='empire')?4:AUTO_SAVE_INTERVAL;
    if(worldTime-lastAutoSave>saveInterval2){if(saveWorld())saveFlash=0.5;lastAutoSave=worldTime;}
    if(flashT>0)flashT-=dt;
    tickBeings(dt);tickBuilds(dt);tickTrees(dt);tickFire(dt);
    tickFlow(dt);tickSparks(dt);tickHearts(dt);tickBolts(dt);tickAnimals(dt);
    renderWorld();paintUI();
  }
  if(splashVisible)renderSplash();
}
function detectSafeAreas(){
  try{
    var d=document.createElement('div');
    d.style.cssText='position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
    document.body.appendChild(d);
    var cs=getComputedStyle(d);
    SAFE_TOP=parseInt(cs.paddingTop)||0;
    SAFE_BOTTOM=parseInt(cs.paddingBottom)||0;
    document.body.removeChild(d);
  }catch(e){SAFE_TOP=0;SAFE_BOTTOM=0;}
}
function initCanvas(){
  detectSafeAreas();
  DPR=Math.min(window.devicePixelRatio||1,3);
  cw=window.innerWidth||document.documentElement.clientWidth||360;
  var h=window.innerHeight||document.documentElement.clientHeight||640;
  ch=h-SAFE_TOP-SAFE_BOTTOM;
  if(ch<200)ch=h;
  if(cw<50)cw=360;
  if(ch<50)ch=640;
  canvas.width=Math.floor(cw*DPR);
  canvas.height=Math.floor(ch*DPR);
  canvas.style.width=cw+'px';
  canvas.style.height=ch+'px';
  canvas.style.top=SAFE_TOP+'px';
  canvas.style.left='0';
  canvas.style.position='absolute';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled=true;
  recalcView();
  if(!tileCache.grass)prerenderTiles();
}
window.addEventListener('error',function(ev){
  try{
    var el=document.getElementById('__err__');
    if(!el){
      el=document.createElement('div');
      el.id='__err__';
      el.style.cssText='position:fixed;bottom:0;left:0;right:0;background:rgba(160,20,20,0.92);color:#fff;font:11px monospace;padding:6px 8px;z-index:99999;max-height:35vh;overflow:auto;white-space:pre-wrap;pointer-events:none';
      document.body.appendChild(el);
    }
    el.textContent+='⚠ '+(ev.message||ev.error)+'\n';
  }catch(e){}
});

initCanvas();
setupInput();
checkChangelog();
RelaxMus.styleId=getMusicStyle();
window.addEventListener('resize',function(){setTimeout(function(){initCanvas();boundCamera();},50);});
window.addEventListener('orientationchange',function(){setTimeout(function(){initCanvas();boundCamera();},200);});
requestAnimationFrame(loop);

try{document.title='Кубия 3.6';}catch(e){}
