const cl=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a);
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function toWorld(sx,sy){return{x:camX+sx/zoom,y:camY+sy/zoom};}
function boundCamera(){const vw=cw/zoom,vh=VIEW_H/zoom;camX=cl(camX,0,Math.max(0,WORLD_W-vw));camY=cl(camY,0,Math.max(0,WORLD_H-vh));}
function recalcView(){UIH=Math.max(180,Math.min(220,ch*.28));VIEW_H=hideBar?ch:ch-UIH;boundCamera();}
function randInt(min,max){return Math.floor(rnd(min,max+1));}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function sRand(seed,i){const x=Math.sin(seed*12.9898+i*78.233)*43758.5453;return x-Math.floor(x);}
function shadeHex(hex,factor){const n=parseInt(hex.slice(1),16);let r=(n>>16)&0xff,g=(n>>8)&0xff,b=n&0xff;r=Math.min(255,Math.max(0,Math.round(r*factor)));g=Math.min(255,Math.max(0,Math.round(g*factor)));b=Math.min(255,Math.max(0,Math.round(b*factor)));return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}

const TILE_SS=3,WATER_FRAMES=12,LAVA_FRAMES=12;let tileCache={};
function makeTileCanvas(size,drawFn){const c=document.createElement('canvas');c.width=size;c.height=size;drawFn(c.getContext('2d'),size);return c;}
function drawGrassTexture(c,s,seed){
const g=c.createLinearGradient(0,0,0,s);g.addColorStop(0,'#5fc054');g.addColorStop(.5,'#52b048');g.addColorStop(1,'#469438');c.fillStyle=g;c.fillRect(0,0,s,s);
for(let i=0;i<7;i++){const x=sRand(seed,i*7)*s,y=sRand(seed,i*7+1)*s,r=s*(.06+sRand(seed,i*7+2)*.14),a=.05+sRand(seed,i*7+3)*.10;c.fillStyle='rgba(90,65,35,'+a+')';c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();}
for(let i=0;i<10;i++){const x=sRand(seed,i*11+50)*s,y=sRand(seed,i*11+51)*s,r=s*(.05+sRand(seed,i*11+52)*.13);c.fillStyle='rgba(45,120,45,'+(.15+sRand(seed,i*11+53)*.12)+')';c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();}
const blades=55+Math.floor(sRand(seed,1)*35),greens=['#7ade68','#6cce58','#5abe48','#4aae38','#8ae878','#3a9e2e','#96e878'];c.lineCap='round';
for(let i=0;i<blades;i++){const x=sRand(seed,i*13+2)*s,y=sRand(seed,i*13+3)*s,h=s*(.05+sRand(seed,i*13+4)*.10),lean=(sRand(seed,i*13+5)-.5)*s*.06;c.strokeStyle=greens[i%greens.length];c.lineWidth=s*(.012+sRand(seed,i*13+6)*.008);c.beginPath();c.moveTo(x,y+h);c.quadraticCurveTo(x+lean*.4,y+h*.5,x+lean,y);c.stroke();}
}
function drawForestFloorTexture(c,s,seed){
const g=c.createLinearGradient(0,0,s,s);g.addColorStop(0,'#3e5a2e');g.addColorStop(.5,'#2e4a20');g.addColorStop(1,'#223818');c.fillStyle=g;c.fillRect(0,0,s,s);
for(let i=0;i<28;i++){const x=sRand(seed,i*5+11)*s,y=sRand(seed,i*5+12)*s,w=s*(.08+sRand(seed,i*5+13)*.14),h=s*(.02+sRand(seed,i*5+14)*.03),a=sRand(seed,i*5+15)*Math.PI;c.save();c.translate(x,y);c.rotate(a);const leafCols=['#8a5a2a','#a8732a','#6a4a20','#b8862a','#5a3a18','#c8983a'];c.fillStyle=leafCols[i%6];c.globalAlpha=.55+sRand(seed,i*5+16)*.35;c.beginPath();c.ellipse(0,0,w,h,0,0,Math.PI*2);c.fill();c.restore();}
c.globalAlpha=1;
for(let i=0;i<50;i++){const x=sRand(seed,i*3+60)*s,y=sRand(seed,i*3+61)*s,sz=s*(.01+sRand(seed,i*3+62)*.02);c.fillStyle=sRand(seed,i*3+63)>.5?'rgba(90,70,45,0.7)':'rgba(30,50,20,0.6)';c.fillRect(x,y,sz,sz);}
}
function drawSnowTexture(c,s,seed){
const g=c.createRadialGradient(s*.4,s*.35,s*.1,s*.5,s*.5,s*.9);g.addColorStop(0,'#f8fcff');g.addColorStop(.5,'#e0ecf5');g.addColorStop(1,'#bdd0e0');c.fillStyle=g;c.fillRect(0,0,s,s);
for(let i=0;i<35;i++){const x=sRand(seed,i*3+5)*s,y=sRand(seed,i*3+6)*s,r=s*(.02+sRand(seed,i*3+7)*.05);c.fillStyle='rgba(255,255,255,'+(.3+sRand(seed,i*3+8)*.55)+')';c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();}
for(let i=0;i<20;i++){const x=sRand(seed,i*4+80)*s,y=sRand(seed,i*4+81)*s,sz=s*(.008+sRand(seed,i*4+82)*.014);c.fillStyle='rgba(255,255,255,0.98)';c.fillRect(x,y,sz,sz);}
}
function drawSandTexture(c,s,seed){
const g=c.createLinearGradient(0,0,s,s);g.addColorStop(0,'#e0c486');g.addColorStop(.4,'#d4b678');g.addColorStop(.7,'#c4a868');g.addColorStop(1,'#b49860');c.fillStyle=g;c.fillRect(0,0,s,s);
for(let i=0;i<150;i++){const x=sRand(seed,i*3+10)*s,y=sRand(seed,i*3+11)*s,shade=sRand(seed,i*3+12),sz=s*(.008+sRand(seed,i*3+13)*.008);if(shade>.65)c.fillStyle='rgba(255,245,215,0.7)';else if(shade>.35)c.fillStyle='rgba(200,170,110,0.5)';else c.fillStyle='rgba(140,110,65,0.45)';c.fillRect(x,y,sz,sz);}
}
function drawWaterTexture(c,s,frame){
const t=frame/WATER_FRAMES*Math.PI*2;const g=c.createLinearGradient(0,0,s,s);g.addColorStop(0,'#2864a8');g.addColorStop(.4,'#2260a4');g.addColorStop(.7,'#1c5290');g.addColorStop(1,'#164278');c.fillStyle=g;c.fillRect(0,0,s,s);
const waves=[{f:1,a:.055,al:.42,tk:.022,p:0},{f:2,a:.045,al:.32,tk:.018,p:1.2}];c.lineCap='round';
for(const w of waves){c.strokeStyle='rgba(215,235,255,'+w.al+')';c.lineWidth=s*w.tk;c.beginPath();for(let px=0;px<=s;px+=2){const nx=px/s,y=s*.5+Math.sin(2*Math.PI*w.f*nx+t*1.5+w.p)*s*w.a;if(px===0)c.moveTo(px,y);else c.lineTo(px,y);}c.stroke();}
}
function drawLavaTexture(c,s,frame){
const t=frame/LAVA_FRAMES*Math.PI*2;const g=c.createRadialGradient(s*.5,s*.5,0,s*.5,s*.5,s*.8);g.addColorStop(0,'#2a0808');g.addColorStop(.6,'#1a0505');g.addColorStop(1,'#0e0202');c.fillStyle=g;c.fillRect(0,0,s,s);
for(let i=0;i<4;i++){const seed=i*2.1,yBase=((i*.27+.15)%1)*s,segs=20;c.lineCap='round';for(let k=0;k<segs;k++){const p1x=(k/segs)*s,p1y=yBase+Math.sin(2*Math.PI*((k/segs)*1.5+t*.5+seed))*s*.18,p2x=((k+1)/segs)*s,p2y=yBase+Math.sin(2*Math.PI*(((k+1)/segs)*1.5+t*.5+seed))*s*.18,pulse=.7+Math.sin(t*2+i*1.3+k*.3)*.3;c.strokeStyle='rgba(255,80,10,'+(.35*pulse)+')';c.lineWidth=s*.06;c.beginPath();c.moveTo(p1x,p1y);c.lineTo(p2x,p2y);c.stroke();c.strokeStyle='rgba(255,140,30,'+(.85*pulse)+')';c.lineWidth=s*.03;c.beginPath();c.moveTo(p1x,p1y);c.lineTo(p2x,p2y);c.stroke();c.strokeStyle='rgba(255,240,150,'+(.95*pulse)+')';c.lineWidth=s*.012;c.beginPath();c.moveTo(p1x,p1y);c.lineTo(p2x,p2y);c.stroke();}}}
function drawBurntTexture(c,s,seed){
const g=c.createLinearGradient(0,0,0,s);g.addColorStop(0,'#3a2a24');g.addColorStop(.5,'#2a1e18');g.addColorStop(1,'#1a120e');c.fillStyle=g;c.fillRect(0,0,s,s);
for(let i=0;i<40;i++){const x=sRand(seed,i*3)*s,y=sRand(seed,i*3+1)*s,r=s*(.015+sRand(seed,i*3+2)*.03),v=sRand(seed,i*3+3);c.fillStyle=v>.7?'rgba(20,15,12,0.9)':v>.3?'rgba(60,45,38,0.7)':'rgba(90,70,58,0.5)';c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();}}
function prerenderTiles(){
const S=TILE*TILE_SS,V=6;
tileCache.grass=[];for(let v=0;v<V;v++)tileCache.grass.push(makeTileCanvas(S,function(c,s){drawGrassTexture(c,s,v*13+1);}));
tileCache.forestfloor=[];for(let v=0;v<V;v++)tileCache.forestfloor.push(makeTileCanvas(S,function(c,s){drawForestFloorTexture(c,s,v*13+7);}));
tileCache.snow=[];for(let v=0;v<V;v++)tileCache.snow.push(makeTileCanvas(S,function(c,s){drawSnowTexture(c,s,v*17+5);}));
tileCache.sand=[];for(let v=0;v<V;v++)tileCache.sand.push(makeTileCanvas(S,function(c,s){drawSandTexture(c,s,v*17+3);}));
tileCache.burnt=[];for(let v=0;v<4;v++)tileCache.burnt.push(makeTileCanvas(S,function(c,s){drawBurntTexture(c,s,v*23+7);}));
tileCache.water=[];for(let f=0;f<WATER_FRAMES;f++)tileCache.water.push(makeTileCanvas(S,function(c,s){drawWaterTexture(c,s,f);}));
tileCache.lava=[];for(let f=0;f<LAVA_FRAMES;f++)tileCache.lava.push(makeTileCanvas(S,function(c,s){drawLavaTexture(c,s,f);}));
}
function getStorageCapacity(clan){let cap=Object.assign({},BASE_STORAGE);for(const b of builds){if(b.clan!==clan||b.type!=='warehouse')continue;const wCap=WAREHOUSE_CAPACITY[b.level-1];for(const k in wCap)cap[k]=(cap[k]||0)+wCap[k];}return cap;}
function canAfford(clan,cost){if(cost.wood&&(wood[clan]||0)<cost.wood)return false;if(cost.stone&&minerals.stone<cost.stone)return false;if(cost.iron&&minerals.iron<cost.iron)return false;if(cost.gold&&minerals.gold<cost.gold)return false;return true;}
function payCost(clan,cost){if(cost.wood)wood[clan]=(wood[clan]||0)-cost.wood;if(cost.stone)minerals.stone-=cost.stone;if(cost.iron)minerals.iron-=cost.iron;if(cost.gold)minerals.gold-=cost.gold;}

function carveLake(cx,cy,radius){
const r=Math.ceil(radius),seedOffset=Math.random()*100;
// Создаём чашу: сначала углубление с песком, потом вода
for(let dy=-r-1;dy<=r+1;dy++)for(let dx=-r-1;dx<=r+1;dx++){
const nx=Math.floor(cx+dx),ny=Math.floor(cy+dy);
if(nx<0||nx>=COLS||ny<0||ny>=ROWS)continue;
const d=Math.hypot(dx,dy);
const wobble=Math.sin((dx+seedOffset)*.7)*.5+Math.cos((dy+seedOffset*1.3)*.6)*.5;
const edge=r+wobble;
if(d<edge){
const idx=ny*COLS+nx;
// Углубление всегда вода
tiles[idx]=1;flowDepth[idx]=MAX_FLOW; // помечаем как "стабильную" воду
}
else if(d<edge+1.5){
const idx=ny*COLS+nx;
if(tiles[idx]!==1)tiles[idx]=3; // берег из песка
}
}
}

function addOceanBorder(){
const edgeMin=Math.min(COLS,ROWS);const hardBorder=1;const softBorder=Math.max(3,Math.floor(edgeMin*0.05));

if(tiles[idx]===1)continue;

else if(activeTool==='troll'){makeBeing(px,py,'troll',false,null);}

function paintBuild(b){
const L=BUILD_LEVELS[b.type][b.level-1],fl=b.flash>0,isWarehouse=b.type==='warehouse';
const w=isWarehouse?L.w*1.1:TILE*2.2,h=isWarehouse?L.h*1.1:TILE*2.0;
const x=b.x-w/2,y=b.y-h/2;

sg.addColorStop(0,'rgba(0,0,0,0.5)');sg.addColorStop(1,'rgba(0,0,0,0)');
ctx.fillStyle=sg;ctx.beginPath();ctx.ellipse(b.x,b.y+h*.5,w,h*.5,0,0,Math.PI*2);ctx.fill();
const foundH=h*.14,foundY=y+h-foundH;
ctx.fillStyle=fl?'#fff':L.foundation;ctx.fillRect(x,foundY,w,foundH);
const wallTop=y+h*.18,wallH=foundY-wallTop;
ctx.fillStyle=fl?'#fff':L.wallColor;ctx.fillRect(x,wallTop,w,wallH);
const doorW=isWarehouse?w*.42:w*.26,doorH=isWarehouse?h*.5:h*.38;
const doorX=b.x-doorW/2,doorY=foundY-doorH;
ctx.fillStyle=fl?'#fff':L.doorColor;ctx.fillRect(doorX,doorY,doorW,doorH);
const winPos=L.windows>=2?[[.12,.35],[.62,.35]]:[[.37,.35]];
for(const wp of winPos){

ctx.fillStyle=fl?'#fff':L.windowColor;ctx.fillRect(winX,winY,winW,winH);
}
const roofH=h*(.5+b.level*.08),roofOverhang=w*.15;
const roofBaseY=wallTop+3,roofLeft=x-roofOverhang,roofRight=x+w+roofOverhang,roofTipX=b.x;
const actualRoofH=isWarehouse?roofH*.7:roofH,actualTipY=y-actualRoofH+3;
ctx.fillStyle=fl?'#fff':L.roofColor;
ctx.beginPath();ctx.moveTo(roofTipX,actualTipY);ctx.lineTo(roofLeft,roofBaseY);ctx.lineTo(roofRight,roofBaseY);ctx.closePath();ctx.fill();
ctx.fillStyle=fl?'#ddd':L.roofDark;
ctx.beginPath();ctx.moveTo(roofTipX,actualTipY);ctx.lineTo(roofTipX,roofBaseY);ctx.lineTo(roofRight,roofBaseY);ctx.closePath();ctx.fill();
if(b.hp<b.maxHp){
const bw=w,bh=3,by=y-actualRoofH-8;
ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(x-1,by-1,bw+2,bh+2);

}
}

ctx.strokeStyle='#8aff8a';ctx.lineWidth=2.5;roundRect(contX,contY,contW,contH,18);ctx.stroke();
ctx.font='bold 22px -apple-system,sans-serif';ctx.fillStyle='#fff';
ctx.fillText('▶  Продолжить игру',cw/2,contY+30);
const mins=Math.floor((saveInfo.playTime||0)/60),date=new Date(saveInfo.savedAt);
const dd=String(date.getDate()).padStart(2,'0'),mm=String(date.getMonth()+1).padStart(2,'0');
const hh=String(date.getHours()).padStart(2,'0'),min=String(date.getMinutes()).padStart(2,'0');
ctx.font='bold 11px -apple-system,sans-serif';ctx.fillStyle='rgba(255,255,255,0.85)';
ctx.fillText((saveInfo.biome||'—')+'  •  👥'+saveInfo.beings+'  🏠'+saveInfo.builds+'  🌳'+saveInfo.trees,cw/2,contY+57);
ctx.fillText(dd+'.'+mm+' '+hh+':'+min+'  •  играл '+mins+' мин',cw/2,contY+75);
labelY=contY+contH+40;
}
ctx.font='bold 16px -apple-system,sans-serif';
const titleGrad=ctx.createLinearGradient(cw/2-120,0,cw/2+120,0);
titleGrad.addColorStop(0,'#ffe14a');titleGrad.addColorStop(.5,'#fff7c0');titleGrad.addColorStop(1,'#ffe14a');
ctx.fillStyle=titleGrad;
ctx.fillText('📐  Новый мир — выбери размер',cw/2,labelY);
const wide=cw>=720,cols=wide?4:2,rows=wide?1:2,cardGap=12,maxCardW=wide?160:180;
const cardW=Math.min(maxCardW,(cw-40-cardGap*(cols-1))/cols),cardH=130;
const gridW=cardW*cols+cardGap*(cols-1),gridX=(cw-gridW)/2,gridY=labelY+26;
for(let i=0;i<WORLD_SIZES.length;i++){
const sz=WORLD_SIZES[i],r=Math.floor(i/cols),c=i%cols;
const bx=gridX+c*(cardW+cardGap),by=gridY+r*(cardH+cardGap),sel=selectedSize===sz.id;
const floatOff=Math.sin(worldTime*1.5+i)*1.5,drawY=by+floatOff;
if(sel){
const cg=ctx.createLinearGradient(bx,drawY,bx+cardW,drawY+cardH);
cg.addColorStop(0,'rgba(150,110,230,0.95)');cg.addColorStop(1,'rgba(80,50,160,0.85)');
ctx.fillStyle=cg;
}else{
const cg=ctx.createLinearGradient(bx,drawY,bx+cardW,drawY+cardH);
cg.addColorStop(0,'rgba(70,50,120,0.5)');cg.addColorStop(1,'rgba(40,25,80,0.6)');
ctx.fillStyle=cg;
}
roundRect(bx,drawY,cardW,cardH,16);ctx.fill();
if(sel){
ctx.strokeStyle='#ffe14a';ctx.lineWidth=3;
ctx.shadowColor='#ffe14a';ctx.shadowBlur=15;
roundRect(bx,drawY,cardW,cardH,16);ctx.stroke();
ctx.shadowBlur=0;
}else{
ctx.strokeStyle='rgba(150,120,220,0.5)';ctx.lineWidth=1.5;
roundRect(bx,drawY,cardW,cardH,16);ctx.stroke();
}
ctx.font='36px -apple-system,sans-serif';ctx.fillStyle='#fff';
ctx.fillText(sz.ic,bx+cardW/2,drawY+34);
ctx.font='bold 15px -apple-system,sans-serif';
ctx.fillText(sz.name,bx+cardW/2,drawY+66);
ctx.font='bold 12px -apple-system,sans-serif';
ctx.fillStyle=sel?'#ffe14a':'rgba(200,180,255,0.75)';
ctx.fillText(sz.cols+' × '+sz.rows,bx+cardW/2,drawY+86);
ctx.font='10px -apple-system,sans-serif';
ctx.fillStyle='rgba(200,180,255,0.6)';
ctx.fillText(sz.desc,bx+cardW/2,drawY+104);
}
const infoY=gridY+rows*cardH+(rows-1)*cardGap+20;
const btnW=Math.min(280,cw-60),btnH=58,btnX=(cw-btnW)/2,btnY=infoY+10;
const bg=ctx.createLinearGradient(btnX,btnY,btnX,btnY+btnH);
bg.addColorStop(0,'#8a6cd9');bg.addColorStop(.5,'#7a5cc9');bg.addColorStop(1,'#5a3a9a');
ctx.fillStyle=bg;roundRect(btnX,btnY,btnW,btnH,18);ctx.fill();
ctx.strokeStyle='#ffe14a';ctx.lineWidth=2.5;roundRect(btnX,btnY,btnW,btnH,18);ctx.stroke();
ctx.font='bold 20px -apple-system,sans-serif';ctx.fillStyle='#fff';
ctx.fillText(saveInfo?'🌍  Начать заново':'🚀  Создать мир',cw/2,btnY+btnH/2+1);
if(hasSavedGame){
const rsW=Math.min(200,cw-80),rsH=40,rsX=(cw-rsW)/2,rsY=btnY+btnH+14;
ctx.fillStyle='rgba(200,60,60,0.25)';roundRect(rsX,rsY,rsW,rsH,12);ctx.fill();
ctx.strokeStyle='rgba(255,100,100,0.7)';ctx.lineWidth=1.5;roundRect(rsX,rsY,rsW,rsH,12);ctx.stroke();
ctx.font='bold 13px -apple-system,sans-serif';ctx.fillStyle='#ff8080';
ctx.fillText('🗑  Удалить сохранение',cw/2,rsY+rsH/2+1);
}
ctx.font='bold 11px -apple-system,sans-serif';
ctx.fillStyle='rgba(200,180,255,0.6)';
ctx.fillText('⛰️ Горный  •  🏖️ Песочный  •  🍂 Лесной  •  🌿 Луговой',cw/2,ch-22);
}
function hitContinueButton(x,y){
const si=getSaveInfo();if(!si)return false;
const cW=Math.min(340,cw-40),cH=90,cX=(cw-cW)/2,cY=ch*.06;
return x>=cX&&x<=cX+cW&&y>=cY&&y<=cY+cH;
}
function hitSizeCard(x,y){
const si=getSaveInfo();
let labelY=ch*(si?.10:.16);
if(si)labelY=ch*.06+90+40;
const wide=cw>=720,cols=wide?4:2,cardGap=12,maxCardW=wide?160:180;
const cardW=Math.min(maxCardW,(cw-40-cardGap*(cols-1))/cols),cardH=130;
const gridW=cardW*cols+cardGap*(cols-1),gridX=(cw-gridW)/2,gridY=labelY+26;
for(let i=0;i<WORLD_SIZES.length;i++){
const r=Math.floor(i/cols),c=i%cols;
const bx=gridX+c*(cardW+cardGap),by=gridY+r*(cardH+cardGap);
if(x>=bx&&x<=bx+cardW&&y>=by-5&&y<=by+cardH+5)return WORLD_SIZES[i].id;
}
return null;
}
function hitCreateButton(x,y){
const si=getSaveInfo();
let labelY=ch*(si?.10:.16);
if(si)labelY=ch*.06+90+40;
const wide=cw>=720,cols=wide?4:2,rows=wide?1:2,cardGap=12,maxCardW=wide?160:180;
const cardW=Math.min(maxCardW,(cw-40-cardGap*(cols-1))/cols),cardH=130;
const gridY=labelY+26,infoY=gridY+rows*cardH+(rows-1)*cardGap+20;
const btnW=Math.min(280,cw-60),btnH=58,btnX=(cw-btnW)/2,btnY=infoY+10;
return x>=btnX&&x<=btnX+btnW&&y>=btnY&&y<=btnY+btnH;
}
function hitResetButton(x,y){
const si=getSaveInfo();if(!si)return false;
let labelY=ch*.06+90+40;
const wide=cw>=720,cols=wide?4:2,rows=wide?1:2,cardGap=12,maxCardW=wide?160:180;
const cardW=Math.min(maxCardW,(cw-40-cardGap*(cols-1))/cols),cardH=130;
const gridY=labelY+26,infoY=gridY+rows*cardH+(rows-1)*cardGap+20;
const btnY=infoY+10,btnH=58;
const rsW=Math.min(200,cw-80),rsH=40,rsX=(cw-rsW)/2,rsY=btnY+btnH+14;
return x>=rsX&&x<=rsX+rsW&&y>=rsY&&y<=rsY+rsH;
}
// ==================== ВВОД ====================
const touches=new Map();let pinchDist=0,pinchZoom=1;
function onStart(t){
if(appState==='settings'){
if(hitContinueButton(t.clientX,t.clientY)){loadWorld();return;}
if(hitResetButton(t.clientX,t.clientY)){deleteSave();return;}
const sizeId=hitSizeCard(t.clientX,t.clientY);
if(sizeId){selectedSize=sizeId;return;}
if(hitCreateButton(t.clientX,t.clientY)){startGame(selectedSize,false);return;}
return;
}
if(hitInspectClose(t.clientX,t.clientY)){inspected=null;return;}
touches.set(t.identifier,{x:t.clientX,y:t.clientY,startX:t.clientX,startY:t.clientY,pan:false,draw:false,moved:false});
if(touches.size===1){
const tb=hitTopButton(t.clientX,t.clientY);
if(tb==='panel'){hideBar=!hideBar;recalcView();return;}
if(tb==='mode'){panMode=!panMode;return;}
if(tb==='save'){if(saveWorld())saveFlash=.5;return;}
if(tb==='settings'){saveWorld();appState='settings';return;}
if(!hideBar&&t.clientY>=VIEW_H){
const tab=hitTab(t.clientX,t.clientY);
if(tab){activeTab=tab;return;}
const i=hitToolButton(t.clientX,t.clientY);
if(i>=0){activeTool=getTools()[i].id;return;}
return;
}
if(panMode){touches.get(t.identifier).pan=true;}
else{const w=toWorld(t.clientX,t.clientY);useTool(w.x,w.y);touches.get(t.identifier).draw=true;}
}else if(touches.size===2){
for(const info of touches.values()){info.pan=false;info.draw=false;}
const arr=Array.from(touches.values());
pinchDist=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);
pinchZoom=zoom;
}
}
function onMove(t){
if(appState!=='playing')return;
if(!touches.has(t.identifier))return;
const p=touches.get(t.identifier),dx=t.clientX-p.x,dy=t.clientY-p.y;
p.x=t.clientX;p.y=t.clientY;
if(!p.moved&&Math.hypot(t.clientX-p.startX,t.clientY-p.startY)>8)p.moved=true;
if(touches.size===1){
if(p.pan){camX-=dx/zoom;camY-=dy/zoom;boundCamera();}
else if(p.draw&&t.clientY<VIEW_H){const w=toWorld(t.clientX,t.clientY);useTool(w.x,w.y);}
}else if(touches.size>=2){
const arr=Array.from(touches.values());
camX-=dx/zoom;camY-=dy/zoom;
const d=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);
if(pinchDist>0){
const mx=(arr[0].x+arr[1].x)/2,my=(arr[0].y+arr[1].y)/2;
const before=toWorld(mx,my);
zoom=cl(pinchZoom*(d/pinchDist),MIN_ZOOM,MAX_ZOOM);
const after=toWorld(mx,my);
camX+=before.x-after.x;camY+=before.y-after.y;
}
boundCamera();
}
}
function onEnd(t){
const p=touches.get(t.identifier);
if(p&&!p.moved&&appState==='playing'&&p.pan){
if(hideBar||t.clientY<VIEW_H){
const w=toWorld(p.x,p.y);
inspected=findObjectAt(w.x,w.y);
}
}
touches.delete(t.identifier);
if(touches.size===0)pinchDist=0;
else if(touches.size===1){
const info=Array.from(touches.values())[0];
info.pan=panMode;info.draw=!panMode;
pinchDist=0;pinchZoom=zoom;
}
}
function setupInput(){
document.addEventListener('touchstart',function(e){
e.preventDefault();
for(const t of e.changedTouches)onStart(t);
},{passive:false});
document.addEventListener('touchmove',function(e){
e.preventDefault();
for(const t of e.changedTouches)onMove(t);
},{passive:false});
document.addEventListener('touchend',function(e){
e.preventDefault();
for(const t of e.changedTouches)onEnd(t);
},{passive:false});
document.addEventListener('touchcancel',function(e){
for(const t of e.changedTouches)onEnd(t);
});
let mDown=false,lastX=0,lastY=0,mStartX=0,mStartY=0;
document.addEventListener('mousedown',function(e){
if(appState==='settings'){
if(hitContinueButton(e.clientX,e.clientY)){loadWorld();return;}
if(hitResetButton(e.clientX,e.clientY)){deleteSave();return;}
const sizeId=hitSizeCard(e.clientX,e.clientY);
if(sizeId){selectedSize=sizeId;return;}
if(hitCreateButton(e.clientX,e.clientY)){startGame(selectedSize,false);return;}
return;
}
if(hitInspectClose(e.clientX,e.clientY)){inspected=null;return;}
mDown=true;lastX=e.clientX;lastY=e.clientY;mStartX=e.clientX;mStartY=e.clientY;
const tb=hitTopButton(e.clientX,e.clientY);
if(tb==='panel'){hideBar=!hideBar;recalcView();return;}
if(tb==='mode'){panMode=!panMode;return;}
if(tb==='save'){if(saveWorld())saveFlash=.5;return;}
if(tb==='settings'){saveWorld();appState='settings';return;}
if(!hideBar&&e.clientY>=VIEW_H){
const tab=hitTab(e.clientX,e.clientY);
if(tab){activeTab=tab;return;}
const i=hitToolButton(e.clientX,e.clientY);
if(i>=0){activeTool=getTools()[i].id;return;}
return;
}
if(!panMode&&e.clientY<VIEW_H){const w=toWorld(e.clientX,e.clientY);useTool(w.x,w.y);}
});
document.addEventListener('mousemove',function(e){
if(appState!=='playing'||!mDown)return;
const dx=e.clientX-lastX,dy=e.clientY-lastY;
lastX=e.clientX;lastY=e.clientY;
if(e.buttons===4||panMode){camX-=dx/zoom;camY-=dy/zoom;boundCamera();}
else if(!panMode&&e.clientY<VIEW_H){const w=toWorld(e.clientX,e.clientY);useTool(w.x,w.y);}
});
document.addEventListener('mouseup',function(e){
if(mDown&&appState==='playing'&&panMode){
const moved=Math.hypot(e.clientX-mStartX,e.clientY-mStartY)>8;
if(!moved&&(hideBar||e.clientY<VIEW_H)){
const w=toWorld(e.clientX,e.clientY);inspected=findObjectAt(w.x,w.y);
}
}
mDown=false;
});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('wheel',function(e){
if(appState!=='playing')return;
e.preventDefault();
const before=toWorld(e.clientX,e.clientY);
zoom=cl(zoom*(e.deltaY>0?.9:1.1),MIN_ZOOM,MAX_ZOOM);
const after=toWorld(e.clientX,e.clientY);
camX+=before.x-after.x;camY+=before.y-after.y;
boundCamera();
},{passive:false});
document.addEventListener('visibilitychange',function(){
if(document.hidden&&appState==='playing')saveWorld();
});
window.addEventListener('beforeunload',function(){
if(appState==='playing')saveWorld();
});
window.addEventListener('resize',function(){
initCanvas();
camX=cl(camX,0,Math.max(0,WORLD_W-cw/zoom));
camY=cl(camY,0,Math.max(0,WORLD_H-VIEW_H/zoom));
});
window.addEventListener('orientationchange',function(){
setTimeout(initCanvas,100);
});
}
// ==================== ГЛАВНЫЙ ЦИКЛ ====================
let lastTime=0;
function loop(t){
requestAnimationFrame(loop);
if(!lastTime)lastTime=t;
let dt=(t-lastTime)/1000;lastTime=t;
if(dt>.05)dt=.05;
worldTime+=dt;
if(saveFlash>0)saveFlash-=dt;
if(appState==='settings'){renderSettings();return;}
playTime+=dt;
cyclePhase=(cyclePhase+dt/DAY_LENGTH)%1;
if(worldTime-lastAutoSave>AUTO_SAVE_INTERVAL){
if(saveWorld())saveFlash=.5;
lastAutoSave=worldTime;
}
if(flashT>0)flashT-=dt;
tickBeings(dt);tickBuilds(dt);tickTrees(dt);tickFire(dt);tickFlow(dt);
tickSparks(dt);tickHearts(dt);tickBolts(dt);
renderWorld();paintUI();
}
function initCanvas(){
cw=canvas.width=window.innerWidth;
ch=canvas.height=window.innerHeight;
recalcView();
if(!tileCache.grass)prerenderTiles();
}
initCanvas();setupInput();requestAnimationFrame(loop);
// ==================== SERVICE WORKER ====================
if('serviceWorker' in navigator){
window.addEventListener('load',function(){
navigator.serviceWorker.register('sw.js')
.then(function(reg){console.log('SW зарегистрирован!');})
.catch(function(err){console.log('Ошибка SW:',err);});
});
}
</script>
