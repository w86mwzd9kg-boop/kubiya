      ctx.fillStyle = '#f5f0e5';
      ctx.beginPath();
      ctx.ellipse(e1, ey, s * 0.11, s * 0.13, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(e2, ey, s * 0.11, s * 0.13, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(e1 + s * 0.03, ey, s * 0.04, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(e2 + s * 0.03, ey, s * 0.04, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      if (u.hp < u.maxHp) {
        var bw = s * 2.2,
          bh = 3,
          bx = u.x - bw / 2,
          by = u.y - s * 2.1;
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(bx, by, bw, bh);
        var r = u.hp / u.maxHp;
        ctx.fillStyle = r > 0.5 ? '#4aff6a' : r > 0.25 ? '#f0e05a' : '#ff4a5a';
        ctx.fillRect(bx, by, bw * r, bh);
      }
    }

    function paintSwimming(u) {
      var as = u.isBaby ? (0.5 + u.growth * 0.5) : 1;
      var s = u.size * as;
      var fl = u.flash > 0;
      var bob = Math.sin(worldTime * 6 + u.x * 0.05) * 1.2;
      var wg = ctx.createRadialGradient(u.x, u.y + 2, s * 0.3, u.x, u.y + 2, s *
        2.4);
      wg.addColorStop(0, 'rgba(42,102,170,0.85)');
      wg.addColorStop(0.45, 'rgba(36,96,162,0.7)');
      wg.addColorStop(1, 'rgba(24,74,132,0)');
      ctx.fillStyle = wg;
      ctx.beginPath();
      ctx.ellipse(u.x, u.y + 4, s * 2.4, s * 1.25, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.save();
      ctx.translate(u.x, u.y + bob * 0.5);
      if (u.side < 0) ctx.scale(-1, 1);
      ctx.fillStyle = fl ? '#fff' : (u.cloth || '#a89878');
      ctx.beginPath();
      ctx.ellipse(0, -s * 0.15, s * 0.42, s * 0.28, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = fl ? '#fff' : (u.skin || '#e8c9a0');
      ctx.beginPath();
      ctx.ellipse(0, -s * 0.85, s * 0.42, s * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = fl ? '#fff' : (u.hair || '#3a2418');
      ctx.beginPath();
      ctx.ellipse(0, -s * 1.02, s * 0.44, s * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawWindowGlow(cx, cy, w, h, isOn) {
      if (!isOn) return;
      var dark = getDarkness();
      var intensity = (dark - 0.35) / 0.65;
      if (intensity <= 0) return;
      ctx.save();
      ctx.globalAlpha = intensity * 0.55;
      var g = ctx.createRadialGradient(cx, cy, 1, cx, cy, Math.max(w, h) * 2.2);
      g.addColorStop(0, 'rgba(255,220,130,0.95)');
      g.addColorStop(0.4, 'rgba(255,180,70,0.5)');
      g.addColorStop(1, 'rgba(255,140,30,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(w, h) * 2.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawWindow(cx, cy, w, h, isOn, cross) {
      var dark = getDarkness();
      var winCol;
      if (isOn && dark > 0.45) {
        var t = Math.min(1, (dark - 0.45) / 0.4);
        winCol = 'rgb(' + Math.round(160 + 95 * t) + ',' + Math.round(190 + 45 *
          t) + ',' + Math.round(210 - 60 * t) + ')'
      } else winCol = '#a0c8d8';
      drawWindowGlow(cx, cy, w, h, isOn && dark > 0.35);
      ctx.fillStyle = winCol;
      ctx.fillRect(cx - w / 2, cy - h / 2, w, h);
      ctx.strokeStyle = '#2a2010';
      ctx.lineWidth = 0.9;
      ctx.strokeRect(cx - w / 2, cy - h / 2, w, h);
      if (cross !== false) {
        ctx.beginPath();
        ctx.moveTo(cx, cy - h / 2);
        ctx.lineTo(cx, cy + h / 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx - w / 2, cy);
        ctx.lineTo(cx + w / 2, cy);
        ctx.stroke();
      }
    }

    function drawChimney(b, chX, chW, chTopY, chBottomY, fl) {
      ctx.fillStyle = fl ? '#fff' : '#9a9aa2';
      ctx.fillRect(chX, chTopY, chW, chBottomY - chTopY);
      ctx.strokeStyle = fl ? '#fff' : '#6a6a72';
      ctx.lineWidth = 1;
      ctx.strokeRect(chX, chTopY, chW, chBottomY - chTopY);
      ctx.fillStyle = fl ? '#fff' : '#b8b8c0';
      ctx.fillRect(chX - 1.5, chTopY - 2.5, chW + 3, 3);
    }

    function drawUpgradeIndicators(b, x, y, w, h) {
      if (b.level >= 3) return;
      if (b.upgradeProg > 0) {
        var barW = w * 0.75,
          barH = 5,
          barX = b.x - barW / 2,
          barY = y - h * 0.28 - 6;
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        roundRect(barX - 1, barY - 1, barW + 2, barH + 2, 2);
        ctx.fill();
        var grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
        grad.addColorStop(0, '#4adfff');
        grad.addColorStop(1, '#4aff6a');
        ctx.fillStyle = grad;
        roundRect(barX, barY, barW * Math.min(1, b.upgradeProg), barH, 2);
        ctx.fill();
      }
    }

    function paintVillageMarker(b, y_top) {
      var v = villages[b.villageId];
      if (!v) return;
      var y = y_top - 8;
      ctx.fillStyle = v.color;
      ctx.beginPath();
      ctx.arc(b.x, y, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = 1;
      ctx.stroke();
      if (v.wars.length > 0) {
        var pr = 6 + Math.sin(worldTime * 6) * 2;
        ctx.strokeStyle = 'rgba(255,50,50,0.9)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(b.x, y, pr, 0, Math.PI * 2);
        ctx.stroke();
      }
      if (warSelected === v.id) {
        ctx.strokeStyle = v.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(b.x, y, 8 + Math.sin(worldTime * 8) * 2, 0, Math.PI * 2);
        ctx.stroke();
      }
      if (v.isKingdom && zoom > 0.4) {
        ctx.font = 'bold 10px -apple-system,sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        var nw = ctx.measureText('👑' + v.name).width + 10;
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        roundRect(b.x - nw / 2, y - 24, nw, 14, 4);
        ctx.fill();
        ctx.fillStyle = v.color;
        ctx.fillText('👑' + v.name, b.x, y - 17);
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
      }
    }

    function paintBuild(b) {
      var L = BUILD_LEVELS[b.type][b.level - 1];
      var fl = b.flash > 0;
      var isWarehouse = b.type === 'warehouse',
        isTent = b.type === 'tent';
      var w = isWarehouse ? L.w * 1.1 : TILE * 2.2;
      var h = isWarehouse ? L.h * 1.1 : TILE * 2.0;
      var x = b.x - w / 2,
        y = b.y - h / 2;
      var lvl = b.level;
      if (isTent) paintTent(b, x, y, w, h, fl);
      else if (isWarehouse) paintWarehouse(b, x, y, w, h, fl);
      else if (lvl === 1) paintLogCabin(b, x, y, w, h, fl);
      else if (lvl === 2) paintTwoStoryHouse(b, x, y, w, h, fl);
      else paintMansion(b, x, y, w, h, fl);
      drawUpgradeIndicators(b, x, y, w, h);
      if (zoom > 0.5) paintVillageMarker(b, y);
    }

    function paintTent(b, x, y, w, h, fl) {
      var wallTop = y + h * 0.22,
        wallH = h * 0.78;
      ctx.fillStyle = fl ? '#fff' : '#6a5a7a';
      ctx.fillRect(x - 1, y + h - 4, w + 2, 4);
      ctx.fillStyle = fl ? '#fff' : '#a898c8';
      ctx.fillRect(x, wallTop, w, wallH);
      var doorW = w * 0.28,
        doorH = h * 0.38;
      ctx.fillStyle = fl ? '#fff' : '#3a2a5a';
      ctx.fillRect(b.x - doorW / 2, y + h - doorH - 4, doorW, doorH);
      var roofH = h * 0.4,
        tipY = y - roofH + 3;
      ctx.fillStyle = fl ? '#fff' : '#9058c8';
      ctx.beginPath();
      ctx.moveTo(b.x, tipY);
      ctx.lineTo(x - w * 0.15, wallTop + 3);
      ctx.lineTo(x + w + w * 0.15, wallTop + 3);
      ctx.closePath();
      ctx.fill();
    }

    function paintWarehouse(b, x, y, w, h, fl) {
      var wallTop = y + h * 0.22,
        wallH = h * 0.78;
      ctx.fillStyle = fl ? '#fff' : '#7a7a82';
      ctx.fillRect(x - 1, y + h - 4, w + 2, 4);
      ctx.fillStyle = fl ? '#fff' : '#8a6a4a';
      ctx.fillRect(x, wallTop, w, wallH);
      drawWindow(x + w * 0.18, wallTop + wallH * 0.25, w * 0.10, h * 0.12, true,
        false);
      drawWindow(x + w * 0.82, wallTop + wallH * 0.25, w * 0.10, h * 0.12, true,
        false);
      var doorW = w * 0.5,
        doorH = h * 0.55;
      ctx.fillStyle = fl ? '#fff' : '#3a2410';
      ctx.fillRect(b.x - doorW / 2, y + h - doorH - 4, doorW, doorH);
      var roofH = h * 0.42,
        tipY = y - roofH + 3;
      ctx.fillStyle = fl ? '#fff' : '#6a3a2a';
      ctx.beginPath();
      ctx.moveTo(b.x, tipY);
      ctx.lineTo(x - w * 0.15, wallTop + 3);
      ctx.lineTo(x + w + w * 0.15, wallTop + 3);
      ctx.closePath();
      ctx.fill();
    }

    function paintLogCabin(b, x, y, w, h, fl) {
      var wallTop = y + h * 0.38,
        wallH = h * 0.62;
      ctx.fillStyle = fl ? '#fff' : '#6a6a72';
      ctx.fillRect(x - 1, y + h - 4, w + 2, 4);
      var logH = wallH / 5;
      for (var i = 0; i < 5; i++) {
        var ly = wallTop + i * logH;
        ctx.fillStyle = fl ? '#fff' : (i % 2 ? '#a88868' : '#8a6a4a');
        ctx.fillRect(x, ly, w, logH + 1)
      }
      var doorW = w * 0.28,
        doorH = h * 0.42;
      var doorX = b.x - doorW / 2,
        doorY = y + h - doorH - 4;
      ctx.fillStyle = fl ? '#fff' : '#3a2010';
      ctx.fillRect(doorX, doorY, doorW, doorH);
      var roofBaseY = y + h * 0.42,
        overhang = w * 0.12;
      ctx.fillStyle = fl ? '#fff' : '#8a5a2a';
      ctx.beginPath();
      ctx.moveTo(b.x, y);
      ctx.lineTo(x - overhang, roofBaseY);
      ctx.lineTo(x + w + overhang, roofBaseY);
      ctx.closePath();
      ctx.fill();
    }

    function paintTwoStoryHouse(b, x, y, w, h, fl) {
      var wallTop = y + h * 0.25,
        wallH = h * 0.75;
      var midY = wallTop + wallH * 0.5;
      ctx.fillStyle = fl ? '#fff' : '#5a5a62';
      ctx.fillRect(x - 1, y + h - 4, w + 2, 4);
      ctx.fillStyle = fl ? '#fff' : '#a8845c';
      ctx.fillRect(x, wallTop, w, midY - wallTop);
      ctx.fillStyle = fl ? '#fff' : '#8a6a4a';
      ctx.fillRect(x, midY, w, y + h - 4 - midY);
      ctx.strokeStyle = fl ? '#ddd' : 'rgba(60,40,20,0.45)';
      ctx.lineWidth = 0.6;
      for (var i = 1; i < 6; i++) {
        var yy = wallTop + (midY - wallTop) * i / 6;
        ctx.beginPath();
        ctx.moveTo(x, yy);
        ctx.lineTo(x + w, yy);
        ctx.stroke()
      }
      ctx.strokeStyle = fl ? '#fff' : '#3a2010';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x, midY);
      ctx.lineTo(x + w, midY);
      ctx.stroke();
      var roofBaseY = y + h * 0.28,
        overhang = w * 0.14;
      ctx.fillStyle = fl ? '#fff' : '#4a4a52';
      ctx.beginPath();
      ctx.moveTo(b.x, y - 4);
      ctx.lineTo(x - overhang, roofBaseY);
      ctx.lineTo(x + w + overhang, roofBaseY);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = fl ? '#fff' : '#1a1a22';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      var gw = w * 0.16,
        gh = h * 0.10;
      drawWindow(b.x, y + h * 0.06 + gh / 2, gw, gh, true, true);
      var winY = wallTop + wallH * 0.10,
        winW = w * 0.10,
        winH = h * 0.13;
      var winXs = [0.10, 0.30, 0.58, 0.78];
      for (var wi = 0; wi < winXs.length; wi++) {
        var wx = x + w * winXs[wi] + winW / 2;
        drawWindow(wx, winY + winH / 2, winW, winH, true, true)
      }
      var doorW = w * 0.20,
        doorH = h * 0.30,
        doorX = b.x - doorW / 2,
        doorY = y + h - doorH - 4;
      ctx.fillStyle = fl ? '#fff' : '#5a3a1a';
      ctx.fillRect(doorX, doorY, doorW, doorH);
      ctx.fillStyle = fl ? '#fff' : '#3a2a1a';
      ctx.beginPath();
      ctx.moveTo(b.x, doorY - h * 0.07);
      ctx.lineTo(doorX - w * 0.06, doorY);
      ctx.lineTo(doorX + doorW + w * 0.06, doorY);
      ctx.closePath();
      ctx.fill();
      drawChimney(b, b.x - w * 0.32, w * 0.09, y - h * 0.08, y + h * 0.22, fl);
      if (b.hp < b.maxHp) {
        var by = y - h * 0.10;
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(x - 1, by - 1, w + 2, 5);
        var r2 = b.hp / b.maxHp;
        ctx.fillStyle = r2 > 0.5 ? '#4aff6a' : r2 > 0.25 ? '#f0e05a' :
          '#ff4a5a';
        ctx.fillRect(x, by, w * r2, 3);
      }
    }

    function paintMansion(b, x, y, w, h, fl) {
      var wallTop = y + h * 0.22,
        wallH = h * 0.78;
      var midY = wallTop + wallH * 0.5;
      ctx.fillStyle = fl ? '#fff' : '#5a5a62';
      ctx.fillRect(x - 1, y + h - 4, w + 2, 4);
      ctx.fillStyle = fl ? '#fff' : '#b8946a';
      ctx.fillRect(x, wallTop, w, midY - wallTop);
      ctx.fillStyle = fl ? '#fff' : '#966f4a';
      ctx.fillRect(x, midY, w, y + h - 4 - midY);
      var roofBaseY = y + h * 0.25,
        overhang = w * 0.16;
      ctx.fillStyle = fl ? '#fff' : '#3a3a42';
      ctx.beginPath();
      ctx.moveTo(b.x, y - 6);
      ctx.lineTo(x - overhang, roofBaseY);
      ctx.lineTo(x + w + overhang, roofBaseY);
      ctx.closePath();
      ctx.fill();
      var doorW = w * 0.18,
        doorH = h * 0.30,
        doorX = b.x - doorW / 2,
        doorY = y + h - doorH - 4;
      ctx.fillStyle = fl ? '#fff' : '#5a3a1a';
      ctx.fillRect(doorX, doorY, doorW, doorH);
    }

    function drawMountainTile(gx, gy, idx) {
      var px = gx * TILE,
        py = gy * TILE;
      var seed = decorSeed[idx],
        ore = oreMap[idx],
        hp = mountainHP[idx];
      var maxHp = MOUNTAIN_HP,
        dmgRatio = 1 - Math.max(0, hp / maxHp);
      var bg = ctx.createLinearGradient(px, py, px, py + TILE);
      bg.addColorStop(0, '#4a4a5e');
      bg.addColorStop(0.5, '#5a5a6e');
      bg.addColorStop(1, '#3a3a4a');
      ctx.fillStyle = bg;
      ctx.fillRect(px, py, TILE + 1, TILE + 1);
      var cx = px + TILE * 0.5,
        topY = py + TILE * (0.1 + seed * 0.15),
        baseY = py + TILE * 0.98,
        w2 = TILE * (0.75 + seed * 0.15);
      var lg = ctx.createLinearGradient(cx - w2 * 0.5, topY, cx, baseY);
      lg.addColorStop(0, '#c8c8dc');
      lg.addColorStop(0.5, '#9090a8');
      lg.addColorStop(1, '#5a5a70');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.moveTo(cx, topY);
      ctx.lineTo(cx - w2 * 0.5, baseY);
      ctx.lineTo(cx, baseY);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#3a3a4e';
      ctx.beginPath();
      ctx.moveTo(cx, topY);
      ctx.lineTo(cx + w2 * 0.5, baseY);
      ctx.lineTo(cx, baseY);
      ctx.closePath();
      ctx.fill();
      if (ore > 0 && ORE_TYPES[ore]) {
        for (var k = 0; k < 3; k++) {
          var ox = px + ((seed * (k + 1) * 137) % (TILE - 12)) + 6;
          var oy = py + ((seed * (k + 1) * 179) % (TILE - 12)) + 6;
          drawOreGem(ox, oy, 2.6, ore, 1.0);
        }
      }
      if (hp < maxHp && hp > 0) {
        var bw = TILE - 6,
          bh = 2.5,
          bx = px + 3,
          by = py + 2;
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
        ctx.fillStyle = dmgRatio < 0.5 ? '#ffd94a' : '#ff6a3a';
        ctx.fillRect(bx, by, bw * (1 - dmgRatio), bh);
      }
    }

    function drawShaftTile(gx, gy, idx) {
      var px = gx * TILE,
        py = gy * TILE;
      var bg = ctx.createLinearGradient(px, py, px, py + TILE);
      bg.addColorStop(0, '#6a4a2a');
      bg.addColorStop(1, '#4a2e18');
      ctx.fillStyle = bg;
      ctx.fillRect(px, py, TILE + 1, TILE + 1);
      var cx = px + TILE / 2,
        cy = py + TILE / 2;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(cx, cy, TILE * 0.55, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawDeepShaftTile(gx, gy, idx) {
      var px = gx * TILE,
        py = gy * TILE;
      var bg = ctx.createLinearGradient(px, py, px, py + TILE);
      bg.addColorStop(0, '#3a3a4a');
      bg.addColorStop(1, '#1a1a2a');
      ctx.fillStyle = bg;
      ctx.fillRect(px, py, TILE + 1, TILE + 1);
      var cx = px + TILE / 2,
        cy = py + TILE / 2;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(cx, cy, TILE * 0.55, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawFireOverlay(px, py, idx) {
      var fl = Math.sin(worldTime * 9 + idx * 0.7) * 0.35 + 0.65;
      var intensity = Math.min(1, burnTimer[idx] / 2.5);
      var glow = ctx.createRadialGradient(px + TILE / 2, py + TILE * 0.7, 1,
        px + TILE / 2, py + TILE * 0.7, TILE * 0.9);
      glow.addColorStop(0, 'rgba(255,200,60,' + (0.55 * intensity * fl) + ')');
      glow.addColorStop(0.5, 'rgba(255,120,30,' + (0.35 * intensity) + ')');
      glow.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(px - 2, py - 2, TILE + 4, TILE + 4);
    }

    function drawBolts() {
      for (var bi = 0; bi < bolts.length; bi++) {
        var b = bolts[bi];
        var a = b.life / b.maxLife;
        ctx.save();
        if (b.blur > 0) {
          ctx.shadowColor = b.blurColor || b.color;
          ctx.shadowBlur = b.blur * a
        }
        ctx.strokeStyle = b.color;
        ctx.globalAlpha = a;
        ctx.lineWidth = b.width;
        ctx.lineCap = 'round';
        ctx.beginPath();
        if (b.path.length > 0) {
          ctx.moveTo(b.path[0].x, b.path[0].y);
          for (var i = 1; i < b.path.length; i++) ctx.lineTo(b.path[i].x, b
            .path[i].y)
        }
        ctx.stroke();
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    function drawDayNight() {
      var darkness = getDarkness();
      if (darkness > 0.05) {
        ctx.fillStyle = 'rgba(15,20,60,' + (darkness * 0.55) + ')';
        ctx.fillRect(0, 0, cw, VIEW_H)
      }
    }

    function drawHeart(x, y, size, color) {
      ctx.save();
      ctx.translate(x, y);
      var s = size / 16;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, 5 * s);
      ctx.bezierCurveTo(-8 * s, -1 * s, -8 * s, -8 * s, 0, -4 * s);
      ctx.bezierCurveTo(8 * s, -8 * s, 8 * s, -1 * s, 0, 5 * s);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function renderWorld() {
      var bgGrad = ctx.createLinearGradient(0, 0, 0, VIEW_H);
      bgGrad.addColorStop(0, '#1a1030');
      bgGrad.addColorStop(1, '#2a1a4a');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, cw, VIEW_H);
      var vw = cw / zoom,
        vh = VIEW_H / zoom;
      var x0 = Math.max(0, Math.floor(camX / TILE) - 2),
        x1 = Math.min(COLS, Math.ceil((camX + vw) / TILE) + 2);
      var y0 = Math.max(0, Math.floor(camY / TILE) - 2),
        y1 = Math.min(ROWS, Math.ceil((camY + vh) / TILE) + 2);
      ctx.save();
      ctx.scale(zoom, zoom);
      ctx.translate(-camX, -camY);
      for (var y = y0; y < y1; y++)
        for (var x = x0; x < x1; x++) {
          var idx = y * COLS + x,
            t = tiles[idx],

    function drawClockDial() {
      var size = 68;
      var cx = size / 2 + 14,
        cy = VIEW_H - 14 - size / 2;
      var bgGrad = ctx.createRadialGradient(cx, cy, 2, cx, cy, size * 0.55);
      bgGrad.addColorStop(0, 'rgba(40,25,70,0.95)');
      bgGrad.addColorStop(1, 'rgba(15,8,30,0.95)');
      ctx.fillStyle = bgGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, size / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(160,120,255,0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, size / 2 - 1, 0, Math.PI * 2);
      ctx.stroke();
      var angle = cyclePhase * Math.PI * 2 - Math.PI / 2;
      var arrowLen = size / 2 - 10;
      ctx.strokeStyle = '#ffe14a';
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(angle) * arrowLen, cy + Math.sin(angle) *
        arrowLen);
      ctx.stroke();
      ctx.fillStyle = '#ffe14a';
      ctx.beginPath();
      ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
      ctx.fill();
      var timeLabel;
      var ph = cyclePhase;
      if (ph < 0.10 || ph >= 0.90) timeLabel = '🌙 Ночь';
      else if (ph < 0.25) timeLabel = '🌅 Рассвет';
      else if (ph < 0.40) timeLabel = '☀️ Утро';
      else if (ph < 0.60) timeLabel = '☀️ День';
      else if (ph < 0.75) timeLabel = '🌇 Закат';
      else timeLabel = '🌆 Вечер';
      ctx.font = 'bold 10px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(200,180,255,0.9)';
      ctx.fillText(timeLabel, cx, cy + size / 2 + 10);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
    }

    function renderMinimap() {

      var pw = ms - 4,
        ph = ms - 4,
        px = mx + 2,
        py = my + 2;
      var sx = pw / COLS,
        sy = ph / ROWS;
      var step = Math.max(2, Math.floor(COLS / 100));

          ctx.fillRect(px + x * sx, py + y * sy, sx * step + 0.6, sy * step +
            0.6);

        var kx = px + (v2.cx / TILE) * sx,

      return true;
    }

          wood[0] -= take0;
          need -= take0;
          wood[1] = Math.max(0, wood[1] - need)
        } else minerals[k] = (minerals[k] || 0) - cost[k];
      }
    }

      if (cost.gold) p.push('🥇' + cost.gold);

      }
      var infoY = gridY + rows * cardH + (rows - 1) * cardGap + 16;
      var btnW = Math.min(280, cw - 60),
        btnH = 54,
        btnX = (cw - btnW) / 2,
        btnY = infoY + 6;
      ctx.fillStyle = '#7a5cc9';
      roundRect(btnX, btnY, btnW, btnH, 16);
      ctx.fill();
      ctx.strokeStyle = '#ffe14a';
      ctx.lineWidth = 2.5;
      roundRect(btnX, btnY, btnW, btnH, 16);
      ctx.stroke();
      ctx.font = 'bold 19px -apple-system,sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText(saveInfo ? '🌍  Начать заново' : '🚀  Создать мир', cw / 2,
        btnY + btnH / 2 + 1);
      if (has) {
        var rsW = Math.min(200, cw - 80),
          rsH = 38,
          rsX = (cw - rsW) / 2,
          rsY = btnY + btnH + 12;
        ctx.fillStyle = 'rgba(200,60,60,0.25)';
        roundRect(rsX, rsY, rsW, rsH, 12);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,100,100,0.7)';
        ctx.lineWidth = 1.5;
        roundRect(rsX, rsY, rsW, rsH, 12);
        ctx.stroke();
        ctx.font = 'bold 13px -apple-system,sans-serif';
        ctx.fillStyle = '#ff8080';
        ctx.fillText('🗑  Удалить', cw / 2, rsY + rsH / 2 + 1);
      }
      ctx.font = 'bold 10px -apple-system,sans-serif';
      ctx.fillStyle = 'rgba(230,201,58,0.7)';
      ctx.fillText('Кубия  v' + APP_VERSION, cw / 2, ch - 14);
      ctx.textAlign = 'left';

    }

    function hitContinueButton(x, y) {

        cH = 90,

    }

    function getSettingsLayout() {
      var si = getSaveInfo();
      var has = si !== null;
      var labelY = ch * (has ? 0.10 : 0.16);
      if (has) labelY = ch * 0.06 + 90 + 34;
      var wide = cw >= 720,
        cols = wide ? 5 : 2,
        rows = wide ? 1 : 3,
        cardGap = 10,
        maxW = wide ? 130 : 170;
      var cardW = Math.min(maxW, (cw - 24 - cardGap * (cols - 1)) / cols),
        cardH = wide ? 110 : 90;
      var gridW = cardW * cols + cardGap * (cols - 1),
        gridX = (cw - gridW) / 2,
        gridY = labelY + 22;
      return {
        cols: cols,

        cardH: cardH,

    }

    function hitSizeCard(x, y) {

          by = L.gridY + r * (L.cardH + L.cardGap);

      }
      return null;
    }

    var touches = new Map(),

    function ensureToolValid() {

      }

    }
    document.addEventListener('mousedown', function(e) {

          e.preventDefault();
          return
        }
      }
    }, true);

    function onStart(t) {
      if (changelogVisible) {

      }

          return
        }

          return

          showKingdomPick(selectedSize);
          return
        }
        return;
      }

        var k = hitKingdomPick(t.clientX, t.clientY);
        if (k) startGameWithKingdom(k);
        return
      }

        inspected = null;
        return
      }
      touches.set(t.identifier, {
        x: t.clientX,
        y: t.clientY,
        startX: t.clientX,
        startY: t.clientY,
        pan: false,
        draw: false,
        moved: false
      });
      if (touches.size === 1) {
        var tb = hitTopButton(t.clientX, t.clientY);
        if (tb === 'panel') {
          hideBar = !hideBar;
          recalcView();
          return
        }
        if (tb === 'mode') {
          panMode = !panMode;
          return
        }
        if (tb === 'save') {
          if (saveWorld()) saveFlash = 0.5;
          return
        }
        if (tb === 'history') {
          openHistory();
          return
        }
        if (tb === 'settings') {
          saveWorld();
          appState = 'settings';
          return
        }
        if (t.clientY < VIEW_H) {
          var zb = hitZoomButton(t.clientX, t.clientY);
          if (zb === 'plus') {
            var mx = cw / 2,
              my = VIEW_H / 2,
              before = toWorld(mx, my);
            zoom = cl(zoom * 1.3, MIN_ZOOM, MAX_ZOOM);
            var after = toWorld(mx, my);
            camX += before.x - after.x;
            camY += before.y - after.y;
            boundCamera();
            return
          }
          if (zb === 'minus') {
            var mx2 = cw / 2,
              my2 = VIEW_H / 2,
              before2 = toWorld(mx2, my2);
            zoom = cl(zoom / 1.3, MIN_ZOOM, MAX_ZOOM);
            var after2 = toWorld(mx2, my2);
            camX += before2.x - after2.x;
            camY += before2.y - after2.y;
            boundCamera();
            return
          }
        }
        if (!hideBar && t.clientY >= VIEW_H) {
          var tab = hitTab(t.clientX, t.clientY);
          if (tab) {
            activeTab = tab;
            ensureToolValid();
            if (activeTool !== 'war' && activeTool !== 'ally') warSelected =
              null;
            return
          }
          var i = hitToolButton(t.clientX, t.clientY);
          if (i >= 0) {
            activeTool = getTools()[i].id;
            if (activeTool !== 'war' && activeTool !== 'ally') warSelected =
              null;
            return
          }
          return;
        }
        if (panMode) touches.get(t.identifier).pan = true;
        else {
          var w = toWorld(t.clientX, t.clientY);
          useTool(w.x, w.y);
          touches.get(t.identifier).draw = true
        }
      } else if (touches.size === 2) {
        for (var info of touches.values()) {
          info.pan = false;
          info.draw = false
        }
        var arr = Array.from(touches.values());
        pinchDist = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);

      }
    }

    function onMove(t) {
      if (changelogVisible) {
        changelogMove(t);
        return
      }

      if (!touches.has(t.identifier)) return;
      var p = touches.get(t.identifier);
      var dx = t.clientX - p.x,
        dy = t.clientY - p.y;
      p.x = t.clientX;
      p.y = t.clientY;
      if (!p.moved && Math.hypot(t.clientX - p.startX, t.clientY - p.startY) >
        8) p.moved = true;
      if (touches.size === 1) {
        if (p.pan) {
          camX -= dx / zoom;
          camY -= dy / zoom;
          boundCamera()
        } else if (p.draw && t.clientY < VIEW_H) {
          if (activeTool === 'war' || activeTool === 'ally') return;
          var w = toWorld(t.clientX, t.clientY);
          useTool(w.x, w.y);
        }
      } else if (touches.size >= 2) {
        var arr = Array.from(touches.values());
        camX -= dx / zoom;
        camY -= dy / zoom;
        var d = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);
        if (pinchDist > 0) {
          var mx = (arr[0].x + arr[1].x) / 2,
            my = (arr[0].y + arr[1].y) / 2;
          var before = toWorld(mx, my);
          zoom = cl(pinchZoom * (d / pinchDist), MIN_ZOOM, MAX_ZOOM);
          var after = toWorld(mx, my);
          camX += before.x - after.x;
          camY += before.y - after.y;
        }
        boundCamera();
      }
    }

    function onEnd(t) {
      if (changelogVisible) {
        changelogEnd(t);
        return
      }
      var p = touches.get(t.identifier);
      if (p && !p.moved && appState === 'playing' && p.pan) {
        if (hideBar || t.clientY < VIEW_H) {
          var w = toWorld(p.x, p.y);
          inspected = findObjectAt(w.x, w.y)
        }
      }
      if (p && !p.moved && appState === 'playing' && !p.pan && t.clientY <
        VIEW_H && (activeTool === 'war' || activeTool === 'ally')) {
        var w2 = toWorld(p.x, p.y);
        useTool(w2.x, w2.y);
      }
      touches.delete(t.identifier);
      if (touches.size === 0) pinchDist = 0;
      else if (touches.size === 1) {
        var info = Array.from(touches.values())[0];
        info.pan = panMode;
        info.draw = !panMode;
        pinchDist = 0;
        pinchZoom = zoom;
      }

    function setupInput() {
      document.addEventListener('touchstart', function(e) {

        for (var t of e.changedTouches) onStart(t)
      }, {

        e.preventDefault();
        for (var t of e.changedTouches) onMove(t)
      }, {

      });

      }, {

      });

      });

        mStartY = 0;
      document.addEventListener('mousedown', function(e) {

        }

          if (sizeId) {

            return
          }

            return

        if (appState === 'kingdomPick') {

          return
        }
        if (hitInspectClose(e.clientX, e.clientY)) {

          return

        mDown = true;
        lastX = e.clientX;
        lastY = e.clientY;
        mStartX = e.clientX;
        mStartY = e.clientY;
        var tb = hitTopButton(e.clientX, e.clientY);
        if (tb === 'panel') {

          recalcView();
          return

          panMode = !panMode;
          return

          return

          if (zb === 'plus') {
            var mx = cw / 2,
              my = VIEW_H / 2,
              before = toWorld(mx, my);
            zoom = cl(zoom * 1.3, MIN_ZOOM, MAX_ZOOM);
            var after = toWorld(mx, my);
            camX += before.x - after.x;
            camY += before.y - after.y;
            boundCamera();
            return
          }
          if (zb === 'minus') {
            var mx2 = cw / 2,
              my2 = VIEW_H / 2,
              before2 = toWorld(mx2, my2);
            zoom = cl(zoom / 1.3, MIN_ZOOM, MAX_ZOOM);
            var after2 = toWorld(mx2, my2);
            camX += before2.x - after2.x;
            camY += before2.y - after2.y;
            boundCamera();
            return
          }
        }
        if (!hideBar && e.clientY >= VIEW_H) {
          var tab = hitTab(e.clientX, e.clientY);
          if (tab) {
            activeTab = tab;
            ensureToolValid();
            if (activeTool !== 'war' && activeTool !== 'ally') warSelected =
              null;
            return
          }
          var i = hitToolButton(e.clientX, e.clientY);
          if (i >= 0) {
            activeTool = getTools()[i].id;
            if (activeTool !== 'war' && activeTool !== 'ally') warSelected =
              null;
            return
          }
          return;
        }
        if (!panMode && e.clientY < VIEW_H) {
          var w = toWorld(e.clientX, e.clientY);
          useTool(w.x, w.y)
        }
      });
      document.addEventListener('mousemove', function(e) {
        if (changelogVisible) return;
        if (appState !== 'playing' || !mDown) return;
        var dx = e.clientX - lastX,

        lastY = e.clientY;

        } else if (!panMode && e.clientY < VIEW_H && activeTool !== 'war' &&
          activeTool !== 'ally') {
          var w = toWorld(e.clientX, e.clientY);
          useTool(w.x, w.y)
        }
      });
      document.addEventListener('mouseup', function(e) {
        if (mDown && appState === 'playing' && panMode) {
          var moved = Math.hypot(e.clientX - mStartX, e.clientY - mStartY) >

            var w2 = toWorld(e.clientX, e.clientY);
            useTool(w2.x, w2.y)
          }

      document.addEventListener('contextmenu', function(e) {
        e.preventDefault()
      });
      document.addEventListener('wheel', function(e) {

        if (appState !== 'playing') return;

        var after = toWorld(e.clientX, e.clientY);

        boundCamera();

        passive: false
      });

      });

      });

        boundCamera()
      });
      window.addEventListener('orientationchange', function() {
        setTimeout(initCanvas, 100)
      });
    }

    var lastTime = 0;

    function loop(t) {
      requestAnimationFrame(loop);
      if (!lastTime) lastTime = t;
      var dt = (t - lastTime) / 1000;
      lastTime = t;
      if (dt > 0.05) dt = 0.05;
      worldTime += dt;
      if (saveFlash > 0) saveFlash -= dt;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      if (changelogVisible) {
        if (appState === 'settings') renderSettings();
        else if (appState === 'kingdomPick') renderKingdomPick();
        else {
          playTime += dt;
          cyclePhase = (cyclePhase + dt / DAY_LENGTH) % 1;
          var saveInterval = (selectedSize === 'empire') ? 4 :
            AUTO_SAVE_INTERVAL;
          if (worldTime - lastAutoSave > saveInterval) {
            if (saveWorld()) saveFlash = 0.5;
            lastAutoSave = worldTime
          }
          if (flashT > 0) flashT -= dt;
          tickBeings(dt);
          tickBuilds(dt);
          tickTrees(dt);
          tickFire(dt);
          tickFlow(dt);
          tickSparks(dt);
          tickHearts(dt);
          tickBolts(dt);
          tickAnimals(dt);
          renderWorld();
          paintUI();
        }
        renderChangelog();
        return;
      }
      if (appState === 'settings') {
        renderSettings();
        return
      }
      if (appState === 'kingdomPick') {
        renderKingdomPick();
        return
      }
      playTime += dt;
      cyclePhase = (cyclePhase + dt / DAY_LENGTH) % 1;
      var saveInterval = (selectedSize === 'empire') ? 4 : AUTO_SAVE_INTERVAL;
      if (worldTime - lastAutoSave > saveInterval) {
        if (saveWorld()) saveFlash = 0.5;
        lastAutoSave = worldTime
      }
      if (flashT > 0) flashT -= dt;
      tickBeings(dt);
      tickBuilds(dt);
      tickTrees(dt);
      tickFire(dt);
      tickFlow(dt);
      tickSparks(dt);
      tickHearts(dt);
      tickBolts(dt);
      tickAnimals(dt);
      renderWorld();
      paintUI();
    }

    function initCanvas() {
      DPR = Math.min(window.devicePixelRatio || 1, 3);
      cw = window.innerWidth || document.documentElement.clientWidth || 360;
      ch = window.innerHeight || document.documentElement.clientHeight || 640;
      if (cw < 50) cw = 360;
      if (ch < 50) ch = 640;
      canvas.width = Math.floor(cw * DPR);
      canvas.height = Math.floor(ch * DPR);
      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.imageSmoothingEnabled = true;
      recalcView();
      if (!tileCache.grass) prerenderTiles();
    }
    initCanvas();
    setupInput();
    checkChangelog();
    requestAnimationFrame(loop);

      function paintWall(b) {
        var isWood = b.type === 'wallwood';
        var w = TILE,
          h = TILE,

          fl = b.flash > 0;
        var base = isWood ? (fl ? '#fff' : '#8a5a2a') : (fl ? '#fff' :
          '#8a8a92');
        var dark = isWood ? '#3a2a18' : '#4a4a52';
        ctx.fillStyle = dark;
        ctx.fillRect(x, y, w, h);
        if (isWood) {
          for (var i = 0; i < 4; i++) {
            var ly = y + i * (h / 4);
            ctx.fillStyle = base;
            ctx.fillRect(x + 1, ly + 1, w - 2, (h / 4) - 2);
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.fillRect(x + 1, ly + (h / 4) - 2, w - 2, 1.5)
          }
        } else {
          var bw = w / 2,
            bh = h / 2;
          for (var r = 0; r < 2; r++)
            for (var c = 0; c < 2; c++) {
              var off = (r % 2 === 0 ? 0 : bw * 0.25);
              var bx = x + c * bw - off;
              if (bx < x) bx = x;
              var bw2 = Math.min(bw - 1, x + w - bx - 1);
              ctx.fillStyle = fl ? '#fff' : '#a8a8b0';
              ctx.fillRect(bx + 1, y + r * bh + 1, bw2 - 1, bh - 1);
              ctx.strokeStyle = dark;
              ctx.lineWidth = 1;
              ctx.strokeRect(bx + 0.5, y + r * bh + 0.5, bw2 - 1, bh - 1);
            }
        }
        if (b.hp < b.maxHp) {
          var bw3 = w * 1.2,
            bh3 = 2.5,
            bx3 = b.x - bw3 / 2,
            by3 = y - h * 0.3;
          ctx.fillStyle = 'rgba(0,0,0,0.7)';
          ctx.fillRect(bx3 - 0.5, by3 - 0.5, bw3 + 1, bh3 + 1);
          var r2 = b.hp / b.maxHp;
          ctx.fillStyle = r2 > 0.5 ? '#4aff6a' : r2 > 0.25 ? '#f0e05a' :
            '#ff4a5a';
          ctx.fillRect(bx3, by3, bw3 * r2, bh3);

      function buildingEffects(dt) {
        var forges = {},

          var b = builds[i];
          if (b.type === 'forge') forges[b.villageId] = (forges[b

          else if (b.type === 'tavern') taverns[b.villageId] = (taverns[b
            .villageId] || 0) + 1;
          else if (b.type === 'tower') {
            b.towerCd = (b.towerCd === undefined ? 0 : b.towerCd) - dt;
            if (b.towerCd <= 0) {
              b.towerCd = 1.0;

                best = null;
              for (var j = 0; j < beings.length; j++) {
                var u = beings[j];
                if (u.clan === b.clan || u.swimming) continue;
                var d = Math.hypot(u.x - b.x, u.y - b.y);
                if (d < bd) {
                  bd = d;
                  best = u
                }
              }
              if (best) {
                best.hp -= 15;
                best.flash = 0.15;
                var ang = Math.atan2(best.y - b.y, best.x - b.x);
                for (var k = 0; k < 5; k++) sparks.push({

                  s: 3

            }
          }

          if (!u2.villageId) continue;
          var base = BEING[u2.type];
          if (base) u2.dmg = base.dmg + (forges[u2.villageId] || 0) * 2
        }

          if (taverns[u3.villageId]) u3.breedCd -= dt
        }

      function npcCanBuild(x, y, clan, vid) {
        if (!walkable(x, y)) return false;
        if (x < TILE * 2 || x > WORLD_W - TILE * 2 || y < TILE * 2 || y >
          WORLD_H - TILE * 2) return false;
        for (var i = 0; i < builds.length; i++)
          if (Math.hypot(builds[i].x - x, builds[i].y - y) < TILE * 2.2)
            return false;
        for (var i2 = 0; i2 < trees.length; i2++)
          if (Math.hypot(trees[i2].x - x, trees[i2].y - y) < TILE * 0.9)
            return false;
        for (var i3 = 0; i3 < rocks.length; i3++)
          if (Math.hypot(rocks[i3].x - x, rocks[i3].y - y) < TILE * 0.9)
            return false;
        var ctr = getVillageCenter(vid);
        if (ctr && Math.hypot(ctr.x - x, ctr.y - y) > TILE * 15) return false;
        return true;
      }

      function npcBuildingTick(dt) {
        for (var i = 0; i < beings.length; i++) {
          var u = beings[i];
          if (u.isLeader || u.swimming || u.isBaby) continue;
          if (u.clan > 1) continue;
          if (u.age < 5) continue;
          if (u.bldCd > 0) continue;
          if (u.currentAction !== 'wander' && u.currentAction !== 'idle')
            continue;
          if (!u.villageId) continue;
          var v = villages[u.villageId];
          if (!v) continue;
          if (v.order === 'attack' || v.order === 'defend') continue;
          var counts = {
            cottage: 0,
            tent: 0,
            warehouse: 0,
            forge: 0,
            tavern: 0,
            tower: 0
          };
          for (var j = 0; j < builds.length; j++) {
            var b = builds[j];
            if (b.villageId !== u.villageId) continue;
            counts[b.type] = (counts[b.type] || 0) + 1
          }
          var homes = (counts.cottage || 0) + (counts.tent || 0);
          var plan = null;
          if (counts.warehouse === 0) plan = {
            type: 'warehouse',
            cost: {
              wood: 0,
              stone: 0,
              iron: 0,
              gold: 0
            }
          };
          else if (counts.forge === 0 && homes >= 2 && canAfford(u.clan,
              BUILD_COST.forge[0])) plan = {
            type: 'forge',
            cost: BUILD_COST.forge[0]
          };
          else if (counts.tavern === 0 && homes >= 3 && canAfford(u.clan,
              BUILD_COST.tavern[0])) plan = {
            type: 'tavern',
            cost: BUILD_COST.tavern[0]
          };
          else if (counts.tower < Math.ceil(homes / 4) && canAfford(u.clan,
              BUILD_COST.tower[0])) plan = {
            type: 'tower',
            cost: BUILD_COST.tower[0]
          };
          else if (counts.warehouse < Math.ceil(homes / 3) && canAfford(u
              .clan, BUILD_COST.warehouse[0])) plan = {
            type: 'warehouse',
            cost: BUILD_COST.warehouse[0]
          };
          else if (Math.random() < 0.55) {
            var hType = u.clan === 0 ? 'cottage' : 'tent';
            plan = {
              type: hType,
              cost: BUILD_COST[hType][0]
            }
          } else {
            u.bldCd = 4 + Math.random() * 4;
            continue
          }
          if (!canAfford(u.clan, plan.cost)) {
            u.bldCd = 6 + Math.random() * 4;
            continue
          }
          var bx = 0,
            by = 0,
            ok = false;
          for (var tryi = 0; tryi < 8; tryi++) {
            var angle = Math.random() * Math.PI * 2;
            var dist = TILE * (2.5 + Math.random() * 3);
            bx = u.x + Math.cos(angle) * dist;
            by = u.y + Math.sin(angle) * dist;
            if (npcCanBuild(bx, by, u.clan, u.villageId)) {
              ok = true;
              break
            }
          }
          if (!ok) {
            u.bldCd = 4 + Math.random() * 4;
            continue
          }
          payCost(u.clan, plan.cost);
          var nb = placeBuild(bx, by, plan.type, u.clan, u.villageId);
          if (plan.type === 'cottage' && Math.random() < 0.35) {
            nb.level = 2;
            nb.maxHp = BUILD_LEVELS.cottage[1].hp;
            nb.hp = nb.maxHp

            vy: rnd(-40, -25),

            maxLife: 0.9,
            size: 7,
            color: '#ffe14a'
          });
        }

        ctx.textAlign = 'left';
      }
      var cbw = Math.min(260, cw - 60),
        cbh = 52;
      var cbx = (cw - cbw) / 2,
        cby = L.startY + FULL_OPTIONS.length * (L.bh + L.gap) + 20;
      ctx.fillStyle = 'rgba(200,60,60,0.85)';
      roundRect(cbx, cby, cbw, cbh, 14);
      ctx.fill();
      ctx.strokeStyle = '#ff8080';
      ctx.lineWidth = 2;
      roundRect(cbx, cby, cbw, cbh, 14);
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('✕ ЗАКРЫТЬ', cw / 2, cby + cbh / 2 + 1);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
    }

    function hitFullSettings(x, y) {
      if (!showFullSettings) return null;
      var L = getFSLayout();
      for (var i = 0; i < FULL_OPTIONS.length; i++) {
        var bx = (cw - L.bw) / 2,
          by = L.startY + i * (L.bh + L.gap);
        if (x >= bx && x <= bx + L.bw && y >= by && y <= by + L.bh)
        return FULL_OPTIONS[i];
      }
      var cbw = Math.min(260, cw - 60),
        cbh = 52;
      var cbx = (cw - cbw) / 2,
        cby = L.startY + FULL_OPTIONS.length * (L.bh + L.gap) + 20;
      if (x >= cbx && x <= cbx + cbw && y >= cby && y <= cby + cbh)
      return 'close';
      return null;
    }

    function applyFullSettings(id) {
      if (id === 'close') {
        showFullSettings = false;
        return
      }
      if (id === 'music') {
        var s = readSettings();
        Mus.setMusic(!(s.music !== false));
      } else if (id === 'quality') {
        var s2 = readSettings();
        s2.quality = (s2.quality || 'high') === 'high' ? 'low' : 'high';
        writeSettings(s2);
        toast(s2.quality === 'high' ? '🎨 Качество: высокое' :
          '🎨 Качество: низкое', 1.5);
      } else if (id === 'lang') {
        setLang(getLang() === 'ru' ? 'en' : 'ru')
      }
    }

    function getMenuSettingsBtn() {
      var size = 44;
      return {
        x: cw - size - 16,
        y: 16,
        size: size
      }
    }

    function renderMenuSettingsBtn() {
      if (appState !== 'settings') return;
      var L = getMenuSettingsBtn();
      ctx.fillStyle = 'rgba(160,120,255,0.28)';
      roundRect(L.x, L.y, L.size, L.size, 12);
      ctx.fill();
      ctx.strokeStyle = '#a87ae6';
      ctx.lineWidth = 2.5;
      roundRect(L.x, L.y, L.size, L.size, 12);
      ctx.stroke();
      ctx.font = '22px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      ctx.fillText('⚙️', L.x + L.size / 2, L.y + L.size / 2 + 1);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
    }

    function hitMenuSettingsBtn(x, y) {
      if (appState !== 'settings') return false;
      var L = getMenuSettingsBtn();
      return x >= L.x && x <= L.x + L.size && y >= L.y && y <= L.y + L.size
    }

    function handleUI(x, y) {
      if (showFullSettings) {
        var h = hitFullSettings(x, y);
        if (h) applyFullSettings(h);
        return true;
      }
      if (showPauseMenu) {
        var pm = hitPauseMenu(x, y);
        if (pm) {
          if (pm === 'resume') {
            showPauseMenu = false;
            paused = false
          } else if (pm === 'save') {
            saveWorld();
            toast('💾 Сохранено', 1.5)
          } else if (pm === 'settings') {
            showFullSettings = true
          } else if (pm === 'menu') {
            saveWorld();
            appState = 'settings';
            showPauseMenu = false;
            paused = false
          }
        }
        return true;
      }
      if (hitPauseBtn(x, y)) {
        paused = !paused;
        if (paused) showPauseMenu = true;
        return true;
      }
      if (hitMenuSettingsBtn(x, y)) {
        showFullSettings = true;
        return true
      }
      return false;
    }
    document.addEventListener('mousedown', function(e) {
      if (handleUI(e.clientX, e.clientY)) {
        e.stopImmediatePropagation();
        e.preventDefault()
      }
    }, true);
    document.addEventListener('touchstart', function(e) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (handleUI(t.clientX, t.clientY)) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return
        }
      }
    }, true);

    var _paintUI = paintUI;
    paintUI = function() {
      _paintUI();
      if (appState === 'playing' && !showPauseMenu && !showFullSettings && !
        showShop && !changelogVisible) renderPauseBtn();
    };
    var _renderSettings = renderSettings;
    renderSettings = function() {
      _renderSettings();
      if (showFullSettings) renderFullSettings();
      else renderMenuSettingsBtn();
    };
    var _loop = loop;
    loop = function(t) {
      try {
        if (paused && appState === 'playing') {
          requestAnimationFrame(loop);
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          renderPauseMenu();
          if (showFullSettings) renderFullSettings();
          if (splashVisible) renderSplash();
          return;
        }
        _loop(t);
        if (splashVisible) renderSplash();
        if (showFullSettings) renderFullSettings();
      } catch (err) {
        try {
          var el = document.getElementById('__err__');
          if (!el) {
            el = document.createElement('div');
            el.id = '__err__';
            el.style.cssText =
              'position:fixed;bottom:0;left:0;right:0;background:rgba(160,20,20,0.92);color:#fff;font:11px monospace;padding:6px 8px;z-index:99999;max-height:35vh;overflow:auto;white-space:pre-wrap';
            document.body.appendChild(el);
          }
          el.textContent += '⚠ loop: ' + (err && err.message || err) + '\n';
        } catch (e) {}
        requestAnimationFrame(loop);
      }
    };

    var _initCanvas = initCanvas;
    initCanvas = function() {
      detectSafeAreas();
      DPR = Math.min(window.devicePixelRatio || 1, 3);
      cw = window.innerWidth || document.documentElement.clientWidth || 360;
      var h = window.innerHeight || document.documentElement.clientHeight ||
        640;
      ch = h - SAFE_TOP - SAFE_BOTTOM;
      if (ch < 200) ch = h;
      if (cw < 50) cw = 360;
      if (ch < 50) ch = 640;
      canvas.width = Math.floor(cw * DPR);
      canvas.height = Math.floor(ch * DPR);
      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
      canvas.style.top = SAFE_TOP + 'px';
      canvas.style.left = '0';
      canvas.style.position = 'absolute';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.imageSmoothingEnabled = true;
      recalcView();
      if (!tileCache.grass) prerenderTiles();
    };
    initCanvas();
    window.addEventListener('resize', function() {
      setTimeout(function() {
        initCanvas();
        boundCamera()
      }, 50)
    });
    window.addEventListener('orientationchange', function() {
      setTimeout(function() {
        initCanvas();
        boundCamera()
      }, 200)
    });

    var _tickSparks = tickSparks;
    tickSparks = function(dt) {
      if (getSetting('quality', 'high') === 'low') {
        if (sparks.length > 30) sparks.splice(0, sparks.length - 30)
      }
      _tickSparks(dt);
    };
    var _tickHearts = tickHearts;
    tickHearts = function(dt) {
      if (getSetting('quality', 'high') === 'low') {
        if (hearts.length > 10) hearts.splice(0, hearts.length - 10)
      }
      _tickHearts(dt);
    };

    try {
      CHANGELOG.unshift({
        version: '4.0.0',
        date: '16.10.2026',
        title: 'Современная эпик-музыка',
        changes: [{
            t: 'new',
            text: 'Новая музыка: современный эпик-трейлер (Am–F–C–G)'
          },
          {
            t: 'new',
            text: 'Супер-пила-пэды с фильтр-свипом и сайдчейном'
          },
          {
            t: 'new',
            text: '808-суб, плак-арпеджио, героический лид с вибрато'
          },
          {
            t: 'new',
            text: 'Марш-барабаны: тайко-бочка, клэп, хэт'
          },
          {
            t: 'new',
            text: 'Кнопка настроек ⚙️ в главном меню'
          },
          {
            t: 'new',
            text: 'Переключение языка: Русский / English'
          },
          {
            t: 'new',
            text: 'Качество: Высокое / Низкое'
          },
          {
            t: 'new',
            text: 'Splash-экран при запуске'
          },
          {
            t: 'new',
            text: 'Пауза с меню'
          },
          {
            t: 'new',
            text: 'Поддержка вырезов iPhone (safe areas)'
          },
          {
            t: 'fix',
            text: 'Исправлены кнопки в настройках (двойной клик)'
          },
          {
            t: 'fix',
            text: 'Убран старый звуковой движок — не виснет на старте'
          }
        ]
      });
      APP_VERSION = '4.0.0';
      checkChangelog();
    } catch (e) {}
  })();
</script>

<!-- ═══════════════════════════════════════════════════════
     ПАТЧ 3.0: РОЛИ ИЗ 2.9 + ВСЁ ИЗ 4.0 → СВОДНАЯ 3.0
     ═══════════════════════════════════════════════════════ -->
<script>
(function() {
  'use strict';

  var ROLES = ['woodcutter', 'miner', 'hunter', 'warrior'];
  var ROLE_ICON  = {woodcutter:'🪓', miner:'⛏️', hunter:'🏹', warrior:'⚔️'};
  var ROLE_NAME  = {woodcutter:'Дровосек', miner:'Шахтёр', hunter:'Охотник', warrior:'Воин'};
  var ROLE_COLOR = {woodcutter:'#a87a3a', miner:'#7a8a9a', hunter:'#4aa85a', warrior:'#c84a3a'};
  function randRole() {
    var r = Math.random();
    if (r < 0.30) return 'woodcutter';
    if (r < 0.55) return 'miner';
    if (r < 0.80) return 'hunter';
    return 'warrior';
  }
  window.ROLES = ROLES;
  window.ROLE_ICON = ROLE_ICON;
  window.ROLE_NAME = ROLE_NAME;
  window.ROLE_COLOR = ROLE_COLOR;

  var _makeBeing = makeBeing;
  makeBeing = function(x, y, type, isBaby, gender, villageId) {
    var b = _makeBeing(x, y, type, isBaby, gender, villageId);
    if (b && (type === 'human' || type === 'troll') && !b.role) {
      b.role = randRole();
    }
    return b;
  };

  var _ser = serializeWorld;
  serializeWorld = function() {
    var d = _ser();
    for (var i = 0; i < d.beings.length; i++) {
      if (beings[i]) d.beings[i].role = beings[i].role || null;
    }
    return d;
  };
  var _app = applyLoadedData;
  applyLoadedData = function(d) {
    _app(d);
    for (var i = 0; i < beings.length; i++) {
      var sv = d.beings && d.beings[i];
      if (sv && sv.role && (beings[i].type === 'human' || beings[i].type === 'troll')) {
        beings[i].role = sv.role;
      } else if ((beings[i].type === 'human' || beings[i].type === 'troll') && !beings[i].role) {
        beings[i].role = randRole();
      }
    }
  };

  var _paintBeing = paintBeing;
  paintBeing = function(u) {
    _paintBeing(u);
    if (!u.role || (u.type !== 'human' && u.type !== 'troll') || u.isBaby) return;
    if (u.hp <= 0) return;
    var s = u.size;
    var iy = u.y - s * 2.9;
    ctx.fillStyle = 'rgba(20,12,40,0.75)';
    roundRect(u.x - 9, iy - 8, 18, 16, 4);
    ctx.fill();
    ctx.strokeStyle = ROLE_COLOR[u.role];
    ctx.lineWidth = 1.3;
    roundRect(u.x - 9, iy - 8, 18, 16, 4);
    ctx.stroke();
    ctx.font = 'bold 11px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(ROLE_ICON[u.role], u.x, iy + 1);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  };

  var _renderInspect = renderInspectPanel;
  renderInspectPanel = function() {
    _renderInspect();
    if (!inspected || inspected.type !== 'being') return;
    var u = inspected.ref;
    if (!u.role || (u.type !== 'human' && u.type !== 'troll') || u.isBaby) return;
    var pw = Math.min(280, cw - 30);
    var px = (cw - pw) / 2;
    var py = 60;
    var bx = px + pw / 2 - 65, by = py - 32, bw = 130, bh = 26;
    ctx.fillStyle = ROLE_COLOR[u.role];
    roundRect(bx, by, bw, bh, 10);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.8;
    roundRect(bx, by, bw, bh, 10);
    ctx.stroke();
    ctx.font = 'bold 13px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(ROLE_ICON[u.role] + ' ' + ROLE_NAME[u.role], bx + bw / 2, by + bh / 2 + 1);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  };

  var _findMnt = findNearestMountain;
  findNearestMountain = function(x, y, maxDist) {
    for (var i = 0; i < beings.length; i++) {
      var u = beings[i];
      if (Math.abs(u.x - x) < 1 && Math.abs(u.y - y) < 1) {
        if (u.role && u.role !== 'miner' && u.role !== 'warrior') return null;
        break;
      }
    }
    return _findMnt(x, y, maxDist);
  };

  var _tickBeings = tickBeings;
  tickBeings = function(dt) {
    for (var i = 0; i < beings.length; i++) {
      beings[i]._pxRole = beings[i].x;
      beings[i]._pyRole = beings[i].y;
    }
    _tickBeings(dt);
    for (var j = 0; j < beings.length; j++) {
      var u = beings[j];
      if (!u.role || (u.type !== 'human' && u.type !== 'troll')) continue;
      if (u.isBaby) continue;
      var a = u.currentAction;
      var bad = false;
      if (u.role === 'woodcutter' && (a === 'mine' || a === 'walk_to_mine')) bad = true;
      if (u.role === 'miner' && (a === 'chop' || a === 'walk_to_tree')) bad = true;
      if (u.role === 'hunter' && (a === 'chop' || a === 'walk_to_tree' ||
                                   a === 'mine' || a === 'walk_to_mine')) bad = true;
      if (bad) {
        u.x = u._pxRole;
        u.y = u._pyRole;
        u.vx = Math.cos(u.wanderA) * u.speed * 0.42;
        u.vy = Math.sin(u.wanderA) * u.speed * 0.42;
        u.currentAction = 'wander';
      }
    }
  };

  try {
    CHANGELOG.unshift({
      version: '3.0.0',
      date: '16.10.2026',
      title: 'Сводная 3.0: роли + империя',
      changes: [
        {t:'new', text:'Роли жителей возвращены: 🪓 дровосек, ⛏️ шахтёр, 🏹 охотник, ⚔️ воин'},
        {t:'new', text:'Иконка роли над каждым жителем деревни'},
        {t:'new', text:'Бейдж роли в панели осмотра существа'},
        {t:'imp', text:'Роль сохраняется в сохранении и восстанавливается'},
        {t:'imp', text:'Только шахтёры (и воины) идут к горным жилам'},
        {t:'imp', text:'Дровосек не рубит камень, шахтёр не рубит деревья'},
        {t:'imp', text:'Все системы 4.0 сохранены: империя, войны, союзы, набеги'},
        {t:'imp', text:'Кузница, таверна, башня, стены, король, приказы — работают'},
        {t:'imp', text:'Музыка, пауза, splash, EN/RU, качество — работают'},
        {t:'fix', text:'Версия переименована в 3.0 как сводная'}
      ]
    });
    APP_VERSION = '3.0.0';
    try { checkChangelog(); } catch (e) {}
  } catch (e) {}

  try { document.title = 'Кубия 3.0'; } catch (e) {}
})();
</script>
